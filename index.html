function SpinModal({seekerName,pendingCount,onClose,onResult}){
  const [rotation,setRotation]=useState(0);
  const [spinning,setSpinning]=useState(false);
  const [won,setWon]=useState(null);
  const [pendingWin,setPendingWin]=useState(null);

  function playSpinSound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      const times=[];let t=0;
      while(t<4.0){
        times.push(t);
        const bell=Math.sin((t/4.2)*Math.PI);
        t+=0.5-bell*0.46;
      }
      times.forEach(t=>{
        const osc=ctx.createOscillator(),g=ctx.createGain();
        osc.connect(g);g.connect(ctx.destination);
        osc.type='triangle';osc.frequency.value=900;
        const n=ctx.currentTime;
        g.gain.setValueAtTime(0,n+t);
        g.gain.linearRampToValueAtTime(0.28,n+t+0.004);
        g.gain.linearRampToValueAtTime(0,n+t+0.028);
        osc.start(n+t);osc.stop(n+t+0.032);
      });
    }catch(e){}
  }

  function playCelebrationSound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [523,659,784,1047,1319].forEach((freq,i)=>{
        const osc=ctx.createOscillator(),g=ctx.createGain();
        osc.connect(g);g.connect(ctx.destination);
        osc.type='sine';osc.frequency.value=freq;
        const s=ctx.currentTime+i*0.12;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.35,s+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,s+0.55);
        osc.start(s);osc.stop(s+0.6);
      });
      [784,1047,1319,1568,1047].forEach((freq,i)=>{
        const osc=ctx.createOscillator(),g=ctx.createGain();
        osc.connect(g);g.connect(ctx.destination);
        osc.type='triangle';osc.frequency.value=freq;
        const s=ctx.currentTime+i*0.1+0.06;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.18,s+0.04);
        g.gain.exponentialRampToValueAtTime(0.001,s+0.45);
        osc.start(s);osc.stop(s+0.5);
      });
    }catch(e){}
  }

  function handleSpin(){
    if(spinning||won)return;
    playSpinSound();
    const rand=Math.random();
    let cum=0,winner=SPIN_PRIZES[0];
    for(const p of SPIN_PRIZES){cum+=p.prob;if(rand<cum){winner=p;break;}}
    setPendingWin(winner);
    setSpinning(true);
    const mid=winner.start+winner.span/2;
    const finalDeg=(360-mid%360+360)%360;
    setTimeout(()=>setRotation(1800+finalDeg),20);
  }

  function handleTransitionEnd(e){
    if(e.propertyName!=='transform'||!spinning)return;
    setSpinning(false);
    if(pendingWin){setWon(pendingWin);onResult(pendingWin.value);playCelebrationSound();}
  }

  const size=270;
  const R=size/2;
  const conicGrad='conic-gradient('+SPIN_PRIZES.map(p=>`${p.color} ${p.start}deg ${p.start+p.span}deg`).join(',')+')';
  const starDeco=[{s:'★',c:'#FFD700'},{s:'✦',c:'#FF6B00'},{s:'★',c:'#E63333'},{s:'✦',c:'#22AA44'},{s:'★',c:'#2277EE'},{s:'✦',c:'#8833BB'},{s:'★',c:'#FF69B4'},{s:'✦',c:'#DDAA00'}];

  return(
    <div className="spin-overlay" style={{flexDirection:'column',gap:0}}>
      {won&&<Confetti/>}
      {!won?(
        <>
          <div style={{textAlign:'center',marginBottom:16,zIndex:1}}>
            <div style={{fontSize:'1.5rem',fontWeight:900,color:'#FFD700',letterSpacing:'.06em',textShadow:'0 2px 16px rgba(255,215,0,.7)'}}>🎰 ROLETA DA SORTE</div>
            <div style={{fontSize:'.78rem',color:'rgba(255,255,255,.88)',fontWeight:700,marginTop:7}}>Parabéns, {seekerName}! Você tem uma indicação premiada!</div>
            {pendingCount>1&&<div style={{fontSize:'.68rem',color:'#FF7700',fontWeight:800,marginTop:5}}>{pendingCount} chances pendentes — gire uma por vez</div>}
          </div>

          <div style={{position:'relative',width:size+80,height:size+80,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            {starDeco.map(({s,c},i)=>(
              <div key={i} style={{position:'absolute',fontSize:i%2===0?'1.4rem':'1rem',color:c,top:'50%',left:'50%',transform:`rotate(${i*45}deg) translateY(-${size/2+30}px) rotate(-${i*45}deg)`,textShadow:`0 0 10px ${c}`,pointerEvents:'none'}}>{s}</div>
            ))}
            <div style={{position:'relative',width:size,height:size,flexShrink:0}}>
              <div style={{position:'absolute',top:-14,left:'50%',transform:'translateX(-50%)',fontSize:'1.6rem',lineHeight:1,zIndex:3,filter:'drop-shadow(0 2px 4px rgba(0,0,0,.7))'}}>▼</div>
              <div style={{position:'absolute',inset:-6,borderRadius:'50%',background:'linear-gradient(135deg,#FFD700,#FF8C00,#E63333,#8833BB,#2277EE,#22AA44)',zIndex:0}}/>
              <div onTransitionEnd={handleTransitionEnd} style={{position:'absolute',inset:0,borderRadius:'50%',background:conicGrad,transform:`rotate(${rotation}deg)`,transition:spinning?'transform 4.2s cubic-bezier(0.17,0.67,0.12,0.99)':'none',zIndex:1}}>
                {SPIN_PRIZES.map(p=>{
                  const mid=p.start+p.span/2;
                  const rad=mid*Math.PI/180;
                  const r=0.60*R;
                  const x=R+r*Math.sin(rad);
                  const y=R-r*Math.cos(rad);
                  return(<div key={p.value} style={{position:'absolute',left:x,top:y,transform:`translate(-50%,-50%) rotate(${mid}deg)`,color:'#fff',fontWeight:900,fontSize:'.70rem',textShadow:'0 1px 3px rgba(0,0,0,.9)',whiteSpace:'nowrap',pointerEvents:'none',lineHeight:1}}>{p.label}</div>);
                })}
              </div>
              <div style={{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:28,height:28,borderRadius:'50%',background:'#fff',boxShadow:'0 2px 10px rgba(0,0,0,.5)',zIndex:4}}/>
            </div>
          </div>

          <button onClick={handleSpin} disabled={spinning} style={{marginTop:22,padding:'15px 44px',borderRadius:50,border:'none',cursor:spinning?'not-allowed':'pointer',background:spinning?'#555':'linear-gradient(135deg,#FF6B00,#E63333)',color:'#fff',fontWeight:900,fontSize:'1.15rem',letterSpacing:'.04em',boxShadow:spinning?'none':'0 4px 22px rgba(230,51,51,.65)',transition:'all .2s'}}>{spinning?'Girando...':'🎯  GIRAR!'}</button>
        </>
      ):(
        <>
          <div style={{fontSize:'4.5rem',textAlign:'center',animation:'prize-pop .5s ease'}}>🎉</div>
          <div style={{textAlign:'center',marginTop:10}}>
            <div style={{fontSize:'.9rem',fontWeight:700,color:'rgba(255,255,255,.8)',marginBottom:10}}>Você ganhou</div>
            <div style={{fontSize:'3.5rem',fontWeight:900,lineHeight:1.1,background:'linear-gradient(135deg,#FFD700,#FF8C00)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',animation:'prize-pop .5s ease'}}>R$ {won.value}</div>
            <div style={{fontSize:'.85rem',color:'rgba(255,255,255,.7)',fontWeight:600,marginTop:10}}>de Bônus Roleta! 🎰</div>
          </div>
          <button onClick={onClose} style={{marginTop:30,padding:'14px 48px',borderRadius:50,border:'none',cursor:'pointer',background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',fontWeight:900,fontSize:'1rem',boxShadow:'0 4px 18px rgba(29,122,58,.45)'}}>Fechar</button>
        </>
      )}
    </div>
  );
}

  useEffect(()=>{
    async function boot(){
      cleanupLegacyStorageKeys();
      // Fase 1 — tabelas críticas para login (aparece rápido)
      const [
        {data:mRows,error:e1},{data:cRows},{data:admRows,error:eAdm},{data:jrRows},
      ]=await Promise.all([
        db.from('members').select('*'),

        db.from('adms').select('*'),

      ]);
      if(e1)console.error('[SEEK boot] members error:',e1);

      setAdms((admRows||[]).map(mAdm));
      setCredentials(buildCreds(cRows));
      setSeekJrs((jrRows||[]).map(mSeekJr));
      setLoading(false); // ← tela de login aparece aqui
      // Fase 2 — resto dos dados em background (enquanto usuário digita login)
      const [
        {data:rRows},{data:reqRows},{data:jrRefRows},
        {data:notifRows},{data:offerRows},{data:spinRows},{data:spinPendingRows},
        {data:chestPendingRows},{data:chestRewardRows},
      ]=await Promise.all([
        db.from('referrals').select('*'),
        db.from('pass_requests').select('*'),
        db.from('jr_referrals').select('*'),
        db.from('level_notifs').select('*'),
        db.from('offers').select('*'),
        db.from('spin_rewards').select('*'),
        db.from('spin_pending').select('*'),
        db.from('chest_pending').select('*').eq('used',false),
        db.from('chest_rewards').select('*'),
      ]);
      setReferrals((rRows||[]).map(mRef));
      setPassReqs((reqRows||[]).map(mPassReq));
      setJrReferrals((jrRefRows||[]).map(mJrRef));
      setLevelNotifs((notifRows||[]).map(mNotif));
      setOffers((offerRows||[]).map(mOffer));
      setSpinRewards((spinRows||[]).map(mSpin));
      setPendingSpins((spinPendingRows||[]).map(mSpinPending));
      setChestPending((chestPendingRows||[]).map(mChestPending));
      setChestRewards((chestRewardRows||[]).map(mChestReward));
    }
    boot();
  },[]);

  function checkLevelUp(memberId,oldRefs,newRefs){
    const oldPts=calcPoints(oldRefs.filter(r=>sameId(r.memberId,memberId)).reduce((s,r)=>s+r.productValue,0));
    const newPts=calcPoints(newRefs.filter(r=>sameId(r.memberId,memberId)).reduce((s,r)=>s+r.productValue,0));
    const oldLv=getSeekLevel(oldPts);
    const newLv=getSeekLevel(newPts);
    if(newLv.id!==oldLv.id&&newLv.min>oldLv.min){
      db.from('level_notifs').insert({member_id:String(memberId),level_id:newLv.id,dismissed:false}).select().single()
        .then(({data})=>{if(data)setLevelNotifs(u=>[...u,mNotif(data)]);});
    }
  }

  async function addMember(data,admId){
    const rawL=(data.whatsapp||data.login||'').replace(/\D/g,'');
    const {data:row,error}=await db.from('members').insert({name:data.name,whatsapp:rawL,pix_key:data.pixKey,notes:data.notes,adm_id:admId||null}).select().single();
    if(error||!row){console.error('[addMember]',error);return;}
    setMembers(u=>[...u,mMember(row)]);
    await db.from('credentials').insert({key:String(row.id),login:rawL,pin:data.pin||'0000'});
    setCredentials(u=>({...u,[String(row.id)]:{login:rawL,pin:data.pin||'0000'}}));
  }

  async function updateMember(mid,data){
    const rawL=(data.whatsapp||'').replace(/\D/g,'');
    await db.from('members').update({name:data.name,whatsapp:rawL,pix_key:data.pixKey,notes:data.notes}).eq('id',mid);
    setMembers(u=>u.map(m=>sameId(m.id,mid)?{...m,...data,whatsapp:rawL}:m));
    if(data.whatsapp!==undefined){
      await db.from('credentials').update({login:rawL}).eq('key',String(mid));
      setCredentials(u=>{const k=Object.keys(u).find(k=>sameId(k,mid));if(!k)return u;return{...u,[k]:{...u[k],login:rawL}};});
    }
  }

  async function deleteMember(mid){
    const midStr=String(mid);
    const jrIds=seekJrs.filter(j=>sameId(j.seekId,mid)).map(j=>String(j.id));
    await Promise.all([
      db.from('referrals').delete().eq('member_id',midStr),
      jrIds.length?db.from('jr_referrals').delete().in('jr_id',jrIds):Promise.resolve(),
      jrIds.length?db.from('seek_jrs').delete().in('id',jrIds):Promise.resolve(),
      db.from('credentials').delete().eq('key',midStr),
      ...jrIds.map(jid=>db.from('credentials').delete().eq('key',`jr_${jid}`)),
      db.from('members').delete().eq('id',mid),
      db.from('spin_rewards').delete().eq('seek_id',midStr),
      jrIds.length?db.from('spin_rewards').delete().in('jr_id',jrIds):Promise.resolve(),
      db.from('spin_pending').delete().eq('seek_id',midStr),
      jrIds.length?db.from('spin_pending').delete().in('jr_id',jrIds):Promise.resolve(),
      db.from('chest_rewards').delete().eq('seek_id',midStr),
      jrIds.length?db.from('chest_rewards').delete().in('jr_id',jrIds):Promise.resolve(),
      db.from('chest_pending').delete().eq('seek_id',midStr),
      jrIds.length?db.from('chest_pending').delete().in('jr_id',jrIds):Promise.resolve(),
    ]);
    setMembers(u=>u.filter(m=>!sameId(m.id,mid)));
    setSeekJrs(u=>u.filter(j=>!sameId(j.seekId,mid)));
    setReferrals(u=>u.filter(r=>!sameId(r.memberId,mid)));
    setJrReferrals(u=>u.filter(r=>!jrIds.some(jid=>sameId(r.jrId,jid))));
    setCredentials(u=>{const nc={...u};delete nc[midStr];jrIds.forEach(jid=>delete nc[`jr_${jid}`]);return nc;});
    setSpinRewards(u=>u.filter(s=>!sameId(s.seekId,mid)&&!jrIds.some(jid=>sameId(s.jrId,jid))));
    setPendingSpins(u=>u.filter(s=>!sameId(s.seekId,mid)&&!jrIds.some(jid=>sameId(s.jrId,jid))));
    setChestRewards(u=>u.filter(c=>!sameId(c.seekId,mid)&&!jrIds.some(jid=>sameId(c.jrId,jid))));
    setChestPending(u=>u.filter(c=>!sameId(c.seekId,mid)&&!jrIds.some(jid=>sameId(c.jrId,jid))));
  }

      admMids.length?db.from('members').delete().in('id',admMids.map(Number)):Promise.resolve(),
      db.from('credentials').delete().eq('key',`adm_${admStr}`),

  }

  async function addReferral(data,memberId){
    const old=[...referrals];
    const mid=String(memberId);
    const hasProduct=(data.productValue||0)>0;
    const refStatus=hasProduct?'a_pagar':'aguardando';
    // Otimista: insere na UI antes de esperar o DB
    const tmpId=`__tmp_${Date.now()}`;
    const tmpRef={id:tmpId,memberId:mid,clientName:data.clientName,whatsapp:data.whatsapp||null,productType:data.productType||'auto',productValue:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,isNew:data.isNew!==false,status:refStatus,observacoes:data.observacoes||null,paidAt:null,createdAt:new Date().toISOString()};
    const withTmp=[...referrals,tmpRef];
    setReferrals(withTmp);
    checkLevelUp(mid,old,withTmp);
    let {data:saved,error}=await db.from('referrals').insert({member_id:mid,client_name:data.clientName,whatsapp:data.whatsapp||null,product_type:data.productType||'auto',product_value:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,is_new:data.isNew!==false,status:refStatus,observacoes:data.observacoes||null}).select().single();
    if(error&&error.code==='42703'){
      ({data:saved,error}=await db.from('referrals').insert({member_id:mid,client_name:data.clientName,whatsapp:data.whatsapp||null,product_type:data.productType||'auto',product_value:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,is_new:data.isNew!==false}).select().single());
    }
    if(error){console.error('[addReferral] ERRO:',error);setReferrals(old);setDbError('Erro ao salvar indicação: '+error.message);return;}
    setReferrals(u=>u.map(r=>r.id===tmpId?mRef(saved):r));
  }

    let {error}=await db.from('referrals').update({paid:newPaid,status:newStatus,paid_at:paidAt}).eq('id',rid);

  }

  async function markReferralSold(rid,data,isJr){
    if(isJr){
      const ref=jrReferrals.find(r=>sameId(r.id,rid));
      if(!ref)return;
      setJrReferrals(u=>u.map(r=>sameId(r.id,rid)?{...r,...data,status:'a_pagar',paid:false}:r));
      let {error}=await db.from('jr_referrals').update({product_type:data.productType,product_value:data.productValue,commission:data.commission,year:data.year,month:data.month,day:data.day,paid:false,status:'a_pagar'}).eq('id',rid);
      if(error&&error.code==='42703')({error}=await db.from('jr_referrals').update({product_type:data.productType,product_value:data.productValue,commission:data.commission,year:data.year,month:data.month,day:data.day,paid:false}).eq('id',rid));
      if(error)console.error('[markReferralSold jr]',error);
      addSpinPending(null,String(ref.jrId),String(rid));
    }else{
      const ref=referrals.find(r=>sameId(r.id,rid));
      if(!ref)return;
      const oldRefs=[...referrals];
      const newRefs=referrals.map(r=>sameId(r.id,rid)?{...r,...data,status:'a_pagar',paid:false}:r);
      setReferrals(newRefs);
      checkLevelUp(ref.memberId,oldRefs,newRefs);
      let {error}=await db.from('referrals').update({product_type:data.productType,product_value:data.productValue,commission:data.commission,year:data.year,month:data.month,day:data.day,paid:false,status:'a_pagar'}).eq('id',rid);
      if(error&&error.code==='42703')({error}=await db.from('referrals').update({product_type:data.productType,product_value:data.productValue,commission:data.commission,year:data.year,month:data.month,day:data.day,paid:false}).eq('id',rid));
      if(error)console.error('[markReferralSold]',error);
      addSpinPending(String(ref.memberId),null,String(rid));
    }
  }

  async function addSpinReward(seekId,jrId,referralId,value){
    const{data:saved,error}=await db.from('spin_rewards').insert({seek_id:seekId||null,jr_id:jrId||null,referral_id:referralId?String(referralId):null,value,used:true}).select().single();
    if(error){console.error('[addSpinReward]',error);return;}
    const newSpin=mSpin(saved);
    setSpinRewards(u=>{
      const next=[...u,newSpin];
      // a cada 2 giros do mesmo SEEK ou JR → novo cofre
      const ownerId=jrId?jrId:seekId;
      const field=jrId?'jrId':'seekId';
      const count=next.filter(s=>sameId(s[field],ownerId)).length;
      if(count>0&&count%2===0)setTimeout(()=>addChestPending(seekId,jrId),50);
      return next;
    });
  }

    if(error){console.error('[toggleSpinPaid]',error);setSpinRewards(u=>u.map(s=>sameId(s.id,spinId)?{...s,paid:spin.paid}:s));}

  async function payAllForSeek(seekId){
    const now=new Date().toISOString();
    const seekIdStr=String(seekId);
    setReferrals(u=>u.map(r=>sameId(r.memberId,seekId)&&!r.paid?{...r,paid:true,status:'pago',paidAt:now}:r));
    setSpinRewards(u=>u.map(s=>sameId(s.seekId,seekId)&&!s.paid?{...s,paid:true}:s));
    setChestRewards(u=>u.map(c=>sameId(c.seekId,seekId)&&!c.paid?{...c,paid:true}:c));
    let {error:er}=await db.from('referrals').update({paid:true,status:'pago',paid_at:now}).eq('member_id',seekIdStr);
    if(er&&er.code==='42703')await db.from('referrals').update({paid:true}).eq('member_id',seekIdStr);
    else if(er)console.error('[payAllForSeek]:',er);
    await db.from('spin_rewards').update({paid:true}).eq('seek_id',seekIdStr);
    await db.from('chest_rewards').update({paid:true}).eq('seek_id',seekIdStr);
  }

  async function payAllForJr(jrId){
    const now=new Date().toISOString();
    const jrIdStr=String(jrId);
    setJrReferrals(u=>u.map(r=>sameId(r.jrId,jrId)&&!r.paid?{...r,paid:true,status:'pago',paidAt:now}:r));
    setSpinRewards(u=>u.map(s=>sameId(s.jrId,jrId)&&!s.paid?{...s,paid:true}:s));
    setChestRewards(u=>u.map(c=>sameId(c.jrId,jrId)&&!c.paid?{...c,paid:true}:c));
    let {error:ej}=await db.from('jr_referrals').update({paid:true,status:'pago',paid_at:now}).eq('jr_id',jrIdStr);
    if(ej&&ej.code==='42703')await db.from('jr_referrals').update({paid:true}).eq('jr_id',jrIdStr);
    else if(ej)console.error('[payAllForJr]:',ej);
    await db.from('spin_rewards').update({paid:true}).eq('jr_id',jrIdStr);
    await db.from('chest_rewards').update({paid:true}).eq('jr_id',jrIdStr);
  }

  async function toggleJrPaid(rid){
    const ref=jrReferrals.find(r=>sameId(r.id,rid));
    if(!ref)return;
    const newPaid=!ref.paid;
    const newStatus=newPaid?'pago':'a_pagar';
    const paidAt=newPaid?new Date().toISOString():null;
    setJrReferrals(u=>u.map(r=>sameId(r.id,rid)?{...r,paid:newPaid,status:newStatus,paidAt}:r));
    setSpinRewards(u=>u.map(s=>sameId(s.referralId,rid)?{...s,paid:newPaid}:s));
    const {error:spinErr}=await db.from('spin_rewards').update({paid:newPaid}).eq('referral_id',String(rid));
    if(spinErr)console.error('[toggleJrPaid] spin_rewards erro:',spinErr);
    let {error}=await db.from('jr_referrals').update({paid:newPaid,status:newStatus,paid_at:paidAt}).eq('id',rid);
    if(error&&error.code==='42703')({error}=await db.from('jr_referrals').update({paid:newPaid}).eq('id',rid));
    if(error){console.error('[toggleJrPaid]',error);setJrReferrals(u=>u.map(r=>sameId(r.id,rid)?{...r,paid:ref.paid,status:ref.status,paidAt:ref.paidAt}:r));}
  }

  async function deleteJrReferral(rid){
    await db.from('jr_referrals').delete().eq('id',rid);
    setJrReferrals(u=>u.filter(r=>r.id!==rid));
  }

  async function dismissLevelNotif(notifId){
    await db.from('level_notifs').update({dismissed:true}).eq('id',notifId);
    setLevelNotifs(u=>u.map(n=>sameId(n.id,notifId)?{...n,dismissed:true}:n));
  }

  async function addOffer(data){
    const {data:saved,error}=await db.from('offers').insert({url:data.url,caption:data.caption||'',category:data.category||'zero-km'}).select().single();
    if(error){console.error('[addOffer]',error);setDbError('Erro ao salvar oferta: '+error.message);return;}
    setOffers(u=>[...u,mOffer(saved)]);
  }

  async function deleteOffer(id){
    await db.from('offers').delete().eq('id',id);
    setOffers(u=>u.filter(o=>o.id!==id));
  }

  async function markRead(id,type){
    console.log('[markRead] chamado id='+id+' type='+type);
    if(type==='forgot'){
      setPassReqs(u=>u.map(r=>sameId(r.id,id)?{...r,resolved:true}:r));
      const {error}=await db.from('pass_requests').update({resolved:true}).eq('id',id);
      if(error)console.error('[markRead] pass_requests erro:',error);
      else console.log('[markRead] pass_requests ok');
    } else if(type==='jr'){
      setSeekJrs(u=>u.map(j=>sameId(j.id,id)?{...j,isNew:false}:j));
      const {error}=await db.from('seek_jrs').update({is_new:false}).eq('id',id);
      if(error)console.error('[markRead] seek_jrs erro:',error);
      else console.log('[markRead] seek_jrs ok');
    } else {
      const inRefs=referrals.some(r=>sameId(r.id,id));
      console.log('[markRead] ref — inRefs:'+inRefs+' id:'+id);
      setReferrals(u=>u.map(r=>sameId(r.id,id)?{...r,isNew:false}:r));
      setJrReferrals(u=>u.map(r=>sameId(r.id,id)?{...r,isNew:false}:r));
      const table=inRefs?'referrals':'jr_referrals';
      const {error}=await db.from(table).update({is_new:false}).eq('id',id);
      if(error)console.error('[markRead] '+table+' erro:',error);
      else console.log('[markRead] '+table+' ok id:'+id);
    }
  }

  function getPanel(){
    if(loading)return<Spinner/>;
    if(!session){
      return<LoginScreen onLogin={s=>{console.log('[SEEK route] onLogin received session:',s);setSession(s);}} credentials={credentials} members={members} seekJrs={seekJrs}/>;
    }
    console.log('[SEEK route] rendering for session:',session);

    /* Primeiro acesso: se o PIN é 0000, exigir troca antes de entrar no painel */
    if(session.role!=='master'){
      let firstKey=null;
      let firstName=null;
      if(session.role==='adm'){
        firstKey=`adm_${session.admId}`;
        const adm=adms.find(a=>sameId(a.id,session.admId));
        firstName=adm?adm.name:null;
      } else if(session.role==='member'){
        firstKey=String(session.memberId);
        const mb=members.find(m=>sameId(m.id,session.memberId));
        firstName=mb?mb.name:null;
      } else if(session.role==='jr'){
        firstKey=`jr_${session.jrId}`;
        const jr=seekJrs.find(j=>sameId(j.id,session.jrId));
        firstName=jr?jr.name:null;
      }
      const currentPin=(credentials[firstKey]||{}).pin||'0000';
      if(currentPin==='0000'){
        return<FirstLoginScreen userName={firstName} onSave={newPin=>updatePin(firstKey,newPin)} onLogout={()=>setSession(null)}/>;
      }
    }

    if(session.role==='jr'){
      const jr=seekJrs.find(j=>sameId(j.id,session.jrId));
      if(!jr){
        console.error('[SEEK route] JR routing FAILED — no seekJrs entry matches session.jrId.',{sessionJrId:session.jrId,availableJrIds:seekJrs.map(j=>j.id)});
        return<div style={{padding:40,textAlign:'center'}}>JR não encontrado. <button className="btn" onClick={()=>setSession(null)}>Sair</button></div>;
      }
      const seekMember=members.find(m=>sameId(m.id,jr.seekId));
      if(!seekMember){console.warn('[SEEK route] JR found, but its parent SEEK member was not found — JR panel will render with seekMember=undefined.',{jrSeekId:jr.seekId,availableMemberIds:members.map(m=>m.id)});}
      else{console.log(`[SEEK route] JR PANEL — jr="${jr.name}" (id=${jr.id}) seekMember="${seekMember.name}" (id=${seekMember.id})`);}
      const jrPending=pendingSpins.filter(s=>sameId(s.jrId,jr.id));
      if(jrPending.length>0){const first=jrPending[0];return<SpinModal seekerName={jr.name} pendingCount={jrPending.length} onResult={v=>addSpinReward(null,String(jr.id),first.referralId,v)} onClose={()=>consumeSpinPending(first.id)}/>;}
      const jrChests=chestPending.filter(c=>sameId(c.jrId,jr.id));
      if(jrChests.length>0){const first=jrChests[0];return<ChestModal seekerName={jr.name} onResult={v=>addChestReward(null,String(jr.id),v)} onClose={()=>consumeChestPending(first.id)}/>;}
      return<SeekJrPanel jr={jr} referrals={jrReferrals} seekMember={seekMember} credentials={credentials} onLogout={()=>setSession(null)} onAddReferral={addJrReferral} onChangePin={updatePin} offers={offers} spinRewards={spinRewards} chestRewards={chestRewards}/>;
    }
    if(session.role==='member'){
      const member=members.find(m=>sameId(m.id,session.memberId));
      if(!member){
        console.error('[SEEK route] SEEK routing FAILED — no members entry matches session.memberId.',{sessionMemberId:session.memberId,availableMemberIds:members.map(m=>m.id)});
        return<div style={{padding:40,textAlign:'center'}}>Membro não encontrado. <button className="btn" onClick={()=>setSession(null)}>Sair</button></div>;
      }
      console.log(`[SEEK route] SEEK PANEL — member="${member.name}" (id=${member.id})`);
      const memberPending=pendingSpins.filter(s=>sameId(s.seekId,member.id));
      if(memberPending.length>0){const first=memberPending[0];return<SpinModal seekerName={member.name} pendingCount={memberPending.length} onResult={v=>addSpinReward(String(member.id),null,first.referralId,v)} onClose={()=>consumeSpinPending(first.id)}/>;}
      const memberChests=chestPending.filter(c=>sameId(c.seekId,member.id));
      if(memberChests.length>0){const first=memberChests[0];return<ChestModal seekerName={member.name} onResult={v=>addChestReward(String(member.id),null,v)} onClose={()=>consumeChestPending(first.id)}/>;}
      return<MemberPanel member={member} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onLogout={()=>setSession(null)} onAddReferral={data=>addReferral(data,member.id)} onAddJr={addSeekJr} onChangePin={updatePin} levelNotifs={levelNotifs} onDismissNotif={dismissLevelNotif} offers={offers} spinRewards={spinRewards} chestRewards={chestRewards}/>;
    }
    if(session.role==='master'){
      return<MasterPanel adms={adms} members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} offers={offers} passReqs={passReqs} levelNotifs={levelNotifs} onLogout={()=>setSession(null)} onAddAdm={addAdm} onDeleteAdm={deleteAdm} onAddMember={addMember} onUpdateMember={updateMember} onDeleteMember={deleteMember} onUpdatePin={updatePin} onAddReferral={addReferral} onUpdateReferral={updateReferral} onTogglePaid={togglePaid} onDeleteReferral={deleteReferral} onAddSeekJr={addSeekJr} onDeleteSeekJr={deleteSeekJr} onAddJrReferral={addJrReferral} onToggleJrPaid={toggleJrPaid} onDeleteJrReferral={deleteJrReferral} onAddOffer={addOffer} onDeleteOffer={deleteOffer} onMarkRead={markRead} spinRewards={spinRewards} chestRewards={chestRewards} onMarkSold={markReferralSold} onUpdateJrReferral={updateJrReferral} onToggleSpinPaid={toggleSpinPaid}/>;
    }
    if(session.role==='adm'){
      const adm=adms.find(a=>sameId(a.id,session.admId));
      if(!adm)return<div style={{padding:40,textAlign:'center'}}>Vendedor não encontrado. <button className="btn" onClick={()=>setSession(null)}>Sair</button></div>;
      const myMembers=members.filter(m=>sameId(m.admId,adm.id));
      const mySeekJrs=seekJrs.filter(j=>myMembers.some(m=>sameId(m.id,j.seekId)));
      const myReferrals=referrals.filter(r=>myMembers.some(m=>sameId(m.id,r.memberId)));
      const myJrReferrals=jrReferrals.filter(r=>mySeekJrs.some(j=>sameId(j.id,r.jrId)));
      return<VendedorPanel adm={adm} members={myMembers} referrals={myReferrals} jrReferrals={myJrReferrals} seekJrs={mySeekJrs} credentials={credentials} offers={offers} passReqs={passReqs} levelNotifs={levelNotifs} onLogout={()=>setSession(null)} onAddMember={addMember} onUpdateMember={updateMember} onDeleteMember={deleteMember} onUpdatePin={updatePin} onAddReferral={addReferral} onUpdateReferral={updateReferral} onTogglePaid={togglePaid} onDeleteReferral={deleteReferral} onAddSeekJr={addSeekJr} onDeleteSeekJr={deleteSeekJr} onAddJrReferral={addJrReferral} onToggleJrPaid={toggleJrPaid} onDeleteJrReferral={deleteJrReferral} onAddOffer={addOffer} onDeleteOffer={deleteOffer} onMarkRead={markRead} spinRewards={spinRewards} chestRewards={chestRewards} onMarkSold={markReferralSold} onUpdateJrReferral={updateJrReferral} onToggleSpinPaid={toggleSpinPaid} onPayAllForSeek={payAllForSeek} onPayAllForJr={payAllForJr}/>;
    }
    return null;
  }

  return<React.Fragment>
    {getPanel()}
    {dbError&&<div style={{position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',background:'#C0392B',color:'#fff',padding:'12px 20px',borderRadius:12,zIndex:9999,fontSize:'.82rem',fontWeight:700,maxWidth:'92vw',textAlign:'center',boxShadow:'0 4px 20px rgba(0,0,0,.4)',display:'flex',alignItems:'center',gap:12}}>
      <span>⚠️ {dbError}</span>
      <button onClick={()=>setDbError(null)} style={{background:'none',border:'1px solid rgba(255,255,255,.5)',color:'#fff',padding:'3px 10px',borderRadius:6,cursor:'pointer',fontFamily:'inherit',fontWeight:700,flexShrink:0}}>✕</button>
    </div>}
  </React.Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>





</body>
</html>
