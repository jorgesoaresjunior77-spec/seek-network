/* ══════════════════════════════════════════════════════════════════
   PAGAMENTO MÊS ANTERIOR — extrato mensal por SEEK/JR + WhatsApp/Impressão
══════════════════════════════════════════════════════════════════ */
function MesAnteriorPanel({adm,members,seekJrs,referrals,jrReferrals,spinRewards,chestRewards=[],challengeConfigs=[],onBack}){
  const now=new Date();
  const prevM=now.getMonth()===0?12:now.getMonth();
  const prevY=now.getMonth()===0?now.getFullYear()-1:now.getFullYear();
  const [pm,setPm]=useState(prevM);
  const [py,setPy]=useState(prevY);
  const years=Array.from({length:5},(_,i)=>now.getFullYear()-3+i);

  const monthRefs=referrals.filter(r=>r.month===pm&&r.year===py);
  const monthJrRefs=jrReferrals.filter(r=>r.month===pm&&r.year===py);
  const monthSpins=(spinRewards||[]).filter(s=>inMonth(s.createdAt,pm,py));
  const monthChests=(chestRewards||[]).filter(c=>inMonth(c.createdAt,pm,py));

  const sections=[];
  members.forEach(m=>{
    const mRefs=monthRefs.filter(r=>sameId(r.memberId,m.id));
    const{bonusSum:mBonus,debitSum:mDebit}=splitSpins(monthSpins.filter(s=>sameId(s.seekId,m.id)));
    const mChest=monthChests.filter(c=>sameId(c.seekId,m.id)).reduce((s,c)=>s+c.valor,0);
    const mChallenge=allChallengeBonuses(mRefs,challengeConfigs).reduce((s,c)=>s+c.amount,0);
    const mJrs=seekJrs.filter(j=>sameId(j.seekId,m.id));
    const jrSecs=[];
    mJrs.forEach(jr=>{
      const jRefs=monthJrRefs.filter(r=>sameId(r.jrId,jr.id));
      const{bonusSum:jBonus,debitSum:jDebit}=splitSpins(monthSpins.filter(s=>sameId(s.jrId,jr.id)));
      const jChest=monthChests.filter(c=>sameId(c.jrId,jr.id)).reduce((s,c)=>s+c.valor,0);
      const jChallenge=allChallengeBonuses(jRefs,challengeConfigs).reduce((s,c)=>s+c.amount,0);
      if(jRefs.length===0&&jBonus===0&&jDebit===0&&jChest===0&&jChallenge===0)return;
      jrSecs.push({name:jr.name,parentName:m.name,refs:jRefs,bonus:jBonus,debit:jDebit,chest:jChest,challenge:jChallenge,subtotal:jRefs.reduce((s,r)=>s+r.commission,0)+jBonus+jDebit+jChest+jChallenge});
    });
    if(mRefs.length===0&&mBonus===0&&mDebit===0&&mChest===0&&mChallenge===0&&jrSecs.length===0)return;
    sections.push({name:m.name,refs:mRefs,bonus:mBonus,debit:mDebit,chest:mChest,challenge:mChallenge,subtotal:mRefs.reduce((s,r)=>s+r.commission,0)+mBonus+mDebit+mChest+mChallenge,jrSecs});
  });
  const totalGeral=sections.reduce((s,sec)=>s+sec.subtotal+sec.jrSecs.reduce((s2,j)=>s2+j.subtotal,0),0);

  function buildText(){
    const SEP='━━━━━━━━━━━━━━━━━━━━━━━━━';
    function refLine(r){
      const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
      const st=r.paid?'Pago':'A Pagar';
      return `  Cliente: ${r.clientName} — ${pt.name} — Comissão: ${fBRL(r.commission)} — ${st}`;
    }
    function secLines(sec,label){
      const lines=[``,SEP,`👤 ${label}`,SEP];
      sec.refs.forEach(r=>lines.push(refLine(r)));
      if(sec.bonus>0)lines.push(`  🎰 Bônus Roleta: ${fBRL(sec.bonus)}`);
      if(sec.debit<0)lines.push(`  🎲 Débito Roleta: ${fBRL(sec.debit)}`);
      if(sec.chest>0)lines.push(`  🎁 Cofre: ${fBRL(sec.chest)}`);
      if(sec.challenge>0)lines.push(`  🏆 Desafio do Mês: ${fBRL(sec.challenge)}`);
      lines.push(`  Subtotal: ${fBRL(sec.subtotal)}`);
      return lines;
    }
    const dateStr=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;
    const lines=[
      `*SEEK NETWORK — PAGAMENTO ${MONTHS[pm-1].toUpperCase()} ${py}*`,
      `${adm.name}  |  Gerado em: ${dateStr}`,
    ];
    if(sections.length===0){
      lines.push(``,'Nenhuma movimentação neste mês.');
    }else{
      sections.forEach(sec=>{
        lines.push(...secLines(sec,sec.name));
        sec.jrSecs.forEach(j=>lines.push(...secLines(j,`${j.name} — JR de ${j.parentName}`)));
      });
    }
    lines.push(``,SEP,`TOTAL GERAL: ${fBRL(totalGeral)}`);
    return lines.join('\n');
  }

  function sendWhatsApp(){
    window.open(`https://wa.me/?text=${encodeURIComponent(buildText())}`,'_blank');
  }
  function handlePrint(){
    const div=document.createElement('div');
    div.className='print-only';
    div.style.cssText='font-family:monospace;white-space:pre-wrap;font-size:13px;padding:28px;color:#111;line-height:1.8;';
    div.textContent=buildText();
    document.body.appendChild(div);
    window.print();
    document.body.removeChild(div);
  }

  function SectionCard({sec,label}){
    return(
      <div style={{marginBottom:12}}>
        <div style={{background:'rgba(0,0,0,.04)',borderRadius:'12px 12px 0 0',padding:'10px 14px'}}>
          <span style={{fontWeight:900,fontSize:'.88rem'}}>{'👤 '}{label}</span>
        </div>
        <div className="nm" style={{borderRadius:'0 0 12px 12px',padding:'0 14px'}}>
          {sec.refs.map((r,i)=>{
            const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
            const stColor=r.paid?'var(--green)':'var(--red)';
            return(
              <React.Fragment key={r.id}>
                <div style={{padding:'11px 0'}}>
                  <div style={{fontWeight:800,fontSize:'.8rem',marginBottom:3}}>{'Cliente: '}{r.clientName}</div>
                  <div style={{fontSize:'.68rem',color:'var(--muted)',lineHeight:1.6,display:'flex',alignItems:'center',gap:6,flexWrap:'wrap'}}>
                    <span>{pt.icon}{' '}{pt.name}</span>
                    <span>{'· Comissão: '}<span style={{color:stColor,fontWeight:800}}>{fBRL(r.commission)}</span></span>
                    <span style={{marginLeft:'auto',fontWeight:800,color:stColor}}>{r.paid?'Pago':'A Pagar'}</span>
                  </div>
                </div>
                {i<sec.refs.length-1&&<div style={{height:1,background:'rgba(0,0,0,.06)'}}/>}
              </React.Fragment>
            );
          })}
          <div style={{borderTop:sec.refs.length?'2px solid rgba(0,0,0,.06)':'none',padding:'10px 0 12px'}}>
            {sec.bonus>0&&<div style={{fontSize:'.69rem',fontWeight:600,marginBottom:2}}>{'🎰 Bônus Roleta: '}<span style={{color:'#8833BB',fontWeight:800}}>{fBRL(sec.bonus)}</span></div>}
            {sec.debit<0&&<div style={{fontSize:'.69rem',fontWeight:600,marginBottom:2}}>{'🎲 Débito Roleta: '}<span style={{color:'var(--red)',fontWeight:800}}>{fBRL(sec.debit)}</span></div>}
            {sec.chest>0&&<div style={{fontSize:'.69rem',fontWeight:600,marginBottom:2}}>{'🎁 Cofre: '}<span style={{color:'#B8860B',fontWeight:800}}>{fBRL(sec.chest)}</span></div>}
            {sec.challenge>0&&<div style={{fontSize:'.69rem',fontWeight:600,marginBottom:2}}>{'🏆 Desafio do Mês: '}<span style={{color:'#B8860B',fontWeight:800}}>{fBRL(sec.challenge)}</span></div>}
            <div style={{fontSize:'.75rem',fontWeight:900,marginTop:2}}>{'Subtotal: '}<span>{fBRL(sec.subtotal)}</span></div>
          </div>
        </div>
      </div>
    );
  }

  return(
    <>
      <TopBar title="📅 Pagamento Mês Anterior" left={<button className="icon-btn" onClick={onBack}><IcLeft s={18}/></button>}/>
      <div className="page">
        <div className="nm" style={{padding:'14px 16px'}}>
          <div style={{display:'flex',gap:10}}>
            <select className="inp" style={{flex:1}} value={pm} onChange={e=>setPm(Number(e.target.value))}>{MONTHS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select>
            <select className="inp" style={{width:90}} value={py} onChange={e=>setPy(Number(e.target.value))}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
          </div>
        </div>
        <div style={{display:'flex',gap:10,marginBottom:16}}>
          <button className="btn btn-full" style={{gap:6,color:'#25D366'}} onClick={sendWhatsApp}>{'📲 WhatsApp'}</button>
          <button className="btn btn-full" style={{gap:6}} onClick={handlePrint}>{'🖨️ Imprimir'}</button>
        </div>
        {sections.length===0?<Empty text="Nenhuma movimentação neste mês."/>:sections.map(sec=>(
          <React.Fragment key={sec.name}>
            <SectionCard sec={sec} label={sec.name}/>
            {sec.jrSecs.map(j=><SectionCard key={j.name} sec={j} label={`${j.name} — JR de ${j.parentName}`}/>)}
          </React.Fragment>
        ))}
        {sections.length>0&&<div style={{padding:'14px 16px',background:'var(--black)',borderRadius:14,color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
          <span style={{fontSize:'.7rem',fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase',opacity:.75}}>{'TOTAL GERAL'}</span>
          <span style={{fontWeight:900,fontSize:'.95rem'}}>{fBRL(totalGeral)}</span>
        </div>}
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════════
   VENDEDOR PANEL (ADM role — dados filtrados por adm_id)
══════════════════════════════════════════════════════════════════ */
function VendedorPanel({adm,members,referrals,jrReferrals,seekJrs,credentials,offers,passReqs,levelNotifs,onLogout,onAddMember,onUpdateMember,onDeleteMember,onUpdatePin,onAddReferral,onUpdateReferral,onTogglePaid,onDeleteReferral,onAddSeekJr,onDeleteSeekJr,onAddJrReferral,onToggleJrPaid,onDeleteJrReferral,onAddOffer,onDeleteOffer,onMarkRead,spinRewards,chestRewards=[],onMarkSold,onUpdateJrReferral,onToggleSpinPaid,onPayAllForSeek,onPayAllForJr,challengeConfigs,onSaveChallengeConfig}){
  const [view,setView]=useState('dashboard');
  const [selMember,setSelMember]=useState(null);
  const [editRefDirect,setEditRefDirect]=useState(null);
  const [showOffers,setShowOffers]=useState(false);
  const [showChallenge,setShowChallenge]=useState(false);
  const [showBell,setShowBell]=useState(false);
  const [showHelp,setShowHelp]=useState(false);
  const now=new Date();
  const [sm,setSm]=useState(now.getMonth()+1);
  const [sy,setSy]=useState(now.getFullYear());

  const pendReqs=(passReqs||[]).filter(r=>!r.resolved);
  const newRefs=[...referrals,...jrReferrals].filter(r=>r.isNew);
  const newJrs=seekJrs.filter(j=>j.isNew);
  const badge=pendReqs.length+newRefs.length+newJrs.length;
  const allRefs=[...referrals,...jrReferrals];
  const curMember=selMember?members.find(m=>sameId(m.id,selMember.id))??selMember:null;
  const inSubView=['memberDetail','pending','paid','editRef','prevPending'].includes(view);
  const [calAutoDay,setCalAutoDay]=useState(null);
  const todayBdRefs=[...referrals,...jrReferrals].filter(r=>r.birthdayDay===now.getDate()&&r.birthdayMonth===now.getMonth()+1);

  function nav(dest,payload){if(dest==='editRef'){setEditRefDirect(payload);setView('editRef');}else setView(dest);}
  function updateRef(rid,data,isJr){return isJr?onUpdateJrReferral(rid,data):onUpdateReferral(rid,data);}
  function abrirCalendarioHoje(){setCalAutoDay(now.getDate());document.getElementById('cal-aniversarios')?.scrollIntoView({behavior:'smooth'});}

  return(
    <div style={{background:'var(--bg)',minHeight:'100vh',maxWidth:640,margin:'0 auto',position:'relative'}}>
      <>
        <TopBar logo="SEEK NETWORK" right={
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <button style={{position:'relative'}} className="icon-btn" onClick={()=>setShowBell(true)}>
              {badge>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',fontSize:'.5rem',fontWeight:900,borderRadius:99,padding:'1px 4px'}}>{badge}</span>}
              <IcBell s={18} c="var(--muted)"/>
            </button>
            <button className="icon-btn" style={{fontSize:'.9rem'}} onClick={()=>setShowHelp(true)}>❓</button>
            <button className="icon-btn" onClick={onLogout}><IcOut s={17} c="var(--muted)"/></button>
          </div>
        }/>
        <div style={{padding:'4px 16px 8px',textAlign:'center'}}>
          <span style={{fontSize:'0.55rem',fontWeight:900,color:'var(--black)',letterSpacing:'.02em'}}>{adm.name}</span>
        </div>
      </>

      {view==='dashboard'&&<AdmDashboard members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} sm={sm} setSm={setSm} sy={sy} setSy={setSy} onNav={nav} passReqs={passReqs} credentials={credentials} onDeleteRef={onDeleteReferral} onDeleteJrRef={onDeleteJrReferral} spinRewards={spinRewards} chestRewards={chestRewards} challengeConfigs={challengeConfigs} showPaymentReminder={true}/>}
      {view==='members'&&<AdmMembers members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onSelect={m=>{setSelMember(m);setView('memberDetail');}} onAdd={d=>onAddMember(d,adm.id)} onDelete={onDeleteMember} onUpdatePin={onUpdatePin} onDeleteJr={onDeleteSeekJr}/>}
      {view==='memberDetail'&&curMember&&<AdmMemberDetail member={curMember} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onBack={()=>{setSelMember(null);setView('members');}} onAddReferral={d=>onAddReferral(d,curMember.id)} onUpdateReferral={onUpdateReferral} onTogglePaid={onTogglePaid} onDeleteReferral={onDeleteReferral} onDeleteMember={id=>{onDeleteMember(id);setSelMember(null);setView('members');}} onUpdateMember={onUpdateMember} onUpdatePin={onUpdatePin} spinRewards={spinRewards} chestRewards={chestRewards} onToggleSpinPaid={onToggleSpinPaid} challengeConfigs={challengeConfigs}/>}
      {view==='pending'&&<LedgerPorSeek members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} challengeConfigs={challengeConfigs} paid={false} onBack={()=>setView('dashboard')} onPayAllForSeek={onPayAllForSeek} onPayAllForJr={onPayAllForJr} filterMonth={sm} filterYear={sy}/>}
      {view==='paid'&&<LedgerPorSeek members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} challengeConfigs={challengeConfigs} paid={true} onBack={()=>setView('dashboard')} filterMonth={sm} filterYear={sy}/>}
      {view==='prevPending'&&<MesAnteriorPanel adm={adm} members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} challengeConfigs={challengeConfigs} onBack={()=>setView('dashboard')}/>}
      {view==='editRef'&&editRefDirect&&(()=>{const _jr=editRefDirect.jrId?seekJrs.find(j=>sameId(j.id,editRefDirect.jrId)):null;const _m=(editRefDirect.memberId?members.find(m=>sameId(m.id,editRefDirect.memberId)):_jr?members.find(m=>sameId(m.id,_jr.seekId)):null)||{id:0,name:'?'};return<AdmMemberDetail member={_m} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onBack={()=>{setEditRefDirect(null);setView('dashboard');}} onUpdateReferral={onUpdateReferral} onTogglePaid={onTogglePaid} onDeleteReferral={onDeleteReferral} onDeleteMember={onDeleteMember} onUpdateMember={onUpdateMember} onUpdatePin={onUpdatePin} spinRewards={spinRewards} chestRewards={chestRewards} onToggleSpinPaid={onToggleSpinPaid} challengeConfigs={challengeConfigs}/>;})()}
      {view==='remuneracao'&&<RemuneracaoPanel isMaster={false} isAdm={true}/>}
      {view==='fipe'&&<FipeConsulta/>}
      {view==='financiamento'&&<SimuladorFinanciamento/>}
      {view==='dashboard'&&todayBdRefs.length>0&&(
        <div className="page" style={{paddingTop:0,paddingBottom:0}}>
          <button onClick={abrirCalendarioHoje} style={{width:'100%',textAlign:'left',border:'none',borderRadius:14,padding:'12px 16px',background:'rgba(251,146,60,.15)',cursor:'pointer',display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
            <span style={{fontSize:'1.2rem'}}>🎂</span>
            <div>
              <div style={{fontWeight:800,fontSize:'.8rem',color:'#c2410c'}}>Hoje é aniversário de {todayBdRefs[0].clientName}{todayBdRefs.length>1?` e mais ${todayBdRefs.length-1}`:''}!</div>
              <div style={{fontSize:'.68rem',color:'#9a3412',fontWeight:600}}>Clique para ver no calendário</div>
            </div>
          </button>
        </div>
      )}
      {view==='dashboard'&&<div className="page" style={{paddingTop:0,paddingBottom:0}}><CalendarioAniversarios referrals={referrals} jrReferrals={jrReferrals} members={members} seekJrs={seekJrs} autoOpenDay={calAutoDay}/></div>}

      {!inSubView&&<AdmTabBar view={view} setView={v=>{setView(v);setSelMember(null);}} onOffers={()=>setShowOffers(true)} onChallenge={()=>setShowChallenge(true)}/>}
      {showBell&&<VendedorBellPanel members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} passReqs={passReqs} onClose={()=>setShowBell(false)} onMarkRead={onMarkRead} onMarkSold={onMarkSold} onUpdateRef={updateRef} onTogglePaid={onTogglePaid} onToggleJrPaid={onToggleJrPaid}/>}
      {showOffers&&<OffersPanel offers={offers} onClose={()=>setShowOffers(false)} isAdm={false} onAddOffer={()=>{}} onDeleteOffer={()=>{}}/>}
      {showChallenge&&<ChallengeConfigPanel configs={challengeConfigs} onSave={onSaveChallengeConfig} onClose={()=>setShowChallenge(false)}/>}
      {showHelp&&<HelpModal role="adm" onClose={()=>setShowHelp(false)}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   EXTRATO MODAL — relatório completo para WhatsApp / Impressão
══════════════════════════════════════════════════════════════════ */
function ExtratoModal({role,data,onClose,isAdm,onTogglePaid}){
  const now=new Date();
  const dateStr=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;

  function buildText(){
    if(role==='master'){
      const {adms,members,referrals,jrReferrals,seekJrs,spinRewards=[]}=data;
      const allRefs=[...referrals,...jrReferrals];
      const totVol=allRefs.reduce((s,r)=>s+r.productValue,0);
      const totCom=allRefs.reduce((s,r)=>s+r.commission,0);
      const pago=allRefs.filter(r=>r.paid).reduce((s,r)=>s+r.commission,0);
      const admRank=adms.map(adm=>{
        const mids=members.filter(m=>sameId(m.admId,adm.id)).map(m=>String(m.id));
        const jids=seekJrs.filter(j=>mids.some(id=>sameId(j.seekId,id))).map(j=>String(j.id));
        const vol=[...referrals.filter(r=>mids.some(id=>sameId(r.memberId,id))),...jrReferrals.filter(r=>jids.some(id=>sameId(r.jrId,id)))].reduce((s,r)=>s+r.productValue,0);
        return{name:adm.name,vol,seeks:mids.length};
      }).sort((a,b)=>b.vol-a.vol);
      return [
        `*SEEK NETWORK — EXTRATO MASTER*`,`Data: ${dateStr}`,``,

        `📊 CONSOLIDADO GERAL`,
        `Vendedores: ${adms.length}  |  SEEKs: ${members.length}  |  JRs: ${seekJrs.length}`,
        `Total Indicações: ${allRefs.length}`,``,
        `💰 COMISSÕES`,
        `Volume Total: ${fBRL(totVol)}`,
        `Comissão Total: ${fBRL(totCom)}`,
        `Pago: ${fBRL(pago)}`,
        (()=>{const{bonusSum,debitSum}=splitSpins(spinRewards);return[
          bonusSum>0?`🎰 Bônus Roleta Total - ${fBRL(bonusSum)}`:'',
          debitSum<0?`🎲 Débito Roleta Total - ${fBRL(debitSum)}`:'',
        ].filter(Boolean).join('\n');})(),``,
        `🏆 RANKING VENDEDORES`,
        ...admRank.map((a,i)=>`${i+1}. ${a.name} — ${fBRL(a.vol)} (${a.seeks} SEEK${a.seeks!==1?'s':''})`),
      ].join('\n');
    }
    if(role==='adm'){
      const {adm,members,referrals,jrReferrals,seekJrs,spinRewards=[]}=data;
      const allRefs=[...referrals,...jrReferrals];
      const totCom=allRefs.reduce((s,r)=>s+r.commission,0);
      const{bonusSum:bonusRTotal,debitSum:debitRTotal}=splitSpins(spinRewards);
      const totalGeral=totCom+bonusRTotal+debitRTotal;
      const SEP='━━━━━━━━━━━━━━━━━━━━━━━━━';
      function refLine(r){
        const{bonusSum:spinBonus,debitSum:spinDebit}=splitSpins(spinRewards.filter(s=>sameId(s.referralId,r.id)));
        const total=r.commission+spinBonus+spinDebit;
        const st=r.paid?'Pago':'A Pagar';
        let line=`  Cliente: ${r.clientName} | Comissão: ${fBRL(r.commission)}`;
        if(spinBonus>0)line+=` | Bônus Roleta: ${fBRL(spinBonus)}`;
        if(spinDebit<0)line+=` | Débito Roleta: ${fBRL(spinDebit)}`;
        line+=` | Total: ${fBRL(total)} | ${st}`;
        return line;
      }
      const seekLines=[];
      members.forEach(m=>{
        const mRefs=referrals.filter(r=>sameId(r.memberId,m.id)&&(r.paid||r.status==='a_pagar'||r.productValue>0));
        const mJrs=seekJrs.filter(j=>sameId(j.seekId,m.id));
        const mJrRefs=jrReferrals.filter(r=>mJrs.some(j=>sameId(j.id,r.jrId))&&(r.paid||r.status==='a_pagar'||r.productValue>0));
        if(mRefs.length===0&&mJrRefs.length===0)return;
        seekLines.push(``,`${SEP}`,`👤 ${m.name}`,`${SEP}`);
        mRefs.forEach(r=>seekLines.push(refLine(r)));
        const mSpin=spinRewards.filter(s=>sameId(s.seekId,m.id)).reduce((s,r)=>s+r.value,0);
        const mSub=mRefs.reduce((s,r)=>s+r.commission,0)+mSpin;
        if(mRefs.length>0)seekLines.push(`  Subtotal SEEK: ${fBRL(mSub)}`);
        mJrs.forEach(jr=>{
          const jRefs=jrReferrals.filter(r=>sameId(r.jrId,jr.id)&&(r.paid||r.status==='a_pagar'||r.productValue>0));
          if(jRefs.length===0)return;
          seekLines.push(``,`👤 ${jr.name} — JR de ${m.name}`);
          jRefs.forEach(r=>seekLines.push(refLine(r)));
          const jSpin=spinRewards.filter(s=>sameId(s.jrId,jr.id)).reduce((s,r)=>s+r.value,0);
          const jSub=jRefs.reduce((s,r)=>s+r.commission,0)+jSpin;
          seekLines.push(`  Subtotal SEEK JR: ${fBRL(jSub)}`);
        });
      });
      const myComm=admComm(allRefs);
      return [
        `*SEEK NETWORK — EXTRATO VENDEDOR*`,
        `${adm.name}  |  Data: ${dateStr}`,``,
        `📊 RESUMO`,
        `SEEKs: ${members.length}  |  JRs: ${seekJrs.length}  |  Indicações: ${allRefs.length}`,
        `💼 Minha Comissão (vendedor): ${fBRL(myComm)}`,
        ...seekLines,
        ``,SEP,
        `TOTAL GERAL SEEK: ${fBRL(totalGeral)}`,
      ].join('\n');
    }
    if(role==='member'){
      const {member,referrals,jrReferrals,seekJrs,spinRewards=[],chestRewards=[],challengeConfigs=[]}=data;
      const totVol=referrals.reduce((s,r)=>s+r.productValue,0);
      const pts=calcPoints(totVol);
      const lv=getSeekLevel(pts);
      const bonusR=spinRewards.reduce((s,r)=>s+r.value,0);
      const bonusRUnpaid=spinRewards.filter(r=>!r.paid).reduce((s,r)=>s+r.value,0);
      const chestTotal=(chestRewards||[]).reduce((s,c)=>s+c.valor,0);
      const chestUnpaid=(chestRewards||[]).filter(c=>!c.paid).reduce((s,c)=>s+c.valor,0);
      const challengeItems=allChallengeBonuses(referrals,challengeConfigs);
      const challengeTotal=challengeItems.reduce((s,c)=>s+c.amount,0);
      const challengeUnpaid=challengeItems.filter(c=>!c.ref.paid).reduce((s,c)=>s+c.amount,0);
      const apagar=referrals.filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0)+bonusRUnpaid+chestUnpaid+challengeUnpaid;
      const nextLv=lv.id==='elite'?null:SEEK_LEVELS[SEEK_LEVELS.findIndex(l=>l.id===lv.id)+1];
      const myJrs=seekJrs.filter(j=>sameId(j.seekId,member.id));
      const SEP='─────────────────────────';
      const confRefs=referrals.filter(r=>r.paid||r.status==='a_pagar'||r.productValue>0);
      const refLines=[];
      confRefs.forEach((r,i)=>{
        const{bonusSum:spinBonus,debitSum:spinDebit}=splitSpins(spinRewards.filter(s=>sameId(s.referralId,r.id)));
        const challenge=challengeItems.find(c=>sameId(c.ref.id,r.id));
        const total=r.commission+spinBonus+spinDebit+(challenge?challenge.amount:0);
        const st=r.paid?'Pago':'A Pagar';
        refLines.push(`👤 ${r.clientName}`);
        refLines.push(`   Comissão: ${fBRL(r.commission)}`);
        if(spinBonus>0)refLines.push(`   🎰 Bônus Roleta: ${fBRL(spinBonus)}`);
        if(spinDebit<0)refLines.push(`   🎲 Débito Roleta: ${fBRL(spinDebit)}`);
        if(challenge)refLines.push(`   🏆 Bônus Desafio do Mês (+${challenge.pct}%): ${fBRL(challenge.amount)}`);
        refLines.push(`   Total: ${fBRL(total)}`);
        refLines.push(`   Status: ${st}`);
        if(i<confRefs.length-1)refLines.push(SEP);
      });
      const chestLines=(chestRewards||[]).map(c=>`🎁 Cofre Misterioso — ${fBRL(c.valor)} | ${c.paid?'Pago':'A Pagar'}`);
      const totalGeral=referrals.reduce((s,r)=>s+r.commission,0)+bonusR+chestTotal+challengeTotal;
      return [
        `*SEEK NETWORK — EXTRATO SEEK*`,
        `${member.name}  |  #${String(member.id).padStart(3,'0')}`,
        `Data: ${dateStr}`,``,
        `🎖️ NÍVEL: ${lv.name.toUpperCase()}`,
        `Pontos: ${pts} pts  |  Bônus: +${(lv.bonus*100).toFixed(0)}%`,
        nextLv?`Próximo nível: ${nextLv.name} (faltam ${nextLv.min-pts} pts)`:`✅ Nível Máximo!`,``,
        `💰 A Pagar: ${fBRL(apagar)}`,``,
        confRefs.length>0?`📋 INDICAÇÕES (${confRefs.length})`:null,
        confRefs.length>0?SEP:null,
        ...refLines,
        confRefs.length>0?SEP:null,
        chestLines.length>0?``:null,
        chestLines.length>0?`🎁 COFRES MISTERIOSOS (${chestLines.length})`:null,
        ...chestLines,
        ``,
        `TOTAL GERAL: ${fBRL(totalGeral)}`,
        myJrs.length>0?`\n👥 SEEK JRs (${myJrs.length})`:null,
        ...myJrs.map(jr=>{
          const jrVol=jrReferrals.filter(r=>sameId(r.jrId,jr.id)).reduce((s,r)=>s+r.productValue,0);
          return`• ${jr.name} — ${fBRL(jrVol)}`;
        }),
      ].filter(l=>l!=null).join('\n');
    }
    if(role==='jr'){
      const {jr,referrals,seekMember,spinRewards=[],chestRewards=[],challengeConfigs=[]}=data;
      const totVol=referrals.reduce((s,r)=>s+r.productValue,0);
      const bonusR=spinRewards.reduce((s,r)=>s+r.value,0);
      const bonusRUnpaid=spinRewards.filter(r=>!r.paid).reduce((s,r)=>s+r.value,0);
      const chestTotal=(chestRewards||[]).reduce((s,c)=>s+c.valor,0);
      const chestUnpaid=(chestRewards||[]).filter(c=>!c.paid).reduce((s,c)=>s+c.valor,0);
      const challengeItems=allChallengeBonuses(referrals,challengeConfigs);
      const challengeTotal=challengeItems.reduce((s,c)=>s+c.amount,0);
      const challengeUnpaid=challengeItems.filter(c=>!c.ref.paid).reduce((s,c)=>s+c.amount,0);
      const apagar=referrals.filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0)+bonusRUnpaid+chestUnpaid+challengeUnpaid;
      const jrLv=getJrLevel(totVol);
      const gradPct=Math.min(100,(totVol/JR_GRADUATION)*100).toFixed(1);
      const SEP='─────────────────────────';
      const confRefs=referrals.filter(r=>r.paid||r.status==='a_pagar'||r.productValue>0);
      const refLines=[];
      confRefs.forEach((r,i)=>{
        const{bonusSum:spinBonus,debitSum:spinDebit}=splitSpins(spinRewards.filter(s=>sameId(s.referralId,r.id)));
        const challenge=challengeItems.find(c=>sameId(c.ref.id,r.id));
        const total=r.commission+spinBonus+spinDebit+(challenge?challenge.amount:0);
        const st=r.paid?'Pago':'A Pagar';
        refLines.push(`👤 ${r.clientName}`);
        refLines.push(`   Comissão: ${fBRL(r.commission)}`);
        if(spinBonus>0)refLines.push(`   🎰 Bônus Roleta: ${fBRL(spinBonus)}`);
        if(spinDebit<0)refLines.push(`   🎲 Débito Roleta: ${fBRL(spinDebit)}`);
        if(challenge)refLines.push(`   🏆 Bônus Desafio do Mês (+${challenge.pct}%): ${fBRL(challenge.amount)}`);
        refLines.push(`   Total: ${fBRL(total)}`);
        refLines.push(`   Status: ${st}`);
        if(i<confRefs.length-1)refLines.push(SEP);
      });
      const chestLines=(chestRewards||[]).map(c=>`🎁 Cofre Misterioso — ${fBRL(c.valor)} | ${c.paid?'Pago':'A Pagar'}`);
      const totalGeral=referrals.reduce((s,r)=>s+r.commission,0)+bonusR+chestTotal+challengeTotal;
      return [
        `*SEEK NETWORK — EXTRATO SEEK JR*`,
        `${jr.name}  |  ID: ${jr.id}JR`,
        `Data: ${dateStr}`,``,
        seekMember?`👤 Padrinho SEEK: ${seekMember.name}`:null,
        ``,
        `📊 DESEMPENHO`,
        `Nível JR: ${jrLv.name}  |  Bônus para SEEK: ${(jrLv.bonus*100).toFixed(0)}%`,
        `Progresso para SEEK: ${gradPct}% de ${fBRL(JR_GRADUATION)}`,``,
        `💰 A Pagar: ${fBRL(apagar)}`,``,
        confRefs.length>0?`📋 INDICAÇÕES (${confRefs.length})`:null,
        confRefs.length>0?SEP:null,
        ...refLines,
        confRefs.length>0?SEP:null,
        chestLines.length>0?``:null,
        chestLines.length>0?`🎁 COFRES MISTERIOSOS (${chestLines.length})`:null,
        ...chestLines,
        ``,
        `TOTAL GERAL: ${fBRL(totalGeral)}`,
      ].filter(l=>l!=null).join('\n');
    }
    return '';
  }

  const text=buildText();

  function sendWhatsApp(){
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
  }
  function handlePrint(){
    const div=document.createElement('div');
    div.className='print-only';
    div.style.cssText='font-family:monospace;white-space:pre-wrap;font-size:13px;padding:28px;color:#111;line-height:1.8;';
    div.textContent=text;
    document.body.appendChild(div);
    window.print();
    document.body.removeChild(div);
  }

  return(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'92vh'}}>
        <div className="handle"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <span style={{fontWeight:900,fontSize:'1rem'}}>📋 Extrato</span>
          <button className="icon-btn" onClick={onClose}><IcX s={17} c="var(--muted)"/></button>
        </div>
        <div className="nm-in" style={{padding:'16px',marginBottom:16,fontFamily:'monospace',fontSize:'.74rem',whiteSpace:'pre-wrap',lineHeight:1.75,maxHeight:'46vh',overflowY:'auto',borderRadius:16,color:'var(--black)'}}>
          {text}
        </div>
        {isAdm&&onTogglePaid&&(role==='member'||role==='jr')&&(()=>{
          const refs=(role==='member'?data.referrals:data.referrals).filter(r=>!r.paid);
          if(refs.length===0)return null;
          return<div style={{marginBottom:14}}>
            <div style={{fontWeight:800,fontSize:'.76rem',color:'var(--muted)',letterSpacing:'.06em',textTransform:'uppercase',marginBottom:8}}>Indicações a pagar</div>
            {refs.map((r,i)=>(
              <div key={r.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'7px 0',borderBottom:i<refs.length-1?'1px solid var(--gray)':'none'}}>
                <div>
                  <div style={{fontWeight:700,fontSize:'.82rem'}}>{r.clientName}</div>
                  <div style={{fontSize:'.7rem',color:'var(--muted)'}}>{fBRL(r.commission)}</div>
                </div>
                <button className="pill" style={{background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',border:'none',boxShadow:'2px 2px 8px rgba(29,122,58,.3)'}} onClick={()=>onTogglePaid(r.id)}>PAGAR</button>
              </div>
            ))}
          </div>;
        })()}
        <div style={{display:'flex',gap:10}}>
          <button className="btn btn-full" style={{gap:6,color:'#25D366'}} onClick={sendWhatsApp}>
            <IcWA s={15} fill="#25D366"/>WhatsApp
          </button>
          <button className="btn btn-full" style={{gap:6}} onClick={handlePrint}>
            🖨️ Imprimir
          </button>
        </div>
      </div>
    </div>
  );
}

function Confetti(){
  const pieces=Array.from({length:36},(_,i)=>({
    id:i,
    color:['#E63333','#FF7700','#DDAA00','#22AA44','#2277EE','#8833BB','#FF69B4','#00CCCC'][i%8],
    left:Math.random()*100,
    delay:Math.random()*.8,
    duration:1.4+Math.random()*.8,
    size:5+Math.random()*9,
    isCircle:i%3===0,
  }));
  return(
    <div style={{position:'fixed',inset:0,pointerEvents:'none',overflow:'hidden',zIndex:10001}}>
      {pieces.map(p=>(
        <div key={p.id} style={{
          position:'absolute',top:-20,left:`${p.left}%`,
          width:p.size,height:p.size,
          background:p.color,
          borderRadius:p.isCircle?'50%':2,
          animation:`confetti-fall ${p.duration}s ${p.delay}s ease-in forwards`,
        }}/>
      ))}
    </div>
  );
}

function ChestModal({seekerName,onResult,onClose,onRetrySpin}){

  function drawPrize(){
    let r=Math.random(),cum=0;
    for(const p of CHEST_PRIZES){cum+=p.prob;if(r<cum)return p.value;}
    return CHEST_PRIZES[CHEST_PRIZES.length-1].value;
  }

  function playCoinSound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [1047,1319,1047,1568].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=f;
        const s=ctx.currentTime+i*0.07;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.25,s+.02);
        g.gain.exponentialRampToValueAtTime(.001,s+.25);
        o.start(s);o.stop(s+.28);
      });
    }catch(e){}

  function playFanfare(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();

        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.35,s+.05);

      [784,1047,784,1319].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='triangle';o.frequency.value=f;
        const s=ctx.currentTime+.68+i*0.08;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.22,s+.03);
        g.gain.exponentialRampToValueAtTime(.001,s+.35);
        o.start(s);o.stop(s+.4);
      });
    }catch(e){}
  }

  function handleOpen(){
    if(phase!=='idle')return;
    playCoinSound();
    const v=drawPrize();

      setPhase('revealed');

      ))}

            {'🎁 COFRE MISTERIOSO!'}<br/>

          </div>

          <div

              cursor:phase==='idle'?'pointer':'default',

              display:'inline-block',userSelect:'none',position:'relative',
            }}
          >
            {phase==='opening'&&moneyNotes.map(n=>(
              <div key={n.id} style={{position:'absolute',left:`${n.x}%`,bottom:'100%',fontSize:'1.4rem',animation:`money-fly ${n.dur}s ${n.delay}s ease-out forwards`,pointerEvents:'none'}}>{'💵'}</div>
            ))}
            <div style={{position:'relative',width:160,height:130,perspectiveOrigin:'50% 50%',perspective:400}}>
              <div style={{
                position:'absolute',top:0,left:0,right:0,height:56,
                background:'linear-gradient(160deg,#C8A200 0%,#A07800 55%,#7A5800 100%)',
                borderRadius:'14px 14px 0 0',border:'3px solid #FFE566',borderBottom:'none',
                boxShadow:'0 -3px 20px rgba(0,229,255,.35)',overflow:'hidden',

                <div style={{position:'absolute',top:0,left:0,right:0,height:9,background:'linear-gradient(180deg,#00E5FF,#0077FF)',opacity:.7}}/>
                {[14,73,122].map(l=>(
                  <div key={l} style={{position:'absolute',top:18,left:l,width:14,height:14,borderRadius:'50%',background:'radial-gradient(circle at 40% 35%,#00FFEE,#0077BB)',boxShadow:'0 0 10px rgba(0,229,255,.9)'}}/>

                <div style={{position:'absolute',top:0,left:0,right:0,height:8,background:'linear-gradient(180deg,#FFD700,#B8860B)',opacity:.85}}/>
                {[{l:8,t:18,c:'#00E5FF'},{l:128,t:18,c:'#00E5FF'},{l:8,t:46,c:'#00E5FF'},{l:128,t:46,c:'#00E5FF'}].map((g,i)=>(
                  <div key={i} style={{position:'absolute',top:g.t,left:g.l,width:17,height:17,borderRadius:5,background:`radial-gradient(circle at 35% 30%,${g.c},#004488)`,boxShadow:`0 0 12px ${g.c}`,border:'1.5px solid rgba(255,255,255,.30)'}}/>

                  <div style={{width:14,height:16,borderRadius:'7px 7px 0 0',border:'3.5px solid #7A5800',borderBottom:'none',marginTop:-4}}/>
                </div>
                {[14,134].map(l=>(
                  <div key={l} style={{position:'absolute',top:32,left:l,width:13,height:13,borderRadius:'50%',background:'radial-gradient(circle at 40% 35%,#FFE566,#DAA520)',boxShadow:'0 0 8px rgba(255,215,0,.7)'}}/>
                ))}
                {phase==='opening'&&<div style={{position:'absolute',inset:0,borderRadius:'0 0 12px 12px',background:'radial-gradient(ellipse at 50% 0%,rgba(0,229,255,.5),transparent 70%)',animation:'chest-glow .5s ease-out'}}/>}

            {'Parabéns, '}{seekerName.split(' ')[0]}{'! Um cofre foi desbloqueado! 🔓'}

        </React.Fragment>

        <React.Fragment>

              {'🎁 PARABÉNS, '}{seekerName.split(' ')[0].toUpperCase()}{'!'}
            </div>
            <div style={{fontSize:'4rem',fontWeight:900,color:'#FFD700',textShadow:'0 0 50px rgba(255,215,0,1), 0 0 100px rgba(0,229,255,.5)',lineHeight:1,marginBottom:6}}>
              {fBRL(valor)}

            <div style={{fontSize:'.84rem',color:'rgba(255,255,255,.7)',fontWeight:700}}>{'no Cofre Misterioso!'}</div>

          <div style={{marginTop:44,display:'flex',flexDirection:'column',gap:10,alignItems:'center'}}>

              style={{padding:'14px 42px',borderRadius:50,background:'linear-gradient(135deg,#FFD700,#FF8C00)',border:'none',fontSize:'1rem',fontWeight:900,color:'#001A4D',cursor:'pointer',boxShadow:'0 4px 24px rgba(255,140,0,.6)',fontFamily:'inherit',letterSpacing:'.04em'}}
            >
              {'Incrível! 🎉'}
            </button>
            {onRetrySpin&&<button
              onClick={()=>{onRetrySpin();onClose();}}

            >
              {'🔄 Tente Novamente por apenas R$ 5,00'}

        </React.Fragment>

  );
}

function CofresModal({chestItems,onClose}){
  const sorted=[...chestItems].sort((a,b)=>{
    if(a.paid!==b.paid)return a.paid?1:-1;
    if(!a.createdAt||!b.createdAt)return 0;
    return new Date(b.createdAt)-new Date(a.createdAt);
  });
  const pendente=chestItems.filter(c=>!c.paid).reduce((s,c)=>s+c.valor,0);
  const total=chestItems.reduce((s,c)=>s+c.valor,0);
  return(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'90vh'}}>
        <div className="handle"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:14}}>
          <span style={{fontWeight:900,fontSize:'1rem'}}>{'🎁 Cofre Misterioso'}</span>
          <button className="icon-btn" onClick={onClose}><IcX s={17} c="var(--muted)"/></button>
        </div>
        <div style={{overflowY:'auto',maxHeight:'64vh'}}>
          {chestItems.length===0&&<Empty text="Nenhum cofre ainda!"/>}
          <div className="nm" style={{padding:'0 14px'}}>
            {sorted.map((c,i)=>{
              const dt=c.createdAt?new Date(c.createdAt):null;
              const dtStr=dt?`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`:'';
              return(
                <React.Fragment key={c.id}>
                  <div style={{padding:'11px 0'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}}>
                      <div>
                        <div style={{fontWeight:800,fontSize:'.8rem',color:'#B8860B',marginBottom:3}}>{'🎁 Cofre Misterioso'}</div>
                        <div style={{fontSize:'.68rem',color:'var(--muted)',lineHeight:1.6}}>
                          {fBRL(c.valor)}{dtStr?` · ${dtStr}`:''}
                        </div>
                      </div>
                      <span style={{fontSize:'.68rem',fontWeight:800,padding:'3px 9px',borderRadius:50,background:'var(--bg)',boxShadow:'var(--nm-out)',color:c.paid?'var(--green)':'var(--red)',flexShrink:0,whiteSpace:'nowrap'}}>
                        {c.paid?'Pago':'A Pagar'}
                      </span>
                    </div>
                  </div>
                  {i<sorted.length-1&&<div style={{height:1,background:'rgba(0,0,0,.06)'}}/>}
                </React.Fragment>
              );
            })}
            {chestItems.length>0&&(
              <div style={{borderTop:'2px solid rgba(0,0,0,.06)',padding:'10px 0 12px'}}>
                {pendente>0&&<div style={{fontSize:'.69rem',fontWeight:600,marginBottom:4}}>{'A Pagar: '}<span style={{color:'var(--red)',fontWeight:800}}>{fBRL(pendente)}</span></div>}
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
                  <span style={{fontSize:'.62rem',fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em'}}>{'🎁 Total Geral'}</span>
                  <span style={{fontWeight:900,fontSize:'1rem',color:'#B8860B'}}>{fBRL(total)}</span>
                </div>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function SpinModal({seekerName,spinIndex=1,spinTotal=1,onClose,onResult}){
  const [rotation,setRotation]=useState(0);
  const [spinning,setSpinning]=useState(false);
  const [won,setWon]=useState(null);
  const [pendingWin,setPendingWin]=useState(null);
  const baseRot=React.useRef(0);

  function playCircusSound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [[523,0],[659,.11],[784,.22],[1047,.33],[784,.44],[659,.55],[523,.66],[659,.77],[784,.88],[1047,.99],[1175,1.10],[1047,1.21],[784,1.32],[659,1.43],[523,1.54],[784,1.70],[1047,1.84],[1319,1.98],[1568,2.12],[1319,2.26],[1047,2.40],[784,2.54],[659,2.68],[523,2.82]].forEach(([f,t])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='square';o.frequency.value=f;
        const s=ctx.currentTime+t;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.1,s+0.01);
        g.gain.exponentialRampToValueAtTime(0.001,s+0.10);
        o.start(s);o.stop(s+0.11);
      });
    }catch(e){}
  }

  function playCelebrationSound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [523,659,784,1047,1319,1047,1319,1568].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=f;
        const s=ctx.currentTime+i*0.1;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.3,s+0.05);
        g.gain.exponentialRampToValueAtTime(0.001,s+0.5);
        o.start(s);o.stop(s+0.55);
      });
    }catch(e){}
  }

  function playRetrySound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [[660,0],[880,0.08]].forEach(([f,t])=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=f;
        const s=ctx.currentTime+t;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.18,s+0.02);
        g.gain.exponentialRampToValueAtTime(0.001,s+0.18);
        o.start(s);o.stop(s+0.2);
      });
    }catch(e){}
  }

  function playFreeSpinSound(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [784,988,1175,1319,1568].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=f;
        const s=ctx.currentTime+i*0.08;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(0.25,s+0.03);
        g.gain.exponentialRampToValueAtTime(0.001,s+0.38);
        o.start(s);o.stop(s+0.42);
      });
    }catch(e){}
  }

  function handleSpin(){
    if(spinning||won)return;
    playCircusSound();
    const rand=Math.random();
    let cum=0,winner=SPIN_PRIZES[0];
    for(const p of SPIN_PRIZES){cum+=p.prob;if(rand<cum){winner=p;break;}}
    setPendingWin(winner);
    setSpinning(true);
    const mid=winner.start+winner.span/2;
    const finalDeg=(360-mid%360+360)%360;
    const target=baseRot.current+1800+((finalDeg-baseRot.current%360)+360)%360;
    baseRot.current=target;
    setRotation(target);
  }

  function handleTransitionEnd(e){
    if(e.propertyName!=='transform'||!spinning)return;
    setSpinning(false);
    if(pendingWin){
      setWon(pendingWin);
      if(pendingWin.type==='replay'){playFreeSpinSound();}
      else{playCelebrationSound();onResult(pendingWin.value);}
    }
  }

  function handleReplay(){
    setWon(null);
    setPendingWin(null);
    setTimeout(()=>handleSpin(),800);
  }

  function handleRetryPaid(){
    playRetrySound();
    onResult(-5);
    setWon(null);
    setPendingWin(null);
    setTimeout(()=>handleSpin(),800);
  }

  const size=270,R=size/2,CX=R,CY=R;

  function p2c(r,deg){
    const rad=(deg-90)*Math.PI/180;
    return{x:CX+r*Math.cos(rad),y:CY+r*Math.sin(rad)};
  }

  function wedge(s,e){
    const a=p2c(R-3,s),b=p2c(R-3,e);
    return`M${CX},${CY} L${a.x},${a.y} A${R-3},${R-3} 0 0,1 ${b.x},${b.y} Z`;
  }

  const lamps=React.useMemo(()=>Array.from({length:28},(_,i)=>{
    const a=i*(360/28)-90,rad=a*Math.PI/180;
    return{x:CX+(R-6)*Math.cos(rad),y:CY+(R-6)*Math.sin(rad),on:i%2===0};
  }),[]);

  return(
    <div className="spin-overlay" style={{flexDirection:'column',gap:0,background:'radial-gradient(ellipse at center,#3D0000 0%,#1A0000 60%,#0A0000 100%)'}}>
      {won&&won.type!=='penalty'&&won.type!=='replay'&&<Confetti/>}
      {!won?(
        <>
          <div style={{textAlign:'center',marginBottom:6,zIndex:1,padding:'0 20px'}}>
            <div style={{fontSize:'1.3rem',fontWeight:900,color:'#FFD700',letterSpacing:'.06em',textShadow:'0 0 20px rgba(255,215,0,.8)'}}>{'🎰 ROLETA DA SORTE'}</div>
            <div style={{fontSize:'.76rem',color:'rgba(255,255,255,.88)',fontWeight:700,marginTop:5}}>{'Parabéns, '}{seekerName}{'!'}</div>
            {spinTotal>1&&<div style={{fontSize:'.66rem',color:'#FF7700',fontWeight:800,marginTop:3}}>{`Giro ${spinIndex} de ${spinTotal}`}</div>}
          </div>

          <div className="roulette-wheel-wrap" style={{position:'relative',width:size+50,height:size+60,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
            <div style={{position:'absolute',top:2,left:'50%',transform:'translateX(-50%)',zIndex:10}}>
              <svg width={24} height={22} viewBox="0 0 24 22">
                <defs>
                  <linearGradient id="ptrG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#FFD700"/>
                    <stop offset="100%" stopColor="#B8860B"/>
                  </linearGradient>
                </defs>
                <polygon points="12,2 2,20 22,20" fill="url(#ptrG)" stroke="#7A5C00" strokeWidth="1.5"/>
              </svg>
            </div>

            <div
              onTransitionEnd={handleTransitionEnd}
              style={{position:'absolute',top:18,width:size,height:size,transform:`rotate(${rotation}deg)`,transition:spinning?'transform 4.5s cubic-bezier(0.17,0.67,0.12,0.99)':'none'}}
            >
              <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
                <defs>
                  <radialGradient id="cGrad" cx="50%" cy="35%">
                    <stop offset="0%" stopColor="#FFE566"/>
                    <stop offset="100%" stopColor="#B8860B"/>
                  </radialGradient>
                  <radialGradient id="shineG" cx="32%" cy="22%">
                    <stop offset="0%" stopColor="rgba(255,255,255,0.20)"/>
                    <stop offset="65%" stopColor="transparent"/>
                  </radialGradient>
                </defs>
                <circle cx={CX} cy={CY} r={R} fill="#111" stroke="#2A2A2A" strokeWidth={2}/>
                {SPIN_PRIZES.map((p,i)=>(
                  <path key={i} d={wedge(p.start,p.start+p.span)} fill={p.color} stroke="#111" strokeWidth={1.5}/>
                ))}
                <circle cx={CX} cy={CY} r={R-3} fill="url(#shineG)"/>
                {lamps.map((l,i)=>(
                  <circle key={i} cx={l.x} cy={l.y} r={4} fill={l.on?'#FFD700':'#333'} stroke={l.on?'#B8860B':'#222'} strokeWidth={0.8} opacity={l.on?1:0.35}/>
                ))}
                {SPIN_PRIZES.map((p,i)=>{
                  const mid=p.start+p.span/2;
                  const rad=(mid-90)*Math.PI/180;
                  const lr=R*0.60;
                  const tx=CX+lr*Math.cos(rad);
                  const ty=CY+lr*Math.sin(rad);
                  const wl=p.type==='replay'?'🔄 Grátis':p.label;
                  const tc=p.color==='#DAA520'?'#3D0000':'#FFD700';
                  return(
                    <text key={i} x={tx} y={ty} textAnchor="middle" dominantBaseline="central"
                      transform={`rotate(${mid},${tx},${ty})`}
                      fontFamily="'Inter',-apple-system,'SF Pro Display',sans-serif"
                      fontSize={13} fontWeight="900" fill={tc}
                      stroke="#000" strokeWidth={3.2} strokeLinejoin="round" paintOrder="stroke">
                      {wl}
                    </text>
                  );
                })}
                <circle cx={CX} cy={CY} r={24} fill="url(#cGrad)" stroke="#B8860B" strokeWidth={2.5}/>
                <circle cx={CX} cy={CY} r={13} fill="#FFE566" opacity={0.5}/>
