/* ══════════════════════════════════════════════════════════════════
   ADM LEDGER
══════════════════════════════════════════════════════════════════ */
function AdmLedger({title,referrals,members,seekJrs,paid,onBack,onTogglePaid,onToggleJrPaid,spinRewards,onToggleSpinPaid,readOnly=false}){
  const fil=[...referrals].filter(r=>r.paid===paid).sort((a,b)=>new Date(b.year,(b.month||1)-1,b.day||1)-new Date(a.year,(a.month||1)-1,a.day||1));
  const spinFil=!paid?(spinRewards||[]).filter(s=>!s.paid):[];
  const spinTotal=spinFil.reduce((s,r)=>s+r.value,0);
  const comTotal=fil.reduce((s,r)=>s+r.commission,0);
  return(
    <>
      <TopBar title={title} left={<button className="icon-btn" onClick={onBack}><IcLeft s={18}/></button>}/>
      <div className="page">
        <StatCard label={paid?'Total Pago':'Total a Pagar'} value={fBRL(comTotal+spinTotal)} color={paid?'var(--green)':'var(--red)'}/>
        <div className="nm" style={{padding:'6px 16px'}}>
          {fil.length===0&&spinFil.length===0?<Empty text={paid?'Nenhuma paga.':'Tudo em dia!'}/>:<>
            {fil.map((r,i)=>{
              const isJrRef=!!r.jrId;
              const m=isJrRef?(seekJrs||[]).find(j=>sameId(j.id,r.jrId)):members.find(x=>sameId(x.id,r.memberId));
              const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
              return(
                <div key={r.id}>
                  <div style={{padding:'12px 0'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,marginBottom:4}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:'.86rem',display:'flex',alignItems:'center',gap:5}}>{m?m.name:'?'}{isJrRef&&<span className="tag-jr">JR</span>}</div>
                        <div style={{fontSize:'.7rem',color:'var(--muted)',fontWeight:600,marginTop:2}}>{r.clientName}</div>
                        {r.productValue>0&&<div style={{fontSize:'.68rem',color:'var(--muted)',marginTop:2}}>{pt.icon} {pt.name} · {fBRL(r.productValue)}</div>}
                      </div>
                      <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600,flexShrink:0}}>{fDate(r)}</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div style={{fontWeight:800,color:paid?'var(--green)':'var(--red)'}}>{fBRL(r.commission)}</div>
                      {paid
                        ?<span style={{fontSize:'.72rem',fontWeight:800,color:'var(--green)',display:'inline-flex',alignItems:'center',gap:4}}><IcCheck s={11}/>Pago</span>
                        :readOnly
                          ?<span style={{fontSize:'.72rem',fontWeight:800,color:'var(--muted)'}}>A Pagar</span>
                          :<button className="pill" style={{background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',border:'none',boxShadow:'2px 2px 8px rgba(29,122,58,.3)'}} onClick={()=>(isJrRef&&onToggleJrPaid)?onToggleJrPaid(r.id):onTogglePaid(r.id)}>PAGAR</button>
                      }
                    </div>
                  </div>
                  {(i<fil.length-1||spinFil.length>0)&&<Div/>}
                </div>
              );
            })}
            {spinFil.map((s,i)=>{
              const seek=s.seekId?members.find(m=>sameId(m.id,s.seekId)):null;
              const jr=s.jrId?(seekJrs||[]).find(j=>sameId(j.id,s.jrId)):null;
              const nome=seek?seek.name:jr?jr.name+'JR':'?';
              const dt=s.createdAt?new Date(s.createdAt):null;
              const dtStr=dt?`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`:'';
              return(
                <div key={'sp_'+s.id}>
                  <div style={{padding:'12px 0'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,marginBottom:4}}>
                      <div>
                        <div style={{fontWeight:700,fontSize:'.86rem',color:'#8833BB'}}>🎰 Bônus Roleta</div>
                        <div style={{fontSize:'.7rem',color:'var(--muted)',fontWeight:600,marginTop:2}}>{nome}</div>
                      </div>
                      <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600,flexShrink:0}}>{dtStr}</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                      <div style={{fontWeight:800,color:'var(--red)'}}>{fBRL(s.value)}</div>
                      {paid
                        ?<span style={{fontSize:'.72rem',fontWeight:800,color:'var(--green)',display:'inline-flex',alignItems:'center',gap:4}}><IcCheck s={11}/>Pago</span>
                        :readOnly
                          ?<span style={{fontSize:'.72rem',fontWeight:800,color:'var(--muted)'}}>A Pagar</span>
                          :onToggleSpinPaid&&<button className="pill" style={{background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',border:'none',boxShadow:'2px 2px 8px rgba(29,122,58,.3)'}} onClick={()=>onToggleSpinPaid(s.id)}>PAGAR</button>
                      }
                    </div>
                  </div>
                  {i<spinFil.length-1&&<Div/>}
                </div>
              );
            })}
          </>}
        </div>
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════════
   MASTER — DASHBOARD
══════════════════════════════════════════════════════════════════ */
function MasterDashboard({adms,members,referrals,jrReferrals,seekJrs,sm,setSm,sy,setSy,onNav,passReqs,onSelectAdm,spinRewards}){
  const curY=new Date().getFullYear();
  const years=Array.from({length:5},(_,i)=>curY-2+i);
  const fil=referrals.filter(r=>r.month===sm&&r.year===sy);
  const jrFil=jrReferrals.filter(r=>r.month===sm&&r.year===sy);
  const allFil=[...fil,...jrFil];
  const totV=allFil.reduce((s,r)=>s+r.productValue,0);
  const spinAP=(spinRewards||[]).filter(s=>!s.paid).reduce((s,r)=>s+r.value,0);
  const comAP=([...referrals,...jrReferrals]).filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0)+spinAP;
  const comP=allFil.filter(r=>r.paid).reduce((s,r)=>s+r.commission,0);
  const allTotV=[...referrals,...jrReferrals].reduce((s,r)=>s+r.productValue,0);
  const pendReqs=(passReqs||[]).filter(r=>!r.resolved);
  const admStats=adms.map(adm=>{
    const mids=members.filter(m=>sameId(m.admId,adm.id)).map(m=>String(m.id));
    const jids=seekJrs.filter(j=>mids.some(id=>sameId(j.seekId,id))).map(j=>String(j.id));
    const ar=fil.filter(r=>mids.some(id=>sameId(r.memberId,id)));
    const jr=jrFil.filter(r=>jids.some(id=>sameId(r.jrId,id)));
    const vol=[...ar,...jr].reduce((s,r)=>s+r.productValue,0);
    const comm=[...ar,...jr].reduce((s,r)=>s+r.commission,0);
    return{adm,vol,comm,seeks:mids.length};
  }).sort((a,b)=>b.vol-a.vol);
  return<div className="page" style={{paddingTop:8,paddingBottom:110}}>
    {pendReqs.length>0&&<div className="nm" style={{padding:'12px 16px',border:'1.5px solid rgba(192,57,43,.3)'}}>
      <div style={{fontWeight:800,fontSize:'.8rem',color:'var(--red)'}}>🔐 {pendReqs.length} solicitação(ões) de senha pendente(s)</div>
    </div>}
    <div className="nm" style={{padding:'14px 16px'}}>
      <div style={{display:'flex',gap:10}}>
        <select className="inp" style={{flex:1}} value={sm} onChange={e=>setSm(Number(e.target.value))}>{MONTHS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select>
        <select className="inp" style={{width:90}} value={sy} onChange={e=>setSy(Number(e.target.value))}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      <StatCard label="Vendas no Mês" value={fil.length+jrFil.length}/>
      <StatCard label="Volume" value={fBRL(totV)}/>
      <StatCard label="A Pagar" value={fBRL(comAP)} color="var(--red)"/>
      <StatCard label="Pago" value={fBRL(comP)} color="var(--green)"/>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
      {[['A Pagar',[...referrals,...jrReferrals].filter(r=>!r.paid).length+(spinRewards||[]).filter(s=>!s.paid).length,'var(--red)','pending',IcClock],['Pagas',[...referrals,...jrReferrals].filter(r=>r.paid).length,'var(--green)','paid',IcCheck]].map(([l,v,c,dest,Ico])=>(
        <button key={l} className="nm" style={{padding:'16px 14px',textAlign:'left',border:'none',cursor:'pointer',background:'var(--bg)'}} onClick={()=>onNav(dest)}>
          <div className="section-title" style={{marginBottom:8,display:'flex',alignItems:'center',gap:4}}><Ico s={11} c={c}/>{l}</div>
          <div className="stat-n" style={{fontSize:'1.1rem',color:c}}>{v}</div>
        </button>
      ))}
    </div>
    {(spinRewards||[]).filter(s=>!s.paid).length>0&&<StatCard label="🎰 Bônus Roleta Pendente" value={fBRL((spinRewards||[]).filter(s=>!s.paid).reduce((s,r)=>s+r.value,0))} color="#8833BB"/>}
    {admStats.length>0&&<>
      <div className="section-title" style={{paddingLeft:4}}>Ranking Vendedores — {MONTHS[sm-1]} {sy}</div>
      <div className="nm" style={{padding:'6px 16px'}}>
        {admStats.map((item,i)=><div key={item.adm.id}>
          <button style={{display:'flex',alignItems:'center',gap:12,padding:'12px 0',width:'100%',background:'none',border:'none',cursor:'pointer',textAlign:'left'}} onClick={()=>onSelectAdm(item.adm)}>
            <div style={{width:34,height:34,borderRadius:12,background:'var(--bg)',boxShadow:'var(--nm-out)',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:'.78rem',flexShrink:0}}>{i+1}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:'.88rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.adm.name}</div>
              <div style={{fontSize:'.68rem',color:'var(--muted)',marginTop:1}}>{item.seeks} SEEK{item.seeks!==1?'s':''} · {fBRL(item.vol)}</div>
            </div>
            <div style={{fontWeight:800,color:'var(--green)',flexShrink:0,fontSize:'.84rem'}}>{fBRL(item.comm)}</div>
          </button>
          {i<admStats.length-1&&<div className="divider"/>}
        </div>)}
      </div>
    </>}
    {admStats.length===0&&<Empty text="Nenhum vendedor cadastrado ainda"/>}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════
   MASTER — VENDEDORES (gestão de ADMs)
══════════════════════════════════════════════════════════════════ */
function MasterVendedores({adms,members,referrals,jrReferrals,seekJrs,credentials,onAdd,onDelete,onSelect,onUpdatePin}){
  const [search,setSearch]=useState('');
  const [showAdd,setShowAdd]=useState(false);
  const [credAdm,setCredAdm]=useState(null);
  const [newPin,setNewPin]=useState('');
  const [pinErr,setPinErr]=useState('');
  const [confirmDel,setConfirmDel]=useState(null);
  const filtered=[...adms].filter(a=>a.name.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));

  function AdmForm({onCancel,onSave}){
    const [name,setName]=useState('');
    const [wa,setWa]=useState('');
    const [pix,setPix]=useState('');
    const [pin,setPin]=useState('0000');
    const [pe,setPe]=useState('');
    function submit(e){e.preventDefault();if(!name.trim())return;if(!/^\d{4}$/.test(pin)){setPe('Deve ter 4 dígitos.');return;}onSave({name:name.trim().toUpperCase(),whatsapp:wa,pixKey:pix.trim().toUpperCase(),pin});}
    return<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
      <Fld label="Nome do Vendedor"><input className="inp" value={name} onChange={e=>setName(e.target.value.toUpperCase())} placeholder="Nome completo" autoFocus autoCapitalize="characters" style={{textTransform:'uppercase'}}/></Fld>
      <Fld label="Telefone (Login — somente números)"><PlainPhoneInput value={wa} onChange={setWa}/></Fld>
      <Fld label="Chave PIX"><input className="inp" value={pix} onChange={e=>setPix(e.target.value.toUpperCase())} placeholder="CPF, E-MAIL OU CHAVE" autoCapitalize="characters" style={{textTransform:'uppercase'}}/></Fld>
      <div className="nm-in" style={{padding:'14px',display:'flex',flexDirection:'column',gap:12}}>
        <div style={{fontWeight:700,fontSize:'.72rem',letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)'}}>🔑 Acesso ao App</div>
        <Fld label="Senha inicial"><PinInput value={pin} onChange={setPin}/>{pe&&<span style={{color:'var(--red)',fontSize:'.74rem',fontWeight:700}}>{pe}</span>}</Fld>
      </div>
      <div style={{display:'flex',gap:12}}><button type="button" className="btn btn-full" onClick={onCancel}>Cancelar</button><button type="submit" className="btn btn-dark btn-full">Cadastrar</button></div>
    </form>;
  }

  return<>
    <TopBar title="Vendedores" right={<button className="btn btn-dark" style={{padding:'9px 14px',fontSize:'.74rem',borderRadius:14}} onClick={()=>setShowAdd(true)}><IcPlus s={14} c="#fff"/>Novo</button>}/>
    <div className="page" style={{paddingBottom:110}}>
      <div style={{position:'relative'}}><span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:'var(--muted)'}}><IcSrch s={16}/></span><input className="inp" style={{paddingLeft:42,textTransform:'uppercase'}} placeholder="Buscar vendedor" value={search} onChange={e=>setSearch(e.target.value.toUpperCase())} autoCapitalize="characters"/></div>
      {filtered.length===0?<Empty text="Nenhum vendedor cadastrado"/>:filtered.map(adm=>{
        const admMembers=members.filter(m=>sameId(m.admId,adm.id));
        const cred=credentials[`adm_${adm.id}`]||{};
        const initials=adm.name.trim().slice(0,2).toUpperCase();
        return<div key={adm.id} className="nm" style={{padding:'13px 16px',display:'flex',alignItems:'center',gap:10}}>
          <button style={{display:'flex',alignItems:'center',gap:12,flex:1,background:'none',border:'none',cursor:'pointer',minWidth:0,textAlign:'left'}} onClick={()=>onSelect(adm)}>
            <div className="member-avatar">{initials}</div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:700,fontSize:'.88rem',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{adm.name}</div>
              <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600,marginTop:2}}>{admMembers.length} SEEK{admMembers.length!==1?'s':''}{cred.login?` · ${maskPhone(cred.login)}`:''}</div>
            </div>
          </button>
          <button className="icon-btn" onClick={()=>{setCredAdm(adm);setNewPin('');setPinErr('');}}><IcKey s={14}/></button>
          <button className="icon-btn" onClick={()=>setConfirmDel(adm)}><IcTrash s={14} c="var(--red)"/></button>
        </div>;
      })}
    </div>
    {showAdd&&<Sheet title="Novo Vendedor" onClose={()=>setShowAdd(false)}><AdmForm onCancel={()=>setShowAdd(false)} onSave={d=>{onAdd(d);setShowAdd(false);}}/></Sheet>}
    {confirmDel&&<Confirm title="Excluir vendedor" msg={`Excluir "${confirmDel.name}" e todos os seus dados?`} onCancel={()=>setConfirmDel(null)} onOk={()=>{onDelete(confirmDel.id);setConfirmDel(null);}}/>}
    {credAdm&&(()=>{
      const cred=credentials[`adm_${credAdm.id}`]||{login:credAdm.whatsapp||'',pin:'0000'};
      const rawL=(cred.login||'').replace(/\D/g,'');
      const waPhone=rawL.startsWith('55')&&rawL.length>=12?rawL:`55${rawL}`;
      function savePin(){if(!/^\d{4}$/.test(newPin)){setPinErr('Deve ter 4 dígitos.');return;}onUpdatePin(`adm_${credAdm.id}`,newPin);setPinErr('');setNewPin('');setCredAdm(null);}
      function sendWA(){const msg=encodeURIComponent(`Olá ${credAdm.name}! Credenciais SEEK:\nLogin: ${maskPhone(rawL)}\nSenha: ${cred.pin}`);window.open(`https://wa.me/${waPhone}?text=${msg}`,'_blank');}
      return<Sheet title="Credenciais Vendedor" onClose={()=>setCredAdm(null)}>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="nm-in" style={{padding:'12px 14px'}}><div className="section-title" style={{marginBottom:3}}>Login</div><div style={{fontWeight:700}}>{maskPhone(rawL)||'—'}</div></div>
          <div className="nm-in" style={{padding:'12px 14px'}}><div className="section-title" style={{marginBottom:3}}>Senha atual</div><div style={{fontWeight:900,fontSize:'1.8rem',letterSpacing:'.5em'}}>{cred.pin}</div></div>
          <Fld label="Nova senha"><PinInput value={newPin} onChange={setNewPin} autoFocus/>{pinErr&&<span style={{color:'var(--red)',fontSize:'.74rem',fontWeight:700,marginTop:4}}>{pinErr}</span>}</Fld>
          <div style={{display:'flex',gap:10}}><button className="btn btn-full" onClick={()=>setCredAdm(null)}>Fechar</button><button className="btn btn-dark btn-full" onClick={savePin}>Salvar</button></div>
          {rawL&&<button className="btn btn-full" onClick={sendWA} style={{gap:8}}><IcWA s={15} fill="var(--green)"/>Enviar por WhatsApp</button>}
        </div>
      </Sheet>;
    })()}
  </>;
}

/* ══════════════════════════════════════════════════════════════════
   MASTER PANEL
══════════════════════════════════════════════════════════════════ */
function MasterPanel({adms,members,referrals,jrReferrals,seekJrs,credentials,offers,passReqs,levelNotifs,onLogout,onAddAdm,onDeleteAdm,onAddMember,onUpdateMember,onDeleteMember,onUpdatePin,onAddReferral,onUpdateReferral,onTogglePaid,onDeleteReferral,onAddSeekJr,onDeleteSeekJr,onAddJrReferral,onToggleJrPaid,onDeleteJrReferral,onAddOffer,onDeleteOffer,onMarkRead,spinRewards,chestRewards=[],onMarkSold,onUpdateJrReferral,onToggleSpinPaid}){
  const [view,setView]=useState('dashboard');
  const [selAdm,setSelAdm]=useState(null);
  const [selMember,setSelMember]=useState(null);
  const [editRefDirect,setEditRefDirect]=useState(null);
  const [showBell,setShowBell]=useState(false);
  const [showOffers,setShowOffers]=useState(false);
  const [showExtrato,setShowExtrato]=useState(false);
  const now=new Date();
  const [sm,setSm]=useState(now.getMonth()+1);
  const [sy,setSy]=useState(now.getFullYear());

  const pendReqs=(passReqs||[]).filter(r=>!r.resolved);
  const newRefs=[...referrals,...jrReferrals].filter(r=>r.isNew);
  const newJrs=seekJrs.filter(j=>j.isNew);
  const badge=pendReqs.length+newRefs.length+newJrs.length;
  const allRefs=[...referrals,...jrReferrals];

  const scopeMembers=selAdm?members.filter(m=>sameId(m.admId,selAdm.id)):members;
  const scopeJrs=selAdm?seekJrs.filter(j=>scopeMembers.some(m=>sameId(m.id,j.seekId))):seekJrs;
  const scopeRefs=selAdm?referrals.filter(r=>scopeMembers.some(m=>sameId(m.id,r.memberId))):referrals;
  const scopeJrRefs=selAdm?jrReferrals.filter(r=>scopeJrs.some(j=>sameId(j.id,r.jrId))):jrReferrals;
  const curMember=selMember?scopeMembers.find(m=>sameId(m.id,selMember.id))??selMember:null;

  function nav(dest,payload){if(dest==='editRef'){setEditRefDirect(payload);setView('editRef');}else setView(dest);}
  function goAdm(adm){setSelAdm(adm);setView('vendedorDetail');}

  const masterTabs=[{id:'dashboard',l:'Painel',I:IcGrid},{id:'vendedores',l:'Vendedores',I:IcUsers},{id:'membros',l:'SEEK',I:IcBook},{id:'remuneracao',l:'Regras',I:IcStar}];
  const activeTab=view==='memberDetail'?'membros':view==='vendedorDetail'?'vendedores':['pending','paid'].includes(view)?'dashboard':view;
  const inSubView=['memberDetail','pending','paid','editRef','vendedorDetail'].includes(view);

  return(
    <div style={{'--bg':'var(--bg-master)',background:'var(--bg-master)',minHeight:'100vh',maxWidth:640,margin:'0 auto',position:'relative'}}>
      <TopBar logo="SEEK NETWORK" right={
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button style={{position:'relative'}} className="icon-btn" onClick={()=>setShowBell(true)}>
            {badge>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',fontSize:'.5rem',fontWeight:900,borderRadius:99,padding:'1px 4px'}}>{badge}</span>}
            <IcBell s={18} c="var(--muted)"/>
          </button>
          <button className="icon-btn" onClick={onLogout}><IcOut s={17} c="var(--muted)"/></button>
        </div>
      }/>
      <div style={{padding:'4px 16px 8px',textAlign:'center'}}>
        <span style={{fontSize:'0.55rem',fontWeight:900,color:'var(--black)',letterSpacing:'.06em'}}>MASTER</span>
      </div>

      {view==='dashboard'&&<MasterDashboard adms={adms} members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} sm={sm} setSm={setSm} sy={sy} setSy={setSy} onNav={nav} passReqs={passReqs} onSelectAdm={goAdm} spinRewards={spinRewards}/>}
      {view==='vendedores'&&<MasterVendedores adms={adms} members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onAdd={onAddAdm} onDelete={onDeleteAdm} onSelect={goAdm} onUpdatePin={onUpdatePin}/>}
      {view==='vendedorDetail'&&selAdm&&<>
        <div style={{padding:'5px 16px 0',textAlign:'center'}}>
          <span style={{fontSize:'.76rem',fontWeight:800}}>{selAdm.name}</span>
        </div>
        <AdmDashboard members={scopeMembers} referrals={scopeRefs} jrReferrals={scopeJrRefs} seekJrs={scopeJrs} sm={sm} setSm={setSm} sy={sy} setSy={setSy} onNav={nav} passReqs={passReqs} credentials={credentials} onDeleteRef={onDeleteReferral} onDeleteJrRef={onDeleteJrReferral} spinRewards={spinRewards} chestRewards={chestRewards} hideAdmCommission={true}/>
      </>}
      {view==='membros'&&<AdmMembers members={scopeMembers} referrals={scopeRefs} jrReferrals={scopeJrRefs} seekJrs={scopeJrs} credentials={credentials} onSelect={m=>{setSelMember(m);setView('memberDetail');}} onAdd={selAdm?d=>onAddMember(d,selAdm.id):null} onDelete={onDeleteMember} onUpdatePin={onUpdatePin} onDeleteJr={onDeleteSeekJr}/>}
      {view==='memberDetail'&&curMember&&<AdmMemberDetail member={curMember} referrals={scopeRefs} jrReferrals={scopeJrRefs} seekJrs={scopeJrs} credentials={credentials} onBack={()=>{setSelMember(null);setView(selAdm?'vendedorDetail':'membros');}} onAddReferral={d=>onAddReferral(d,curMember.id)} onUpdateReferral={onUpdateReferral} onDeleteReferral={onDeleteReferral} onDeleteMember={id=>{onDeleteMember(id);setSelMember(null);setView(selAdm?'vendedorDetail':'membros');}} onUpdateMember={onUpdateMember} onUpdatePin={onUpdatePin} spinRewards={spinRewards} chestRewards={chestRewards}/>}
      {view==='pending'&&<LedgerPorSeek members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} paid={false} onBack={()=>setView('dashboard')} readOnly={true}/>}
      {view==='paid'&&<LedgerPorSeek members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} paid={true} onBack={()=>setView('dashboard')} readOnly={true}/>}
      {view==='editRef'&&editRefDirect&&(()=>{const _jr=editRefDirect.jrId?seekJrs.find(j=>sameId(j.id,editRefDirect.jrId)):null;const _m=(editRefDirect.memberId?members.find(m=>sameId(m.id,editRefDirect.memberId)):_jr?members.find(m=>sameId(m.id,_jr.seekId)):null)||{id:0,name:'?'};return<AdmMemberDetail member={_m} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onBack={()=>{setEditRefDirect(null);setView('dashboard');}} onAddReferral={d=>onAddReferral(d,_m.id)} onUpdateReferral={onUpdateReferral} onDeleteReferral={onDeleteReferral} onDeleteMember={onDeleteMember} onUpdateMember={onUpdateMember} onUpdatePin={onUpdatePin} spinRewards={spinRewards} chestRewards={chestRewards}/>;})()}
      {view==='remuneracao'&&<RemuneracaoPanel isMaster={true}/>}

      {!inSubView&&(
        <div style={{position:'fixed',bottom:74,left:'50%',transform:'translateX(-50%)',width:'calc(100% - 32px)',maxWidth:576,zIndex:19,padding:0}}>
          <button className="btn btn-dark btn-full" style={{padding:14}} onClick={()=>setShowExtrato(true)}>📋 Extrato</button>
        </div>
      )}
      {!inSubView&&(
        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:640,zIndex:20}}>
          <div className="tab-bar">
            {masterTabs.map(({id,l,I})=>(
              <button key={id} className={`tab${activeTab===id?' on':''}`} onClick={()=>{setView(id);setSelAdm(null);setSelMember(null);}}>
                <I s={20} c={activeTab===id?'var(--black)':'var(--muted)'}/>
                <span>{l}</span>
              </button>
            ))}
            <button className="tab" onClick={()=>setShowOffers(true)}><span style={{fontSize:'1.1rem',lineHeight:1}}>🏷️</span><span>Ofertas</span></button>
          </div>
        </div>
      )}
      {view==='vendedorDetail'&&selAdm&&(
        <div style={{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:640,zIndex:20}}>
          <div className="tab-bar">
            <button className="btn" style={{flex:1,padding:'10px'}} onClick={()=>{setSelAdm(null);setSelMember(null);setView('vendedores');}}><IcLeft s={16}/>Voltar</button>
            <button className="btn" style={{flex:1,padding:'10px'}} onClick={()=>setView('membros')}><IcUsers s={15}/>SEEK</button>
          </div>
        </div>
      )}

      {showBell&&<BellPanel members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} onClose={()=>setShowBell(false)} onEditRef={r=>{setEditRefDirect(r);setView('editRef');}} onDeleteRef={onDeleteReferral} onDeleteJrRef={onDeleteJrReferral} passReqs={passReqs} onMarkRead={onMarkRead}/>}
      {showOffers&&<OffersPanel offers={offers} onClose={()=>setShowOffers(false)} isAdm={true} onAddOffer={onAddOffer} onDeleteOffer={onDeleteOffer}/>}
      {showExtrato&&<ExtratoModal role="master" data={{adms,members,referrals,jrReferrals,seekJrs,spinRewards}} onClose={()=>setShowExtrato(false)}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   VENDEDOR — TELA DE NOTIFICAÇÕES (sino completo)
══════════════════════════════════════════════════════════════════ */
function VendedorNotifScreen({members,referrals,jrReferrals,seekJrs,passReqs,onBack,onMarkSold,onUpdateRef,onMarkRead,spinRewards,onTogglePaid,onToggleJrPaid,initialTab}){
  const [tab,setTab]=useState(initialTab||'aguardando');
  const [selling,setSelling]=useState(null);
  const [editing,setEditing]=useState(null);
  const [showRelatorio,setShowRelatorio]=useState(false);

  function getStatus(r){if(r.status)return r.status;if(r.paid)return'pago';if((r.productValue||0)>0)return'a_pagar';return'aguardando';}

  const allCombined=[
    ...referrals.map(r=>({...r,_isJr:false})),
    ...jrReferrals.map(r=>({...r,_isJr:true})),
  ].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));

  const byStatus={
    aguardando:allCombined.filter(r=>getStatus(r)==='aguardando'),
    a_pagar:allCombined.filter(r=>getStatus(r)==='a_pagar'),
    pago:allCombined.filter(r=>getStatus(r)==='pago'),
  };
  const tabData=byStatus[tab]||[];
  const forgotReqs=(passReqs||[]).filter(r=>r.type==='forgot'&&!r.resolved);

  function buildRelatorio(){
    const d=new Date();
    const ds=`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    function line(r){
      const who=r._isJr?(seekJrs.find(j=>sameId(j.id,r.jrId))||{name:'JR'}).name+' JR':(members.find(m=>sameId(m.id,r.memberId))||{name:'SEEK'}).name;
      const val=r.productValue>0?` · ${fBRL(r.productValue)} · ${fBRL(r.commission)}`:'';
      return`• ${r.clientName||'?'} (${who})${val} — ${fDate(r)}`;
    }
    return[
      `*SEEK NETWORK — NOTIFICAÇÕES VENDEDOR*`,`Data: ${ds}`,``,
      `📋 AGUARDANDO (${byStatus.aguardando.length})`,
      ...byStatus.aguardando.map(line),``,
      `💰 A PAGAR (${byStatus.a_pagar.length})`,
      ...byStatus.a_pagar.map(line),``,
      `✅ PAGO (${byStatus.pago.length})`,
      ...byStatus.pago.map(line),``,
      `Total a pagar: ${fBRL(byStatus.a_pagar.reduce((s,r)=>s+r.commission,0))}`,
      (spinRewards||[]).length>0?`🎰 Bônus Roleta pago: ${fBRL((spinRewards||[]).reduce((s,r)=>s+r.value,0))}`:'',
    ].filter(l=>l!==undefined).join('\n');
  }

  function SaleForm({ref:r,onCancel,onSave}){
    const [prodType,setProdType]=useState('auto');
    const [val,setVal]=useState(0);
    const [date,setDate]=useState(todayISO());
    function submit(e){
      e.preventDefault();if(val<=0)return;
      const pt=PRODUCT_TYPES.find(p=>p.id===prodType)||PRODUCT_TYPES[0];
      const commission=val*pt.rate;
      const parts=date.split('-').map(Number);
      onSave({productType:prodType,productValue:val,commission,year:parts[0],month:parts[1],day:parts[2]});
    }
    const commission=val>0?(val*(PRODUCT_TYPES.find(p=>p.id===prodType)||PRODUCT_TYPES[0]).rate):0;
    return<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="nm-in" style={{padding:'12px 14px',marginBottom:4}}>
        <div style={{fontWeight:800,fontSize:'.92rem'}}>{r.clientName}</div>
        <div style={{fontSize:'.72rem',color:'var(--muted)',marginTop:4}}>
          {r._isJr?(seekJrs.find(j=>sameId(j.id,r.jrId))||{name:'JR'}).name+' JR':(members.find(m=>sameId(m.id,r.memberId))||{name:'SEEK'}).name}
        </div>
      </div>
      <Fld label="Tipo de Produto"><ProductSelect value={prodType} onChange={setProdType}/></Fld>
      <Fld label="Valor do Negócio"><CurrencyInput value={val} onChange={setVal}/></Fld>
      <Fld label="Data da Venda"><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></Fld>
      <div className="nm-in" style={{padding:'12px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:'.8rem',color:'var(--muted)',fontWeight:600}}>Comissão do SEEK</span>
        <span style={{fontWeight:800,fontSize:'1rem',color:'var(--green)'}}>{fBRL(commission)}</span>
      </div>
      <div style={{display:'flex',gap:12}}>
        <button type="button" className="btn btn-full" onClick={onCancel}>Cancelar</button>
        <button type="submit" disabled={val<=0} style={{flex:1,padding:'14px 20px',borderRadius:'var(--rb)',border:'none',cursor:val>0?'pointer':'not-allowed',opacity:val>0?1:0.5,background:val>0?'linear-gradient(145deg,#1D7A3A,#22AA44)':'var(--bg)',color:val>0?'#fff':'var(--muted)',fontFamily:'inherit',fontWeight:900,fontSize:'.84rem',letterSpacing:'.04em',boxShadow:val>0?'4px 4px 14px rgba(29,122,58,.4),-2px -2px 8px rgba(255,255,255,.15)':'var(--nm-out)',transition:'all .3s',display:'flex',flexDirection:'column',alignItems:'center',gap:3}}><span>✅ INDICADO</span><span style={{fontSize:'.6rem',fontWeight:600,letterSpacing:'0',opacity:.85}}>Confirmar indicação como venda</span></button>
      </div>
    </form>;
  }

  function EditRefForm({ref:r,onCancel,onSave}){
    const [cn,setCn]=useState(r.clientName||'');
    const [wa,setWa]=useState(r.whatsapp||'');
    const [prodType,setProdType]=useState(r.productType||'auto');
    const [val,setVal]=useState(r.productValue||0);
    const [date,setDate]=useState(r.year&&r.month?`${r.year}-${String(r.month).padStart(2,'0')}-${String(r.day||1).padStart(2,'0')}`:todayISO());
    function submit(e){
      e.preventDefault();if(!cn.trim())return;
      const pt=PRODUCT_TYPES.find(p=>p.id===prodType)||PRODUCT_TYPES[0];
      const commission=val>0?val*pt.rate:0;
      const parts=date.split('-').map(Number);
      onSave({clientName:cn.trim().toUpperCase(),whatsapp:wa,productType:prodType,productValue:val,commission,year:parts[0],month:parts[1],day:parts[2]});
    }
    return<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
      <Fld label="Nome do Cliente"><input className="inp" value={cn} onChange={e=>setCn(e.target.value.toUpperCase())} autoFocus autoCapitalize="characters" style={{textTransform:'uppercase'}}/></Fld>
      <Fld label="WhatsApp"><PhoneInput value={wa} onChange={setWa}/></Fld>
      <Fld label="Tipo de Produto"><ProductSelect value={prodType} onChange={setProdType}/></Fld>
      <Fld label="Valor do Negócio"><CurrencyInput value={val} onChange={setVal}/></Fld>
      <Fld label="Data"><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></Fld>
      <div style={{display:'flex',gap:12}}>
        <button type="button" className="btn btn-full" onClick={onCancel}>Cancelar</button>
        <button type="submit" className="btn btn-dark btn-full">Salvar</button>
      </div>
    </form>;
  }

  const relatorioText=buildRelatorio();
  const tabColors={aguardando:'var(--yellow)',a_pagar:'var(--red)',pago:'var(--green)'};
  const tabLabels={aguardando:'Aguardando',a_pagar:'A Pagar',pago:'Pago'};

  return<div style={{maxWidth:640,margin:'0 auto',minHeight:'100vh'}}>
    <TopBar title="Notificações"
      left={<button className="icon-btn" onClick={onBack}><IcLeft s={18}/></button>}
      right={<button className="btn" style={{padding:'8px 12px',fontSize:'.72rem',gap:5}} onClick={()=>setShowRelatorio(true)}>📋 Relatório</button>}
    />

    {forgotReqs.length>0&&<div style={{margin:'8px 16px 0',padding:'10px 14px',borderRadius:14,background:'var(--bg)',boxShadow:'var(--nm-out)',border:'1.5px solid rgba(192,57,43,.3)'}}>
      <div style={{fontWeight:800,fontSize:'.78rem',color:'var(--red)',marginBottom:6}}>🔐 {forgotReqs.length} solicitação(ões) de senha</div>
      {forgotReqs.map(req=>{
        const mb=members.find(m=>(m.whatsapp||'').replace(/\D/g,'')===req.phone);
        const jrObj=seekJrs.find(j=>(j.whatsapp||'').replace(/\D/g,'')===req.phone);
        const name=mb?mb.name:jrObj?jrObj.name:maskPhone(req.phone);
        return<div key={req.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 0'}}>
          <div style={{fontSize:'.8rem',fontWeight:700}}>{name}</div>
          <button className="btn btn-dark" style={{padding:'5px 12px',fontSize:'.7rem',gap:4}} onClick={()=>onMarkRead(req.id,'forgot')}>
            <IcCheck s={11} c="#fff"/>Resolvido
          </button>
        </div>;
      })}
    </div>}

    <div style={{display:'flex',gap:8,padding:'10px 16px 2px'}}>
      {['aguardando','a_pagar','pago'].map(id=>(
        <button key={id} onClick={()=>setTab(id)} style={{
          flex:1,padding:'9px 4px',borderRadius:12,border:'none',cursor:'pointer',
          fontFamily:'inherit',fontWeight:800,fontSize:'.7rem',
          background:tab===id?'var(--black)':'var(--bg)',
          color:tab===id?'#fff':tabColors[id],
          boxShadow:tab===id?'4px 4px 14px rgba(0,0,0,.3),-2px -2px 8px rgba(255,255,255,.15)':'var(--nm-out)',
          transition:'all .2s',
        }}>
          {tabLabels[id]}
          {byStatus[id].length>0&&<span style={{
            marginLeft:5,padding:'1px 6px',borderRadius:99,fontSize:'.6rem',
            background:tab===id?'rgba(255,255,255,0.25)':tabColors[id],color:'#fff',
          }}>{byStatus[id].length}</span>}
        </button>
      ))}
    </div>

    <div className="page" style={{paddingBottom:30,paddingTop:10}}>
      {tabData.length===0?<Empty text="Nenhuma indicação nesta categoria"/>:tabData.map(r=>{
        const isJr=r._isJr;
        const seek=isJr?seekJrs.find(j=>sameId(j.id,r.jrId)):members.find(m=>sameId(m.id,r.memberId));
        const seekParent=isJr&&seek?members.find(m=>sameId(m.id,seek.seekId)):null;
        const digits=(r.whatsapp||'').replace(/\D/g,'');
        const phone=digits?(digits.startsWith('55')&&digits.length>=12?digits:`55${digits}`):'';
        const st=getStatus(r);
        const stColor=tabColors[st]||'var(--muted)';
        const stLabel=tabLabels[st]||st;
        return<div key={r.id} className="nm" style={{padding:'14px 16px'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
            <div style={{flex:1}}>
              <div style={{fontWeight:800,fontSize:'.94rem',marginBottom:3}}>{r.clientName||'—'}</div>
              <div style={{fontSize:'.7rem',color:'var(--muted)',fontWeight:600,display:'flex',alignItems:'center',gap:5,flexWrap:'wrap'}}>
                {isJr&&<span className="tag-jr">JR</span>}
                {seek&&<span>{seek.name}</span>}
                {isJr&&seekParent&&<><span style={{opacity:.4}}>→</span><span>SEEK: {seekParent.name}</span></>}
              </div>
            </div>
            <span style={{fontSize:'.66rem',fontWeight:800,padding:'3px 10px',borderRadius:50,background:'var(--bg)',boxShadow:'var(--nm-out)',color:stColor,flexShrink:0}}>
              {stLabel}
            </span>
          </div>
          {r.productValue>0&&<div style={{fontSize:'.74rem',color:'var(--muted)',marginBottom:6}}>
            {PRODUCT_TYPES.find(p=>p.id===r.productType)?.icon} {PRODUCT_TYPES.find(p=>p.id===r.productType)?.name} · {fBRL(r.productValue)} · <span style={{color:'var(--green)',fontWeight:700}}>{fBRL(r.commission)}</span>
          </div>}
          {r.whatsapp&&<div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:6,display:'flex',alignItems:'center',gap:5}}>
            <IcWA s={13} fill="#25D366"/>{maskPhone(r.whatsapp)}
          </div>}
          {r.observacoes&&<div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:6,fontStyle:'italic',paddingLeft:2}}>💬 {r.observacoes}</div>}
          <div style={{fontSize:'.66rem',color:'var(--muted)',marginBottom:10}}>{fDate(r)}</div>
          <div style={{display:'flex',gap:7,flexWrap:'wrap'}}>
            {phone&&<a href={`https://wa.me/${phone}`} target="_blank" style={{textDecoration:'none'}}>
              <button className="btn" style={{padding:'7px 11px',fontSize:'.72rem',gap:4,color:'#25D366'}}><IcWA s={13} fill="#25D366"/>WhatsApp</button>
            </a>}
            <button className="btn" style={{padding:'7px 11px',fontSize:'.72rem',gap:4,color:'var(--yellow)'}} onClick={()=>st==='aguardando'?setSelling({ref:r,isJr}):setEditing({ref:r,isJr})}>
              <IcEdit s={13}/>{st==='aguardando'?'Preencher Venda':'Editar'}
            </button>
            {st==='a_pagar'&&<button onClick={()=>r._isJr?onToggleJrPaid(r.id):onTogglePaid(r.id)} style={{
              padding:'7px 14px',borderRadius:12,border:'none',cursor:'pointer',
              background:'linear-gradient(135deg,#1D7A3A,#22AA44)',
              color:'#fff',fontFamily:'inherit',fontWeight:900,fontSize:'.74rem',
              boxShadow:'3px 3px 10px rgba(29,122,58,.4)',
            }}>PAGAR</button>}
          </div>
        </div>;
      })}
    </div>

    {selling&&<Sheet title="Confirmar Venda" onClose={()=>setSelling(null)}>
      <SaleForm ref={selling.ref} onCancel={()=>setSelling(null)} onSave={data=>{setSelling(null);onMarkSold(selling.ref.id,data,selling.isJr);}}/>
    </Sheet>}

    {editing&&<Sheet title="Editar Indicação" onClose={()=>setEditing(null)}>
      <EditRefForm ref={editing.ref} onCancel={()=>setEditing(null)} onSave={async data=>{
        await onUpdateRef(editing.ref.id,data,editing.isJr);
        setEditing(null);
      }}/>
    </Sheet>}

    {showRelatorio&&<Sheet title="Relatório de Notificações" onClose={()=>setShowRelatorio(false)}>
      <div className="nm-in" style={{padding:'14px',fontFamily:'monospace',fontSize:'.72rem',whiteSpace:'pre-wrap',lineHeight:1.7,maxHeight:'56vh',overflowY:'auto',borderRadius:16,marginBottom:14}}>
        {relatorioText}
      </div>
      <div style={{display:'flex',gap:10}}>
        <button className="btn btn-full" style={{gap:6,color:'#25D366'}} onClick={()=>window.open(`https://wa.me/?text=${encodeURIComponent(relatorioText)}`,'_blank')}>
          <IcWA s={15} fill="#25D366"/>WhatsApp
        </button>
        <button className="btn btn-full" style={{gap:6}} onClick={()=>{
          const div=document.createElement('div');div.className='print-only';
          div.style.cssText='font-family:monospace;white-space:pre-wrap;font-size:13px;padding:28px;color:#111;line-height:1.8;';
          div.textContent=relatorioText;document.body.appendChild(div);window.print();document.body.removeChild(div);
        }}>🖨️ Imprimir</button>
      </div>
    </Sheet>}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════
   VENDEDOR — PAINEL FLUTUANTE DO SINO
══════════════════════════════════════════════════════════════════ */
function VendedorBellPanel({members,referrals,jrReferrals,seekJrs,passReqs,onClose,onMarkRead,onMarkSold,onUpdateRef,onTogglePaid,onToggleJrPaid}){
  const [editItem,setEditItem]=useState(null);
  const allCombined=[
    ...referrals.filter(r=>r.isNew).map(r=>({...r,_isJr:false})),
    ...jrReferrals.filter(r=>r.isNew).map(r=>({...r,_isJr:true})),
  ].sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
  const forgotReqs=(passReqs||[]).filter(r=>r.type==='forgot'&&!r.resolved);
  const newJrs=seekJrs.filter(j=>j.isNew);
  function getStatus(r){if(r.status)return r.status;if(r.paid)return'pago';if((r.productValue||0)>0)return'a_pagar';return'aguardando';}
  const stColors={aguardando:'var(--yellow)',a_pagar:'var(--red)',pago:'var(--green)'};
  const stLabels={aguardando:'Aguardando',a_pagar:'A Pagar',pago:'Pago'};
  const unread=allCombined.length+newJrs.length+forgotReqs.length;
  const total=unread;

  function SaleForm({r,isJr,onCancel,onSave}){
    const [prodType,setProdType]=useState('auto');
    const [val,setVal]=useState(0);
    const [date,setDate]=useState(todayISO());
    const commission=val>0?(val*(PRODUCT_TYPES.find(p=>p.id===prodType)||PRODUCT_TYPES[0]).rate):0;
    function submit(e){
      e.preventDefault();if(val<=0)return;
      const pt=PRODUCT_TYPES.find(p=>p.id===prodType)||PRODUCT_TYPES[0];
      const parts=date.split('-').map(Number);
      onSave({productType:prodType,productValue:val,commission:val*pt.rate,year:parts[0],month:parts[1],day:parts[2]});
    }
    return<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
      <div className="nm-in" style={{padding:'12px 14px',marginBottom:4}}>
        <div style={{fontWeight:800,fontSize:'.92rem'}}>{r.clientName}</div>
        <div style={{fontSize:'.72rem',color:'var(--muted)',marginTop:4}}>
          {isJr?(seekJrs.find(j=>sameId(j.id,r.jrId))||{name:'JR'}).name+' JR':(members.find(m=>sameId(m.id,r.memberId))||{name:'SEEK'}).name}
        </div>
        {r.observacoes&&<div style={{fontSize:'.72rem',color:'var(--muted)',fontStyle:'italic',marginTop:4}}>💬 {r.observacoes}</div>}
      </div>
      <Fld label="Tipo de Produto"><ProductSelect value={prodType} onChange={setProdType}/></Fld>
      <Fld label="Valor do Negócio"><CurrencyInput value={val} onChange={setVal}/></Fld>
      <Fld label="Data da Venda"><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></Fld>
      <div className="nm-in" style={{padding:'12px 14px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:'.8rem',color:'var(--muted)',fontWeight:600}}>Comissão do SEEK</span>
        <span style={{fontWeight:800,fontSize:'1rem',color:'var(--green)'}}>{fBRL(commission)}</span>
      </div>
      <div style={{display:'flex',gap:12}}>
        <button type="button" className="btn btn-full" onClick={onCancel}>Cancelar</button>
        <button type="submit" disabled={val<=0} style={{flex:1,padding:'14px 20px',borderRadius:'var(--rb)',border:'none',cursor:val>0?'pointer':'not-allowed',opacity:val>0?1:0.5,background:val>0?'linear-gradient(145deg,#1D7A3A,#22AA44)':'var(--bg)',color:val>0?'#fff':'var(--muted)',fontFamily:'inherit',fontWeight:900,fontSize:'.84rem',letterSpacing:'.04em',boxShadow:val>0?'4px 4px 14px rgba(29,122,58,.4),-2px -2px 8px rgba(255,255,255,.15)':'var(--nm-out)',transition:'all .3s',display:'flex',flexDirection:'column',alignItems:'center',gap:3}}><span>✅ INDICADO</span><span style={{fontSize:'.6rem',fontWeight:600,letterSpacing:'0',opacity:.85}}>Confirmar indicação como venda</span></button>
      </div>
    </form>;
  }

  function EditRefForm({r,isJr,onCancel,onSave}){
    const [cn,setCn]=useState(r.clientName||'');
    const [wa,setWa]=useState(r.whatsapp||'');
    const [prodType,setProdType]=useState(r.productType||'auto');
    const [val,setVal]=useState(r.productValue||0);
    const [date,setDate]=useState(r.year&&r.month?`${r.year}-${String(r.month).padStart(2,'0')}-${String(r.day||1).padStart(2,'0')}`:todayISO());
    function submit(e){
      e.preventDefault();if(!cn.trim())return;
      const pt=PRODUCT_TYPES.find(p=>p.id===prodType)||PRODUCT_TYPES[0];
      const parts=date.split('-').map(Number);
      onSave({clientName:cn.trim().toUpperCase(),whatsapp:wa,productType:prodType,productValue:val,commission:val>0?val*pt.rate:0,year:parts[0],month:parts[1],day:parts[2]});
    }
    return<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:16}}>
      <Fld label="Nome do Cliente"><input className="inp" value={cn} onChange={e=>setCn(e.target.value.toUpperCase())} autoFocus autoCapitalize="characters" style={{textTransform:'uppercase'}}/></Fld>
      <Fld label="WhatsApp"><PhoneInput value={wa} onChange={setWa}/></Fld>
      <Fld label="Tipo de Produto"><ProductSelect value={prodType} onChange={setProdType}/></Fld>
      <Fld label="Valor do Negócio"><CurrencyInput value={val} onChange={setVal}/></Fld>
      <Fld label="Data"><input className="inp" type="date" value={date} onChange={e=>setDate(e.target.value)}/></Fld>
      <div style={{display:'flex',gap:12}}>
        <button type="button" className="btn btn-full" onClick={onCancel}>Cancelar</button>
        <button type="submit" className="btn btn-dark btn-full">Salvar</button>
      </div>
    </form>;
  }

  return(
    <div className="overlay" onClick={editItem?undefined:onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'88vh'}}>
        <div className="handle"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <IcBell s={18} c="var(--black)"/>
            <span style={{fontWeight:900,fontSize:'1rem'}}>Notificações</span>
            {unread>0&&<span style={{background:'var(--red)',color:'#fff',fontSize:'.62rem',fontWeight:900,borderRadius:99,padding:'2px 8px'}}>{unread}</span>}
          </div>
          <button className="icon-btn" onClick={onClose}><IcX s={17} c="var(--muted)"/></button>
        </div>
        {total===0&&<Empty text="Nenhuma notificação"/>}
        {forgotReqs.length>0&&<div style={{marginBottom:14}}>
          <div className="label" style={{marginBottom:8}}>🔐 Senhas esquecidas</div>
          {forgotReqs.map(req=>{
            const mb=members.find(m=>(m.whatsapp||'').replace(/\D/g,'')===req.phone);
            const jrObj=seekJrs.find(j=>(j.whatsapp||'').replace(/\D/g,'')===req.phone);
            const name=mb?mb.name:jrObj?jrObj.name:maskPhone(req.phone);
            return<div key={req.id} className="nm" style={{padding:'10px 14px',marginBottom:6,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontWeight:700,fontSize:'.86rem'}}>{name}</div>
                <div style={{fontSize:'.68rem',color:'var(--muted)',marginTop:2}}>Esqueceu a senha</div>
              </div>
              <button className="btn btn-dark" style={{padding:'6px 12px',fontSize:'.72rem',gap:4}} onClick={()=>onMarkRead(req.id,'forgot')}>
                <IcCheck s={11} c="#fff"/>Resolvido
              </button>
            </div>;
          })}
        </div>}
        {newJrs.length>0&&<div style={{marginBottom:14}}>
          <div className="label" style={{marginBottom:8}}>Novos SEEK JR</div>
          {newJrs.map(jr=>{
            const seek=members.find(m=>sameId(m.id,jr.seekId));
            return<div key={jr.id} className="nm" style={{padding:'10px 14px',marginBottom:6,display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{display:'flex',alignItems:'center',gap:5,marginBottom:2}}>
                  <span style={{fontWeight:900,fontSize:'.88rem'}}>{jr.name}</span>
                  <span className="tag-jr">JR</span>
                </div>
                {seek&&<div style={{fontSize:'.68rem',color:'var(--muted)'}}>Padrinho: {seek.name}</div>}
              </div>
              <button className="btn" style={{padding:'6px 10px',fontSize:'.7rem',color:'var(--muted)'}} onClick={()=>onMarkRead(jr.id,'jr')}>✓ Lido</button>
            </div>;
          })}
        </div>}
        {allCombined.length>0&&<div>
          <div className="label" style={{marginBottom:8}}>Indicações ({allCombined.length})</div>
          {allCombined.map(r=>{
            const isJr=r._isJr;
            const seek=isJr?seekJrs.find(j=>sameId(j.id,r.jrId)):members.find(m=>sameId(m.id,r.memberId));
            const st=getStatus(r);
            const digits=(r.whatsapp||'').replace(/\D/g,'');
            const phone=digits?(digits.startsWith('55')&&digits.length>=12?digits:`55${digits}`):'';
            return<div key={r.id} style={{borderRadius:14,padding:'10px 12px',marginBottom:6,background:r.isNew?'var(--bg-up)':'transparent',border:r.isNew?'1.5px solid rgba(29,122,58,.15)':'1.5px solid rgba(0,0,0,.04)',cursor:'pointer'}} onClick={()=>{if(r.isNew)onMarkRead(r.id);setEditItem({ref:r,isJr});}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
                <div style={{flex:1}}>
                  {r.isNew&&<span style={{display:'inline-block',width:7,height:7,borderRadius:'50%',background:'var(--red)',marginRight:6,verticalAlign:'middle'}}/>}
                  <span style={{fontWeight:800,fontSize:'.9rem'}}>{r.clientName}</span>
                </div>
                <span style={{fontSize:'.64rem',fontWeight:800,padding:'2px 7px',borderRadius:50,background:'var(--bg)',boxShadow:'var(--nm-out)',color:stColors[st],flexShrink:0,marginLeft:6}}>{stLabels[st]}</span>
              </div>
              <div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:4}}>
                {isJr&&<span className="tag-jr" style={{marginRight:4}}>JR</span>}
                {seek&&<span>{seek.name}</span>}
                <span style={{margin:'0 5px',opacity:.4}}>·</span>
                <span>{fDate(r)}</span>
              </div>
              {r.productValue>0&&<div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:r.observacoes?4:6}}>{PRODUCT_TYPES.find(p=>p.id===r.productType)?.icon} {PRODUCT_TYPES.find(p=>p.id===r.productType)?.name||'Automóvel'} · {fBRL(r.productValue)} · <span style={{color:'var(--green)',fontWeight:700}}>{fBRL(r.commission)}</span></div>}
              {r.observacoes&&<div style={{fontSize:'.68rem',color:'var(--muted)',fontStyle:'italic',marginBottom:6}}>💬 {r.observacoes}</div>}
              {st==='aguardando'&&<div onClick={e=>e.stopPropagation()}>
                <button style={{padding:'5px 12px',borderRadius:10,border:'none',cursor:'pointer',background:'linear-gradient(135deg,#B91C1C,#EF4444)',color:'#fff',fontFamily:'inherit',fontWeight:900,fontSize:'.72rem',boxShadow:'2px 2px 8px rgba(185,28,28,.35)'}} onClick={()=>{const t=new Date();onMarkSold(r.id,{productType:r.productType||'auto',productValue:r.productValue||0,commission:r.commission||0,year:t.getFullYear(),month:t.getMonth()+1,day:t.getDate()},isJr);}}>⏳ PENDENTE</button>
              </div>}
              {st==='a_pagar'&&<div onClick={e=>e.stopPropagation()}>
                <button disabled style={{padding:'5px 12px',borderRadius:10,border:'none',cursor:'not-allowed',background:'rgba(29,122,58,.12)',color:'var(--green)',fontFamily:'inherit',fontWeight:900,fontSize:'.72rem'}}>✅ Confirmado</button>
              </div>}
            </div>;
          })}
        </div>}
        {editItem&&<Sheet title={getStatus(editItem.ref)==='aguardando'?'Confirmar Venda':'Editar Indicação'} onClose={()=>setEditItem(null)}>
          {getStatus(editItem.ref)==='aguardando'
            ?<SaleForm r={editItem.ref} isJr={editItem.isJr} onCancel={()=>setEditItem(null)} onSave={data=>{setEditItem(null);onMarkSold(editItem.ref.id,data,editItem.isJr);}}/>
            :<EditRefForm r={editItem.ref} isJr={editItem.isJr} onCancel={()=>setEditItem(null)} onSave={data=>{setEditItem(null);onUpdateRef(editItem.ref.id,data,editItem.isJr);}}/>
          }
        </Sheet>}
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   LEDGER POR SEEK — A Pagar e Pagas organizados por SEEK/JR
══════════════════════════════════════════════════════════════════ */
function LedgerPorSeek({members,seekJrs,referrals,jrReferrals,spinRewards,chestRewards=[],paid,onBack,onPayAllForSeek,onPayAllForJr,readOnly=false}){
  const allSpins=spinRewards||[];
  const allChests=chestRewards||[];
  const filtRefs=paid?referrals.filter(r=>r.paid):referrals.filter(r=>!r.paid&&(r.status==='a_pagar'||r.productValue>0));
  const filtJrRefs=paid?jrReferrals.filter(r=>r.paid):jrReferrals.filter(r=>!r.paid&&(r.status==='a_pagar'||r.productValue>0));
  const filtSpins=paid?allSpins.filter(s=>s.paid):allSpins.filter(s=>!s.paid);
  const filtChests=paid?allChests.filter(c=>c.paid):allChests.filter(c=>!c.paid);
  const total=filtRefs.reduce((s,r)=>s+r.commission,0)+filtJrRefs.reduce((s,r)=>s+r.commission,0)+filtSpins.reduce((s,r)=>s+r.value,0)+filtChests.reduce((s,c)=>s+c.valor,0);
  const comColor=paid?'var(--green)':'var(--red)';

  const entries=[];
  members.forEach(m=>{
    const myJrs=seekJrs.filter(j=>sameId(j.seekId,m.id));
    const refs=filtRefs.filter(r=>sameId(r.memberId,m.id));
    const spins=filtSpins.filter(s=>sameId(s.seekId,m.id));
    const chests=filtChests.filter(c=>sameId(c.seekId,m.id));
    if(refs.length||spins.length||chests.length)
      entries.push({type:'seek',m,refs,spins,chests,sub:refs.reduce((s,r)=>s+r.commission,0)+spins.reduce((s,r)=>s+r.value,0)+chests.reduce((s,c)=>s+c.valor,0)});
    myJrs.forEach(jr=>{
      const jr_refs=filtJrRefs.filter(r=>sameId(r.jrId,jr.id));
      const jr_spins=filtSpins.filter(s=>sameId(s.jrId,jr.id));
      const jr_chests=filtChests.filter(c=>sameId(c.jrId,jr.id));
      if(jr_refs.length||jr_spins.length||jr_chests.length)
        entries.push({type:'jr',jr,seekName:m.name,seekId:m.id,refs:jr_refs,spins:jr_spins,chests:jr_chests,sub:jr_refs.reduce((s,r)=>s+r.commission,0)+jr_spins.reduce((s,r)=>s+r.value,0)+jr_chests.reduce((s,c)=>s+c.valor,0)});
    });
  });

  function EntryCard({e}){
    const isSeek=e.type==='seek';
    const name=isSeek?e.m.name:e.jr.name;
    const comTotal=e.refs.reduce((s,r)=>s+r.commission,0);
    const spinTotal=e.spins.reduce((s,r)=>s+r.value,0);
    const chestTotal=(e.chests||[]).reduce((s,c)=>s+c.valor,0);
    const avulsos=e.spins.filter(s=>!e.refs.some(r=>sameId(s.referralId,r.id)));
    const showPay=!paid&&!readOnly;
    return(
      <div style={{marginBottom:12}}>
        <div style={{background:'rgba(0,0,0,.04)',borderRadius:'12px 12px 0 0',padding:'10px 14px',display:'flex',alignItems:'center',gap:7}}>
          <span style={{fontWeight:900,fontSize:'.88rem'}}>{'👤 '}{name}</span>
          {!isSeek&&<span className="tag-jr">JR</span>}
          {!isSeek&&<span style={{fontSize:'.66rem',color:'var(--muted)',fontWeight:600}}>{'— JR de '}{e.seekName}</span>}
        </div>
        <div className="nm" style={{borderRadius:showPay?'0':'0 0 12px 12px',padding:'0 14px'}}>
          {e.refs.map((r,i)=>{
            const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
            const linked=e.spins.find(s=>sameId(s.referralId,r.id));
            return(
              <React.Fragment key={r.id}>
                <div style={{padding:'11px 0'}}>
                  <div style={{fontWeight:800,fontSize:'.8rem',marginBottom:3}}>{'Cliente: '}{r.clientName}</div>
                  <div style={{fontSize:'.68rem',color:'var(--muted)',lineHeight:1.6}}>
                    {pt.icon}{' '}{pt.name}{'·'}{' Venda: '}{fBRL(r.productValue)}{'·'}{' Comissão: '}<span style={{color:comColor,fontWeight:800}}>{fBRL(r.commission)}</span>
                  </div>
                  {linked&&<div style={{fontSize:'.68rem',color:'#8833BB',fontWeight:700,marginTop:3}}>{'🎰 Bônus Roleta desta indicação: '}{fBRL(linked.value)}</div>}
                </div>
                {(i<e.refs.length-1||avulsos.length>0)&&<div style={{height:1,background:'rgba(0,0,0,.06)'}}/>}
              </React.Fragment>
            );
          })}
          {avulsos.map((s,i)=>{
            const dt=s.createdAt?new Date(s.createdAt):null;
            const dtStr=dt?`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`:'';
            return(
              <React.Fragment key={'av_'+s.id}>
                <div style={{padding:'10px 0'}}>
                  <div style={{fontSize:'.68rem',color:'#8833BB',fontWeight:800}}>{'🎰 Bônus Roleta Avulso'}</div>
                  <div style={{fontSize:'.67rem',color:'var(--muted)',marginTop:2}}>{fBRL(s.value)}{dtStr?` · ${dtStr}`:''}</div>
                </div>
                {i<avulsos.length-1&&<div style={{height:1,background:'rgba(0,0,0,.06)'}}/>}
              </React.Fragment>
            );
          })}
          {(e.chests||[]).map((c,i)=>{
            const dt=c.createdAt?new Date(c.createdAt):null;
            const dtStr=dt?`${String(dt.getDate()).padStart(2,'0')}/${String(dt.getMonth()+1).padStart(2,'0')}/${dt.getFullYear()}`:'';
            return(
              <React.Fragment key={'ch_'+c.id}>
                <div style={{padding:'10px 0'}}>
                  <div style={{fontSize:'.68rem',color:'#B8860B',fontWeight:800}}>{'🎁 Cofre Misterioso'}</div>
                  <div style={{fontSize:'.67rem',color:'var(--muted)',marginTop:2}}>{fBRL(c.valor)}{dtStr?` · ${dtStr}`:''}</div>
                </div>
                {i<(e.chests.length-1)&&<div style={{height:1,background:'rgba(0,0,0,.06)'}}/>}
              </React.Fragment>
            );
          })}
          <div style={{borderTop:'2px solid rgba(0,0,0,.06)',padding:'10px 0'+(showPay?'':' 12px')}}>
            <div style={{fontSize:'.61rem',fontWeight:900,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.08em',marginBottom:5}}>{'📊 Subtotal '}{name}</div>
            <div style={{display:'flex',flexDirection:'column',gap:3,paddingLeft:4}}>
              {comTotal>0&&<div style={{fontSize:'.69rem',fontWeight:600}}>{'Comissões: '}<span style={{color:comColor,fontWeight:800}}>{fBRL(comTotal)}</span></div>}
              {spinTotal>0&&<div style={{fontSize:'.69rem',fontWeight:600}}>{'Bônus Roleta: '}<span style={{color:'#8833BB',fontWeight:800}}>{fBRL(spinTotal)}</span></div>}
              {chestTotal>0&&<div style={{fontSize:'.69rem',fontWeight:600}}>{'Cofre Misterioso: '}<span style={{color:'#B8860B',fontWeight:800}}>{fBRL(chestTotal)}</span></div>}
              <div style={{fontSize:'.75rem',fontWeight:900,marginTop:2}}>{'TOTAL: '}<span style={{color:comColor}}>{fBRL(e.sub)}</span></div>
            </div>
          </div>
        </div>
        {showPay&&isSeek&&onPayAllForSeek&&<button style={{width:'100%',padding:'11px 0',background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',border:'none',borderRadius:'0 0 12px 12px',boxShadow:'2px 4px 12px rgba(29,122,58,.35)',fontFamily:'inherit',fontWeight:900,fontSize:'.8rem',cursor:'pointer'}} onClick={()=>onPayAllForSeek(e.m.id)}>{'PAGAR TUDO — '}{name}</button>}
        {showPay&&!isSeek&&onPayAllForJr&&<button style={{width:'100%',padding:'11px 0',background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',border:'none',borderRadius:'0 0 12px 12px',boxShadow:'2px 4px 12px rgba(29,122,58,.35)',fontFamily:'inherit',fontWeight:900,fontSize:'.8rem',cursor:'pointer'}} onClick={()=>onPayAllForJr(e.jr.id)}>{'PAGAR TUDO — '}{name}</button>}
      </div>
    );
  }

  return(
    <>
      <TopBar title={paid?'Comissões Pagas':'A Pagar'} left={<button className="icon-btn" onClick={onBack}><IcLeft s={18}/></button>}/>
      <div className="page">
        {entries.length===0&&<Empty text={paid?'Nenhuma comissão paga.':'Tudo em dia!'}/>}
        {entries.map(e=><EntryCard key={e.type==='seek'?'seek_'+e.m.id:'jr_'+e.jr.id} e={e}/>)}
        {entries.length>0&&<div style={{padding:'14px 16px',background:'var(--black)',borderRadius:14,color:'#fff',display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:4}}>
          <span style={{fontSize:'.7rem',fontWeight:800,letterSpacing:'.06em',textTransform:'uppercase',opacity:.75}}>{paid?'Total Pago':'💰 Total Geral a Pagar'}</span>
          <span style={{fontWeight:900,fontSize:'.95rem'}}>{fBRL(total)}</span>
        </div>}
      </div>
    </>
  );
}

/* ══════════════════════════════════════════════════════════════════
   VENDEDOR PANEL (ADM role — dados filtrados por adm_id)
══════════════════════════════════════════════════════════════════ */
function VendedorPanel({adm,members,referrals,jrReferrals,seekJrs,credentials,offers,passReqs,levelNotifs,onLogout,onAddMember,onUpdateMember,onDeleteMember,onUpdatePin,onAddReferral,onUpdateReferral,onTogglePaid,onDeleteReferral,onAddSeekJr,onDeleteSeekJr,onAddJrReferral,onToggleJrPaid,onDeleteJrReferral,onAddOffer,onDeleteOffer,onMarkRead,spinRewards,chestRewards=[],onMarkSold,onUpdateJrReferral,onToggleSpinPaid,onPayAllForSeek,onPayAllForJr}){
  const [view,setView]=useState('dashboard');
  const [selMember,setSelMember]=useState(null);
  const [editRefDirect,setEditRefDirect]=useState(null);
  const [showOffers,setShowOffers]=useState(false);
  const [showExtrato,setShowExtrato]=useState(false);
  const [showBell,setShowBell]=useState(false);
  const [showHelp,setShowHelp]=useState(false);
  const now=new Date();
  const [sm,setSm]=useState(now.getMonth()+1);
  const [sy,setSy]=useState(now.getFullYear());

  const pendReqs=(passReqs||[]).filter(r=>!r.resolved);
  const newRefs=[...referrals,...jrReferrals].filter(r=>r.isNew);
  const newJrs=seekJrs.filter(j=>j.isNew);
  const badge=pendReqs.length+newRefs.length+newJrs.length;
  const allRefs=[...referrals,...jrReferrals];
  const curMember=selMember?members.find(m=>sameId(m.id,selMember.id))??selMember:null;
  const inSubView=['memberDetail','pending','paid','editRef'].includes(view);

  function nav(dest,payload){if(dest==='editRef'){setEditRefDirect(payload);setView('editRef');}else setView(dest);}
  function updateRef(rid,data,isJr){return isJr?onUpdateJrReferral(rid,data):onUpdateReferral(rid,data);}

  return(
    <div style={{background:'var(--bg)',minHeight:'100vh',maxWidth:640,margin:'0 auto',position:'relative'}}>
      <>
        <TopBar logo="SEEK NETWORK" right={
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <button style={{position:'relative'}} className="icon-btn" onClick={()=>setShowBell(true)}>
              {badge>0&&<span style={{position:'absolute',top:-4,right:-4,background:'var(--red)',color:'#fff',fontSize:'.5rem',fontWeight:900,borderRadius:99,padding:'1px 4px'}}>{badge}</span>}
              <IcBell s={18} c="var(--muted)"/>
            </button>
            <button className="icon-btn" style={{fontSize:'.9rem'}} onClick={()=>setShowHelp(true)}>❓</button>
            <button className="icon-btn" onClick={onLogout}><IcOut s={17} c="var(--muted)"/></button>
          </div>
        }/>
        <div style={{padding:'4px 16px 8px',textAlign:'center'}}>
          <span style={{fontSize:'0.55rem',fontWeight:900,color:'var(--black)',letterSpacing:'.02em'}}>{adm.name}</span>
        </div>
      </>

      {view==='dashboard'&&<AdmDashboard members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} sm={sm} setSm={setSm} sy={sy} setSy={setSy} onNav={nav} passReqs={passReqs} credentials={credentials} onDeleteRef={onDeleteReferral} onDeleteJrRef={onDeleteJrReferral} spinRewards={spinRewards} chestRewards={chestRewards} showPaymentReminder={true}/>}
      {view==='members'&&<AdmMembers members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onSelect={m=>{setSelMember(m);setView('memberDetail');}} onAdd={d=>onAddMember(d,adm.id)} onDelete={onDeleteMember} onUpdatePin={onUpdatePin} onDeleteJr={onDeleteSeekJr}/>}
      {view==='memberDetail'&&curMember&&<AdmMemberDetail member={curMember} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onBack={()=>{setSelMember(null);setView('members');}} onUpdateReferral={onUpdateReferral} onTogglePaid={onTogglePaid} onDeleteReferral={onDeleteReferral} onDeleteMember={id=>{onDeleteMember(id);setSelMember(null);setView('members');}} onUpdateMember={onUpdateMember} onUpdatePin={onUpdatePin} spinRewards={spinRewards} chestRewards={chestRewards} onToggleSpinPaid={onToggleSpinPaid}/>}
      {view==='pending'&&<LedgerPorSeek members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} paid={false} onBack={()=>setView('dashboard')} onPayAllForSeek={onPayAllForSeek} onPayAllForJr={onPayAllForJr}/>}
      {view==='paid'&&<LedgerPorSeek members={members} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} paid={true} onBack={()=>setView('dashboard')}/>}
      {view==='editRef'&&editRefDirect&&(()=>{const _jr=editRefDirect.jrId?seekJrs.find(j=>sameId(j.id,editRefDirect.jrId)):null;const _m=(editRefDirect.memberId?members.find(m=>sameId(m.id,editRefDirect.memberId)):_jr?members.find(m=>sameId(m.id,_jr.seekId)):null)||{id:0,name:'?'};return<AdmMemberDetail member={_m} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onBack={()=>{setEditRefDirect(null);setView('dashboard');}} onUpdateReferral={onUpdateReferral} onTogglePaid={onTogglePaid} onDeleteReferral={onDeleteReferral} onDeleteMember={onDeleteMember} onUpdateMember={onUpdateMember} onUpdatePin={onUpdatePin} spinRewards={spinRewards} chestRewards={chestRewards} onToggleSpinPaid={onToggleSpinPaid}/>;})()}
      {view==='remuneracao'&&<RemuneracaoPanel isMaster={false} isAdm={true}/>}
      {view==='fipe'&&<FipeConsulta/>}
      {view==='financiamento'&&<SimuladorFinanciamento/>}

      {!inSubView&&view!=='fipe'&&view!=='financiamento'&&(
        <div style={{position:'fixed',bottom:74,left:'50%',transform:'translateX(-50%)',width:'calc(100% - 32px)',maxWidth:576,zIndex:19,padding:0}}>
          <button className="btn btn-dark btn-full" style={{padding:14}} onClick={()=>setShowExtrato(true)}>📋 Extrato</button>
        </div>
      )}
      {!inSubView&&<AdmTabBar view={view} setView={v=>{setView(v);setSelMember(null);}} onOffers={()=>setShowOffers(true)}/>}
      {showBell&&<VendedorBellPanel members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} passReqs={passReqs} onClose={()=>setShowBell(false)} onMarkRead={onMarkRead} onMarkSold={onMarkSold} onUpdateRef={updateRef} onTogglePaid={onTogglePaid} onToggleJrPaid={onToggleJrPaid}/>}
      {showOffers&&<OffersPanel offers={offers} onClose={()=>setShowOffers(false)} isAdm={false} onAddOffer={()=>{}} onDeleteOffer={()=>{}}/>}
      {showExtrato&&<ExtratoModal role="adm" data={{adm,members,referrals,jrReferrals,seekJrs,spinRewards}} onClose={()=>setShowExtrato(false)}/>}
      {showHelp&&<HelpModal role="adm" onClose={()=>setShowHelp(false)}/>}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   EXTRATO MODAL — relatório completo para WhatsApp / Impressão
══════════════════════════════════════════════════════════════════ */
function ExtratoModal({role,data,onClose,isAdm,onTogglePaid}){
  const now=new Date();
  const dateStr=`${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')}/${now.getFullYear()}`;

  function buildText(){
    if(role==='master'){
      const {adms,members,referrals,jrReferrals,seekJrs,spinRewards=[]}=data;
      const allRefs=[...referrals,...jrReferrals];
      const totVol=allRefs.reduce((s,r)=>s+r.productValue,0);
      const totCom=allRefs.reduce((s,r)=>s+r.commission,0);
      const pago=allRefs.filter(r=>r.paid).reduce((s,r)=>s+r.commission,0);
      const apagar=allRefs.filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0);
      const admRank=adms.map(adm=>{
        const mids=members.filter(m=>sameId(m.admId,adm.id)).map(m=>String(m.id));
        const jids=seekJrs.filter(j=>mids.some(id=>sameId(j.seekId,id))).map(j=>String(j.id));
        const vol=[...referrals.filter(r=>mids.some(id=>sameId(r.memberId,id))),...jrReferrals.filter(r=>jids.some(id=>sameId(r.jrId,id)))].reduce((s,r)=>s+r.productValue,0);
        return{name:adm.name,vol,seeks:mids.length};
      }).sort((a,b)=>b.vol-a.vol);
      return [
        `*SEEK NETWORK — EXTRATO MASTER*`,`Data: ${dateStr}`,``,

        `📊 CONSOLIDADO GERAL`,
        `Vendedores: ${adms.length}  |  SEEKs: ${members.length}  |  JRs: ${seekJrs.length}`,
        `Total Indicações: ${allRefs.length}`,``,
        `💰 COMISSÕES`,
        `Volume Total: ${fBRL(totVol)}`,
        `Comissão Total: ${fBRL(totCom)}`,
        `Pago: ${fBRL(pago)}  |  A Pagar: ${fBRL(apagar)}`,
        `Comissão Master (0,5%): ${fBRL(totVol*0.005)}`,
        spinRewards.length>0?`🎰 Bônus Roleta Total - ${fBRL(spinRewards.reduce((s,r)=>s+r.value,0))}`:'',``,
        `🏆 RANKING VENDEDORES`,
        ...admRank.map((a,i)=>`${i+1}. ${a.name} — ${fBRL(a.vol)} (${a.seeks} SEEK${a.seeks!==1?'s':''})`),
      ].join('\n');
    }
    if(role==='adm'){
      const {adm,members,referrals,jrReferrals,seekJrs,spinRewards=[]}=data;
      const allRefs=[...referrals,...jrReferrals];
      const totCom=allRefs.reduce((s,r)=>s+r.commission,0);
      const bonusRTotal=spinRewards.reduce((s,r)=>s+r.value,0);
      const totalGeral=totCom+bonusRTotal;
      const SEP='━━━━━━━━━━━━━━━━━━━━━━━━━';
      function refLine(r){
        const spin=spinRewards.find(s=>sameId(s.referralId,r.id));
        const spinV=spin?spin.value:0;
        const total=r.commission+spinV;
        const st=r.paid?'Pago':'A Pagar';
        let line=`  Cliente: ${r.clientName} | Comissão: ${fBRL(r.commission)}`;
        if(spinV>0)line+=` | Roleta: ${fBRL(spinV)}`;
        line+=` | Total: ${fBRL(total)} | ${st}`;
        return line;
      }
      const seekLines=[];
      members.forEach(m=>{
        const mRefs=referrals.filter(r=>sameId(r.memberId,m.id)&&(r.paid||r.status==='a_pagar'||r.productValue>0));
        const mJrs=seekJrs.filter(j=>sameId(j.seekId,m.id));
        const mJrRefs=jrReferrals.filter(r=>mJrs.some(j=>sameId(j.id,r.jrId))&&(r.paid||r.status==='a_pagar'||r.productValue>0));
        if(mRefs.length===0&&mJrRefs.length===0)return;
        seekLines.push(``,`${SEP}`,`👤 ${m.name}`,`${SEP}`);
        mRefs.forEach(r=>seekLines.push(refLine(r)));
        const mSpin=spinRewards.filter(s=>sameId(s.seekId,m.id)).reduce((s,r)=>s+r.value,0);
        const mSub=mRefs.reduce((s,r)=>s+r.commission,0)+mSpin;
        if(mRefs.length>0)seekLines.push(`  Subtotal SEEK: ${fBRL(mSub)}`);
        mJrs.forEach(jr=>{
          const jRefs=jrReferrals.filter(r=>sameId(r.jrId,jr.id)&&(r.paid||r.status==='a_pagar'||r.productValue>0));
          if(jRefs.length===0)return;
          seekLines.push(``,`👤 ${jr.name} — JR de ${m.name}`);
          jRefs.forEach(r=>seekLines.push(refLine(r)));
          const jSpin=spinRewards.filter(s=>sameId(s.jrId,jr.id)).reduce((s,r)=>s+r.value,0);
          const jSub=jRefs.reduce((s,r)=>s+r.commission,0)+jSpin;
          seekLines.push(`  Subtotal SEEK JR: ${fBRL(jSub)}`);
        });
      });
      const myComm=admComm(allRefs);
      return [
        `*SEEK NETWORK — EXTRATO VENDEDOR*`,
        `${adm.name}  |  Data: ${dateStr}`,``,
        `📊 RESUMO`,
        `SEEKs: ${members.length}  |  JRs: ${seekJrs.length}  |  Indicações: ${allRefs.length}`,
        `💼 Minha Comissão (vendedor): ${fBRL(myComm)}`,
        ...seekLines,
        ``,SEP,
        `TOTAL GERAL SEEK: ${fBRL(totalGeral)}`,
      ].join('\n');
    }
    if(role==='member'){
      const {member,referrals,jrReferrals,seekJrs,spinRewards=[],chestRewards=[]}=data;
      const totVol=referrals.reduce((s,r)=>s+r.productValue,0);
      const pts=calcPoints(totVol);
      const lv=getSeekLevel(pts);
      const bonusR=spinRewards.reduce((s,r)=>s+r.value,0);
      const bonusRUnpaid=spinRewards.filter(r=>!r.paid).reduce((s,r)=>s+r.value,0);
      const chestTotal=(chestRewards||[]).reduce((s,c)=>s+c.valor,0);
      const chestUnpaid=(chestRewards||[]).filter(c=>!c.paid).reduce((s,c)=>s+c.valor,0);
      const apagar=referrals.filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0)+bonusRUnpaid+chestUnpaid;
      const nextLv=lv.id==='elite'?null:SEEK_LEVELS[SEEK_LEVELS.findIndex(l=>l.id===lv.id)+1];
      const myJrs=seekJrs.filter(j=>sameId(j.seekId,member.id));
      const SEP='─────────────────────────';
      const confRefs=referrals.filter(r=>r.paid||r.status==='a_pagar'||r.productValue>0);
      const refLines=[];
      confRefs.forEach((r,i)=>{
        const spin=spinRewards.find(s=>sameId(s.referralId,r.id));
        const spinV=spin?spin.value:0;
        const total=r.commission+spinV;
        const st=r.paid?'Pago':'A Pagar';
        refLines.push(`👤 ${r.clientName}`);
        refLines.push(`   Comissão: ${fBRL(r.commission)}`);
        if(spinV>0)refLines.push(`   🎰 Bônus Roleta: ${fBRL(spinV)}`);
        refLines.push(`   Total: ${fBRL(total)}`);
        refLines.push(`   Status: ${st}`);
        if(i<confRefs.length-1)refLines.push(SEP);
      });
      const chestLines=(chestRewards||[]).map(c=>`🎁 Cofre Misterioso — ${fBRL(c.valor)} | ${c.paid?'Pago':'A Pagar'}`);
      const totalGeral=referrals.reduce((s,r)=>s+r.commission,0)+bonusR+chestTotal;
      return [
        `*SEEK NETWORK — EXTRATO SEEK*`,
        `${member.name}  |  #${String(member.id).padStart(3,'0')}`,
        `Data: ${dateStr}`,``,
        `🎖️ NÍVEL: ${lv.name.toUpperCase()}`,
        `Pontos: ${pts} pts  |  Bônus: +${(lv.bonus*100).toFixed(0)}%`,
        nextLv?`Próximo nível: ${nextLv.name} (faltam ${nextLv.min-pts} pts)`:`✅ Nível Máximo!`,``,
        `💰 A Pagar: ${fBRL(apagar)}`,``,
        confRefs.length>0?`📋 INDICAÇÕES (${confRefs.length})`:null,
        confRefs.length>0?SEP:null,
        ...refLines,
        confRefs.length>0?SEP:null,
        chestLines.length>0?``:null,
        chestLines.length>0?`🎁 COFRES MISTERIOSOS (${chestLines.length})`:null,
        ...chestLines,
        ``,
        `TOTAL GERAL: ${fBRL(totalGeral)}`,
        myJrs.length>0?`\n👥 SEEK JRs (${myJrs.length})`:null,
        ...myJrs.map(jr=>{
          const jrVol=jrReferrals.filter(r=>sameId(r.jrId,jr.id)).reduce((s,r)=>s+r.productValue,0);
          return`• ${jr.name} — ${fBRL(jrVol)}`;
        }),
      ].filter(l=>l!=null).join('\n');
    }
    if(role==='jr'){
      const {jr,referrals,seekMember,spinRewards=[],chestRewards=[]}=data;
      const totVol=referrals.reduce((s,r)=>s+r.productValue,0);
      const bonusR=spinRewards.reduce((s,r)=>s+r.value,0);
      const bonusRUnpaid=spinRewards.filter(r=>!r.paid).reduce((s,r)=>s+r.value,0);
      const chestTotal=(chestRewards||[]).reduce((s,c)=>s+c.valor,0);
      const chestUnpaid=(chestRewards||[]).filter(c=>!c.paid).reduce((s,c)=>s+c.valor,0);
      const apagar=referrals.filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0)+bonusRUnpaid+chestUnpaid;
      const jrLv=getJrLevel(totVol);
      const gradPct=Math.min(100,(totVol/JR_GRADUATION)*100).toFixed(1);
      const SEP='─────────────────────────';
      const confRefs=referrals.filter(r=>r.paid||r.status==='a_pagar'||r.productValue>0);
      const refLines=[];
      confRefs.forEach((r,i)=>{
        const spin=spinRewards.find(s=>sameId(s.referralId,r.id));
        const spinV=spin?spin.value:0;
        const total=r.commission+spinV;
        const st=r.paid?'Pago':'A Pagar';
        refLines.push(`👤 ${r.clientName}`);
        refLines.push(`   Comissão: ${fBRL(r.commission)}`);
        if(spinV>0)refLines.push(`   🎰 Bônus Roleta: ${fBRL(spinV)}`);
        refLines.push(`   Total: ${fBRL(total)}`);
        refLines.push(`   Status: ${st}`);
        if(i<confRefs.length-1)refLines.push(SEP);
      });
      const chestLines=(chestRewards||[]).map(c=>`🎁 Cofre Misterioso — ${fBRL(c.valor)} | ${c.paid?'Pago':'A Pagar'}`);
      const totalGeral=referrals.reduce((s,r)=>s+r.commission,0)+bonusR+chestTotal;
      return [
        `*SEEK NETWORK — EXTRATO SEEK JR*`,
        `${jr.name}  |  ID: ${jr.id}JR`,
        `Data: ${dateStr}`,``,
        seekMember?`👤 Padrinho SEEK: ${seekMember.name}`:null,
        ``,
        `📊 DESEMPENHO`,
        `Nível JR: ${jrLv.name}  |  Bônus para SEEK: ${(jrLv.bonus*100).toFixed(0)}%`,
        `Progresso para SEEK: ${gradPct}% de ${fBRL(JR_GRADUATION)}`,``,
        `💰 A Pagar: ${fBRL(apagar)}`,``,
        confRefs.length>0?`📋 INDICAÇÕES (${confRefs.length})`:null,
        confRefs.length>0?SEP:null,
        ...refLines,
        confRefs.length>0?SEP:null,
        chestLines.length>0?``:null,
        chestLines.length>0?`🎁 COFRES MISTERIOSOS (${chestLines.length})`:null,
        ...chestLines,
        ``,
        `TOTAL GERAL: ${fBRL(totalGeral)}`,
      ].filter(l=>l!=null).join('\n');
    }
    return '';
  }

  const text=buildText();

  function sendWhatsApp(){
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
  }
  function handlePrint(){
    const div=document.createElement('div');
    div.className='print-only';
    div.style.cssText='font-family:monospace;white-space:pre-wrap;font-size:13px;padding:28px;color:#111;line-height:1.8;';
    div.textContent=text;
    document.body.appendChild(div);
    window.print();
    document.body.removeChild(div);
  }

  return(
    <div className="overlay" onClick={onClose}>

function Confetti(){

    delay:Math.random()*.8,
    duration:1.4+Math.random()*.8,
    size:5+Math.random()*9,

  return(
    <div style={{position:'fixed',inset:0,pointerEvents:'none',overflow:'hidden',zIndex:10001}}>
      {pieces.map(p=>(
        <div key={p.id} style={{
          position:'absolute',top:-20,left:`${p.left}%`,

          background:p.color,
          borderRadius:p.isCircle?'50%':2,
          animation:`confetti-fall ${p.duration}s ${p.delay}s ease-in forwards`,
        }}/>
      ))}
    </div>
  );
}

    let r=Math.random(),cum=0;
    for(const p of CHEST_PRIZES){cum+=p.prob;if(r<cum)return p.value;}
    return CHEST_PRIZES[CHEST_PRIZES.length-1].value;
  }

  function playFanfare(){
    try{
      const ctx=new(window.AudioContext||window.webkitAudioContext)();
      [523,659,784,1047,1319,1568].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.value=f;
        const s=ctx.currentTime+i*0.1;
        g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.35,s+.05);
        g.gain.exponentialRampToValueAtTime(.001,s+.85);
        o.start(s);o.stop(s+.95);
      });
      [784,1047,784,1319].forEach((f,i)=>{
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='triangle';o.frequency.value=f;
