/* Compare any two ids (number or string) safely. This is the single source
   of truth for id comparisons across the whole app — never compare ids with
   === directly, since localStorage / form values can silently change a
   number into a string (or vice-versa) depending on which code path wrote
   the data. */
function sameId(a,b){
  if(a===undefined||a===null||b===undefined||b===null)return false;
  return String(a)===String(b);
}

function inMonth(iso,month,year){
  if(!iso)return false;
  const d=new Date(iso);
  return d.getMonth()+1===month&&d.getFullYear()===year;
}

  const bonus=(spins||[]).filter(isSpinBonus);
  const debit=(spins||[]).filter(isSpinDebit);
  return{bonus,debit,bonusSum:bonus.reduce((s,x)=>s+x.value,0),debitSum:debit.reduce((s,x)=>s+x.value,0)};
}

/* ── DESAFIO DO MÊS ──────────────────────────────────────────────────────
   Recorrente e configurável pelo Vendedor (ver monthly_challenge_config).
   Nada aqui é persistido separadamente: meta batida, indicações do grupo e
   bônus de cada venda são sempre CALCULADOS a partir de referrals/jr_referrals
   + da config vigente do mês — a mesma estratégia já usada para o Cofre
   Misterioso, para nunca dessincronizar do estado real das vendas. */
function getChallengeConfig(configs,year,month){
  return(configs||[]).find(c=>c.year===year&&c.month===month)||null;
}
/* 3 faixas fixas: 1ª venda, 2ª venda, e a meta inteira (N/N) — os percentuais
   são configuráveis, mas as contagens de faixa sempre acompanham a meta N. */
function challengeTiers(cfg){
  if(!cfg)return[];
  return[{count:1,pct:cfg.pct1},{count:2,pct:cfg.pct2},{count:cfg.targetN,pct:cfg.pct3}];
}
/* Não cumulativo: aplica sempre a taxa da MAIOR faixa já atingida. */
function challengeTierPct(cfg,convertedCount){
  if(!cfg||convertedCount<=0)return 0;
  const hit=challengeTiers(cfg).filter(t=>t.count<=convertedCount);
  return hit.length?Math.max(...hit.map(t=>t.pct)):0;
}
function isReferralConverted(r){return!!(r.paid||r.status==='a_pagar'||r.productValue>0);}
/* As N primeiras indicações do mês de vigência da config (por data de
   criação) — indicações extras além da meta não entram no desafio. */
function challengeGroup(ownerRefs,cfg){
  if(!cfg)return[];
  return ownerRefs
    .filter(r=>r.year===cfg.year&&r.month===cfg.month)
    .slice()
    .sort((a,b)=>new Date(a.createdAt||0)-new Date(b.createdAt||0))
    .slice(0,cfg.targetN);
}
/* Bônus (em R$) do desafio para UMA indicação específica, dado o conjunto de
   indicações do mesmo dono (seek ou jr) e a config vigente. */
function challengeBonusForRef(ref,ownerRefs,cfg){
  if(!cfg||!cfg.active)return{applies:false,pct:0,amount:0};
  const group=challengeGroup(ownerRefs,cfg);
  if(!group.some(g=>sameId(g.id,ref.id))||!isReferralConverted(ref))return{applies:false,pct:0,amount:0};
  const pct=challengeTierPct(cfg,group.filter(isReferralConverted).length);
  return{applies:pct>0,pct,amount:pct>0?ref.commission*pct/100:0};
}
/* Progresso agregado do dono no mês corrente — usado no banner. */
function challengeProgress(ownerRefs,cfg){
  if(!cfg)return null;
  const group=challengeGroup(ownerRefs,cfg);
  const convertedCount=group.filter(isReferralConverted).length;
  return{targetN:cfg.targetN,groupCount:group.length,convertedCount,pct:challengeTierPct(cfg,convertedCount)};
}
/* Todos os bônus de desafio já ganhos pelo dono, em QUALQUER mês (cada mês
   usa a config vigente naquele mês, respeitando o histórico) — usado no
   Extrato e no A Receber/A Pagar, que precisam olhar para trás no tempo. */
function allChallengeBonuses(ownerRefs,configs){
  const months=new Set((ownerRefs||[]).map(r=>`${r.year}-${r.month}`));
  const results=[];
  months.forEach(key=>{
    const[y,m]=key.split('-').map(Number);
    const cfg=getChallengeConfig(configs,y,m);
    if(!cfg||!cfg.active)return;
    challengeGroup(ownerRefs,cfg).forEach(ref=>{
      const{applies,pct,amount}=challengeBonusForRef(ref,ownerRefs,cfg);
      if(applies)results.push({ref,pct,amount});
    });
  });
  return results;
}

/* ── LEGACY STORAGE CLEANUP ────────────────────────────────────────────────
   Earlier versions of this app used different localStorage key names for
   the same data (sk_m, sk_c, sk_creds, sk_r, sk_n, sk_jr, sk_jrs, sk_reqs,
   sk_pass_requests). The current version only ever reads/writes the
   canonical keys in SK below.

   IMPORTANT: this function only DELETES those old keys — it never merges
   their contents back into the canonical storage. An earlier version of
   this cleanup used to merge legacy data back in on every app load, which
   caused a serious bug: any record a user deleted could reappear, because
   a stray copy left under an old key name kept getting re-merged in every
   single time the app started. Deleting (and never reading) the legacy
   keys is the correct, permanent fix — once they're gone, this function
   has nothing left to do on every subsequent boot.
─────────────────────────────────────────────────────────────────────────── */
function cleanupLegacyStorageKeys(){
  const legacyKeys=['sk_m','sk_c','sk_creds','sk_r','sk_n','sk_jr','sk_jrs','sk_reqs','sk_pass_requests'];
  let removed=[];
  legacyKeys.forEach(k=>{
    if(localStorage.getItem(k)!==null){
      localStorage.removeItem(k);
      removed.push(k);
    }
  });
  if(removed.length){
    console.log('[SEEK cleanup] removed obsolete legacy keys (data was NOT merged back, by design):',removed);
  }
}
const fBRL=v=>Number.isFinite(v)?v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'R$ 0,00';
const fCD=n=>n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function fDate(r){if(r.day)return`${String(r.day).padStart(2,'0')}/${String(r.month).padStart(2,'0')}/${r.year}`;return`${MONTHS[(r.month||1)-1].slice(0,3)}/${r.year}`;}
function todayISO(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

/* Phone format: (DD)XXXXX-XXXX — DDD in parens, no space */
function maskPhone(raw){
  const d=(raw||'').replace(/\D/g,'').slice(0,11);
  if(!d)return'';
  if(d.length<=2)return`(${d}`;
  if(d.length<=6)return`(${d.slice(0,2)})${d.slice(2)}`;
  if(d.length<=10)return`(${d.slice(0,2)})${d.slice(2,6)}-${d.slice(6)}`;
  return`(${d.slice(0,2)})${d.slice(2,7)}-${d.slice(7)}`;
}

function calcPoints(total){return Math.floor(total/100000);}
function getSeekLevel(pts){return SEEK_LEVELS.find(l=>pts>=l.min&&pts<=l.max)||SEEK_LEVELS[0];}
function getJrLevel(vol){return JR_LEVELS.find(l=>vol>=l.min&&vol<l.max)||JR_LEVELS[0];}
function levelProgress(totalSales){
  const pts=calcPoints(totalSales);
  const lv=getSeekLevel(pts);
  if(lv.id==='elite')return 100;
  const fracPts=totalSales/100000;
  return Math.min(100,Math.max(0,Math.round(((fracPts-lv.min)/(lv.max-lv.min+1))*100)));
}
function calcCommission(val,prodId,level){
  const pt=PRODUCT_TYPES.find(p=>p.id===prodId)||PRODUCT_TYPES[0];
  return val*pt.rate*(1+level.bonus);
}

/* PlainPhoneInput — a true digits-only phone field with NO masking at all.
   Used everywhere a phone number is captured for login purposes (SEEK and
   SEEK JR registration), so the format is byte-for-byte identical to what
   the unified login screen accepts: just numbers, no parentheses, no
   dashes, no spaces. This removes any possibility of the registration and
   login forms disagreeing about how a phone number is represented. */
function PlainPhoneInput({value,onChange,autoFocus}){

/* ══════════════════════════════════════════════════════════════════
   LOGIN SCREEN — single unified login
══════════════════════════════════════════════════════════════════ */
function LoginScreen({onLogin,credentials,members,seekJrs}){
  const [phone,setPhone]=useState('');
  const [pass,setPass]=useState('');
  const [err,setErr]=useState('');
  const [showPass,setShowPass]=useState(false);
  const [solicitarSenha,setSolicitarSenha]=useState(false);
  const [solPhone,setSolPhone]=useState('');
  const [solErr,setSolErr]=useState('');
  const [solOk,setSolOk]=useState(false);

  function handleSubmit(e){
    e.preventDefault();setErr('');
    const digits=phone.replace(/\D/g,'');
    const pin=pass.trim();
    console.log(`[SEEK login] attempt — phoneDigits="${digits}" pinLength=${pin.length}`);
    if(!digits||!pin){setErr('Preencha telefone e senha.');console.log('[SEEK login] aborted: empty phone or pin');return;}

    // 1) MASTER — hardcoded constant, independent of any stored data.
    if(digits===ADM_PHONE&&pin===ADM_PIN){
      console.log('[SEEK login] matched MASTER');
      onLogin({role:'master'});return;
    }

    // 1.5) ADM vendedores
    for(const [k,c] of Object.entries(credentials)){
      if(!String(k).startsWith('adm_'))continue;
      const stored=(c.login||'').replace(/\D/g,'');
      if(stored===digits&&c.pin===pin){const admId=k.replace('adm_','');onLogin({role:'adm',admId});return;}
    }

    // 2) SEEK
    for(const [k,c] of Object.entries(credentials)){
      if(String(k).startsWith('jr_')||String(k).startsWith('adm_'))continue;
      const stored=(c.login||'').replace(/\D/g,'');
      if(stored===digits&&c.pin===pin){onLogin({role:'member',memberId:k});return;}
    }
    for(const mb of members){
      const wa=(mb.whatsapp||'').replace(/\D/g,'');
      if(wa!==digits)continue;
      const cred=credentials[String(mb.id)]||{pin:'0000'};
      if(cred.pin===pin){onLogin({role:'member',memberId:String(mb.id)});return;}
    }
    // 3) JR
    for(const [k,c] of Object.entries(credentials)){
      if(!String(k).startsWith('jr_'))continue;
      const stored=(c.login||'').replace(/\D/g,'');
      if(stored===digits&&c.pin===pin){const jrId=k.replace('jr_','');onLogin({role:'jr',jrId});return;}
    }
    for(const jr of seekJrs){
      const wa=(jr.whatsapp||'').replace(/\D/g,'');
      if(wa!==digits)continue;
      const cred=credentials[`jr_${jr.id}`]||{pin:'0000'};
      if(cred.pin===pin){onLogin({role:'jr',jrId:jr.id});return;}
    }
    setErr('Telefone ou senha incorretos.');
  }

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:'32px 22px'}}>
      <div style={{width:'100%',maxWidth:480,display:'flex',flexDirection:'column',alignItems:'center',gap:26}}>

        <SeekNetworkLogo/>

        <div style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',gap:26}}>
        {/* Login form — single unified entry, phone digits only, no mode tabs.
            The system figures out automatically whether the phone+pin belongs
            to the ADM, a SEEK, or a SEEK JR. */}
        <form onSubmit={handleSubmit} style={{width:'100%',display:'flex',flexDirection:'column',gap:13}}>
          <input className="login-inp" type="tel" inputMode="numeric"
            value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,'').slice(0,11))}
            placeholder="TELEFONE (SOMENTE NÚMEROS)" autoFocus/>
          <div style={{position:'relative'}}>
            <input className="login-inp" type={showPass?'text':'password'}
              value={pass} onChange={e=>setPass(e.target.value.replace(/\D/g,'').slice(0,4))}
              placeholder="SENHA (4 DÍGITOS)" inputMode="numeric" maxLength={4}
              style={{paddingRight:52}}/>
            <button type="button" onClick={()=>setShowPass(!showPass)}
              style={{position:'absolute',right:18,top:'50%',transform:'translateY(-50%)',
                      background:'none',border:'none',cursor:'pointer',color:'var(--muted)'}}>
              {showPass?<IcEyeOff s={17}/>:<IcEye s={17}/>}
            </button>
          </div>
          {err&&<p style={{textAlign:'center',fontSize:'.76rem',fontWeight:700,color:'var(--red)',padding:'4px 8px',borderRadius:10,background:'rgba(192,57,43,0.07)'}}>{err}</p>}
          <button type="submit" className="btn btn-dark btn-full"
            style={{padding:16,fontSize:'.84rem',letterSpacing:'.1em',borderRadius:50,marginTop:4}}>
            Entrar
          </button>
        </form>

        <div style={{textAlign:'center',display:'flex',flexDirection:'column',gap:10}}>
          <button onClick={()=>{setSolicitarSenha(true);setSolPhone('');setSolErr('');setSolOk(false);}} style={{background:'none',border:'none',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--muted)',fontFamily:'inherit',textDecoration:'underline',textUnderlineOffset:3}}>
            Esqueceu sua senha?
          </button>
        </div>
        </div>
      </div>

      {solicitarSenha&&(
        <div className="overlay" onClick={()=>setSolicitarSenha(false)}>
          <div className="sheet" onClick={e=>e.stopPropagation()}>
            <div className="handle"/>
            <div style={{fontWeight:900,fontSize:'1rem',marginBottom:16}}>🔐 Solicitar Nova Senha</div>
            {solOk?(
              <div style={{textAlign:'center',padding:'24px 0'}}>
                <div style={{fontSize:'2rem',marginBottom:12}}>✅</div>
                <div style={{fontWeight:700,fontSize:'.9rem',marginBottom:8}}>Solicitação enviada!</div>
                <div style={{fontSize:'.8rem',color:'var(--muted)',marginBottom:20}}>O administrador foi notificado e vai liberar seu novo acesso em breve.</div>
                <button className="btn btn-dark btn-full" onClick={()=>setSolicitarSenha(false)}>Fechar</button>
              </div>
            ):(
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                <p style={{fontSize:'.84rem',color:'var(--muted)',lineHeight:1.6}}>Digite seu telefone cadastrado (somente números). O administrador receberá a solicitação e liberará seu novo acesso.</p>
                <input className="inp" type="tel" inputMode="numeric"
                  value={solPhone} onChange={e=>setSolPhone(e.target.value.replace(/\D/g,'').slice(0,11))}
                  placeholder="TELEFONE (SOMENTE NÚMEROS)" autoFocus/>
                {solErr&&<div style={{color:'var(--red)',fontSize:'.76rem',fontWeight:700}}>{solErr}</div>}
                <div style={{display:'flex',gap:10}}>
                  <button className="btn btn-full" onClick={()=>setSolicitarSenha(false)}>Cancelar</button>
                  <button className="btn btn-dark btn-full" onClick={()=>{
                    const d=solPhone.replace(/\D/g,'');
                    if(!d){setSolErr('Digite seu telefone.');return;}
                    // Save request to localStorage
                    db.from('pass_requests').insert({phone:d,type:'forgot',resolved:false})
                      .then(({error})=>{
                        if(error){setSolErr('Erro ao enviar. Tente novamente.');}
                        else{setSolOk(true);}
                      });
                  }}>Solicitar</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}


/* ══════════════════════════════════════════════════════════════════
   FIRST LOGIN — TROCA DE SENHA OBRIGATÓRIA
══════════════════════════════════════════════════════════════════ */
function FirstLoginScreen({userName,onSave,onLogout}){
  const [pin1,setPin1]=useState('');
  const [pin2,setPin2]=useState('');
  const [err,setErr]=useState('');
  const [saved,setSaved]=useState(false);

  function submit(e){
    e.preventDefault();setErr('');
    if(!/^\d{4}$/.test(pin1)){setErr('A nova senha deve ter exatamente 4 dígitos numéricos.');return;}
    if(pin1!==pin2){setErr('As senhas não coincidem. Digite novamente.');return;}
    if(pin1==='0000'){setErr('Escolha uma senha diferente de 0000.');return;}
    onSave(pin1);
    setSaved(true);
  }

  if(saved){
    return(
      <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:32}}>
        <div style={{textAlign:'center',display:'flex',flexDirection:'column',alignItems:'center',gap:20}}>
          <div style={{fontSize:'3rem'}}>✅</div>
          <div style={{fontWeight:800,fontSize:'1.1rem'}}>Senha alterada com sucesso!</div>
          <div style={{fontSize:'.84rem',color:'var(--muted)',fontWeight:600}}>Entrando no painel...</div>
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'center',padding:'32px 22px'}}>
      <div style={{width:'100%',maxWidth:380,display:'flex',flexDirection:'column',gap:24}}>
        <SeekNetworkLogo/>
        <div className="nm" style={{padding:'28px 22px'}}>
          <div style={{textAlign:'center',marginBottom:22}}>
            <div style={{fontSize:'2rem',marginBottom:10}}>🔐</div>
            <div style={{fontWeight:900,fontSize:'1.05rem',marginBottom:8}}>Primeiro acesso</div>
            <div style={{fontSize:'.83rem',color:'var(--muted)',lineHeight:1.65}}>
              Olá{userName?`, ${userName}`:''}.{' '}
              Por segurança, você precisa criar uma senha pessoal antes de continuar.<br/>
              <strong>A senha deve ter 4 dígitos numéricos</strong> e não pode ser 0000.
            </div>
          </div>
          <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:14}}>
            <Fld label="Nova senha (4 dígitos)">
              <PinInput value={pin1} onChange={setPin1} autoFocus/>
            </Fld>
            <Fld label="Confirmar nova senha">
              <PinInput value={pin2} onChange={setPin2}/>
            </Fld>
            {err&&<div style={{color:'var(--red)',fontSize:'.78rem',fontWeight:700,textAlign:'center',padding:'8px 12px',borderRadius:10,background:'rgba(192,57,43,0.07)'}}>{err}</div>}
            <button type="submit" className="btn btn-dark btn-full" style={{padding:15,marginTop:4,fontSize:'.86rem',letterSpacing:'.06em'}}>
              Salvar e Entrar
            </button>
          </form>
        </div>
        <button onClick={onLogout} style={{background:'none',border:'none',cursor:'pointer',fontSize:'.76rem',fontWeight:700,color:'var(--muted)',fontFamily:'inherit',textDecoration:'underline',textUnderlineOffset:3,textAlign:'center'}}>
          Voltar ao login
        </button>
      </div>
    </div>
  );
}

            pct={lvPct}
            className={level.progressClass}
            label={`${points} pts · ${level.name} — ${lvPct}% do nível`}
            sub={nextLevel?`${nextLevel.min-points} pts para ${nextLevel.name}`:'Nível Máximo!'}
          />
        </div>

        {/* Period filter */}
        <div style={{display:'flex',gap:10,marginBottom:14}}>
          <select className="inp" style={{flex:1}} value={sm} onChange={e=>setSm(Number(e.target.value))}>{MONTHS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select>
          <select className="inp" style={{width:90}} value={sy} onChange={e=>setSy(Number(e.target.value))}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        </div>

        {/* Per-product breakdown */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:'.6rem',fontWeight:800,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--muted)',marginBottom:10}}>Indicações por Produto — {MONTHS[sm-1]} {sy}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:8}}>
            {prodBreakdown.map(p=>(
              <div key={p.id} className="nm-in" style={{padding:'10px 8px',textAlign:'center'}}>
                <div style={{fontSize:'1.1rem',marginBottom:4}}>{p.icon}</div>
                <div style={{fontSize:'.58rem',fontWeight:800,textTransform:'uppercase',color:'var(--muted)',marginBottom:5}}>{p.name.replace('Empresariais','Empresar.')}</div>
                <div style={{fontWeight:900,fontSize:'1rem',color:'var(--black)'}}>{p.count}</div>
                <div style={{fontSize:'.64rem',color:'var(--muted)',marginTop:2}}>{fBRL(p.volume)}</div>
                <div style={{fontSize:'.66rem',color:'var(--green)',fontWeight:800,marginTop:1}}>{fBRL(p.commission)}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Commission summary */}
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {[['Comissão Total',fBRL(monthCom),'var(--green)'],['Bônus JR',fBRL(jrBonus),'var(--green)'],['A Receber',fBRL(monthComDue+bonusRoletaPendente+chestPendente+challengeBonusPendenteMonth),'var(--red)'],['Recebido',fBRL(monthComPaid),'var(--green)']].map(([l,v,c])=>(
            l==='A Receber'
              ?<button key={l} className="nm-in" style={{padding:'12px 14px',textAlign:'left',border:'none',cursor:'pointer',background:'var(--bg)'}} onClick={()=>setShowAPagar(true)}><div className="section-title" style={{marginBottom:6}}>{l}{' ▸'}</div><div style={{fontWeight:800,fontSize:'.9rem',color:'var(--red)'}}>{v}</div></button>
              :<div key={l} className="nm-in" style={{padding:'12px 14px'}}><div className="section-title" style={{marginBottom:6}}>{l}</div><div style={{fontWeight:800,fontSize:'.9rem',color:c}}>{v}</div></div>
          ))}
        </div>
        {bonusRoletaPendente!==0&&<button className="nm-in" style={{padding:'12px 14px',marginTop:10,width:'100%',textAlign:'left',border:'none',cursor:'pointer',background:'var(--bg)'}} onClick={()=>setShowBonusRoleta(true)}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:'.72rem',fontWeight:800,color:bonusRoletaPendente>0?'#8833BB':'var(--red)'}}>{bonusRoletaPendente>0?'🎰 Bônus Roleta ▸':'🎲 Débito Roleta ▸'}</div>
            <div style={{fontWeight:900,fontSize:'.92rem',color:'var(--red)'}}>{(bonusRoletaPendente>0?'+ ':'')+fBRL(bonusRoletaPendente)}</div>
          </div>
          <div style={{fontSize:'.6rem',color:'var(--muted)',fontWeight:600,marginTop:4}}>{'Pendente · Incluído no total A Receber'}</div>
        </button>}
        {chestPendente>0&&<button className="nm-in" style={{padding:'12px 14px',marginTop:4,width:'100%',textAlign:'left',border:'none',cursor:'pointer',background:'var(--bg)'}} onClick={()=>setShowCofres(true)}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <div style={{fontSize:'.72rem',fontWeight:800,color:'#B8860B'}}>{'🎁 Cofre Misterioso ▸'}</div>
            <div style={{fontWeight:900,fontSize:'.92rem',color:'var(--red)'}}>{'+ '+fBRL(chestPendente)}</div>
          </div>
          <div style={{fontSize:'.6rem',color:'var(--muted)',fontWeight:600,marginTop:4}}>{'Pendente · Incluído no total A Receber'}</div>
        </button>}
      </div>

      <ChallengeBanner ownerRefs={myRefs} configs={challengeConfigs}/>

      {/* Medals showcase */}
      <MedalsShowcase points={points}/>

      {/* Big green opportunity button */}
      <button className="btn-green-opp" onClick={()=>setShowAdd(true)}>
        <IcPlus s={22} c="#fff"/>
        Encontrei uma Oportunidade
      </button>

      {/* Actions */}
      <button className="btn btn-dark btn-full" style={{padding:14,marginTop:4}} onClick={()=>setShowAddJr(true)}>
        <IcPlus s={18} c="#fff"/>Cadastrar SEEK JR
      </button>
      <button className="btn btn-green btn-full" style={{padding:14,gap:8,fontSize:'.86rem'}} onClick={shareCard}>📲 Compartilhar Cartão</button>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <button className="btn" style={{padding:12}} onClick={()=>{setShowPin(true);setOldPin('');setNewPin('');setCfPin('');setPinErr('')}}><IcKey s={14}/>Senha</button>
        <button className="btn" style={{padding:12}} onClick={()=>setShowRegras(true)}>📋 Regras</button>
      </div>
      <button className="btn btn-full" style={{padding:12}} onClick={()=>setShowMemberOffers(true)}>🏷️ Ofertas</button>
      <button className="btn btn-full" style={{padding:12}} onClick={()=>setShowMinigame(true)}>🫧 Minigame</button>

      {/* My JRs */}
      {myJrs.length>0&&<div>
        <div style={{fontSize:'.62rem',fontWeight:800,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--muted)',paddingLeft:4,marginBottom:10}}>Meus SEEK JR ({myJrs.length})</div>
        <div className="nm" style={{padding:'6px 16px'}}>
          {myJrs.map((jr,i)=>{
            const jrTotal=myJrRefs.filter(r=>sameId(r.jrId,jr.id)).reduce((s,r)=>s+r.productValue,0);
            const jrMonthRefs=myJrRefs.filter(r=>sameId(r.jrId,jr.id)&&r.month===sm&&r.year===sy);
            const jrMonthCom=jrMonthRefs.reduce((s,r)=>s+r.commission,0);
            const jrLv=getJrLevel(jrTotal);
            return<div key={jr.id}><div style={{padding:'12px 0'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:5}}>
                <div>
                  <div style={{fontWeight:700,fontSize:'.86rem'}}>{jr.name}</div>
                  <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600,marginTop:2}}>ID: {jr.id}JR · {jrLv.name}</div>
                </div>
                <span className="tag-jr">JR</span>
              </div>
              <div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:6}}>Mês: {fBRL(jrMonthRefs.reduce((s,r)=>s+r.productValue,0))} · Total: {fBRL(jrTotal)}</div>
              <div style={{fontSize:'.7rem',color:'var(--green)',fontWeight:700,marginBottom:8}}>Bônus meu: {fBRL(jrMonthCom*jrLv.bonus)} ({(jrLv.bonus*100).toFixed(0)}%)</div>
              <ProgressBar pct={Math.min(100,(jrTotal/JR_GRADUATION)*100)} className="progress-jr"
                label="JR → SEEK" sub={fBRL(jrTotal)+'/'+fBRL(JR_GRADUATION)}/>
            </div>{i<myJrs.length-1&&<Div/>}</div>;
          })}
        </div>
      </div>}

      {/* My referrals */}
      <div style={{fontSize:'.62rem',fontWeight:800,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--muted)',paddingLeft:4}}>{MONTHS[sm-1]} {sy} — Indicações</div>
      <div className="nm" style={{padding:'6px 16px'}}>
        {sorted.length===0?<Empty text="Nenhuma indicação no período"/>:sorted.map((r,i,arr)=>(
          <div key={r.id}><div style={{padding:'13px 0'}}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
              <div style={{fontWeight:700,fontSize:'.87rem'}}>{r.clientName}</div>
              <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600}}>{fDate(r)}</div>
            </div>
            {r.whatsapp&&<div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:4,display:'flex',alignItems:'center',gap:5}}><IcWA s={13} fill="#25D366"/>{maskPhone(r.whatsapp)}</div>}
            {r.status==='aguardando'
              ?<div style={{fontSize:'.72rem',color:'var(--yellow)',marginBottom:6,fontWeight:700}}>⏳ Aguardando confirmação do vendedor</div>
              :<div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:6}}>{PRODUCT_TYPES.find(p=>p.id===r.productType)?.icon} {PRODUCT_TYPES.find(p=>p.id===r.productType)?.name} · {fBRL(r.productValue)}</div>
            }
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              {r.status!=='aguardando'&&<div style={{fontWeight:800,color:r.paid?'var(--green)':'var(--red)'}}>{fBRL(r.commission)}</div>}
              <span style={{fontSize:'.7rem',fontWeight:700,padding:'4px 10px',borderRadius:50,background:'var(--bg)',boxShadow:'var(--nm-out)',color:r.status==='aguardando'?'var(--yellow)':r.status==='pago'||r.paid?'var(--green)':'var(--red)',marginLeft:'auto'}}>
                {r.status==='aguardando'?'Aguardando':r.status==='pago'||r.paid?'Pago':'A Pagar'}
              </span>
            </div>
          </div>{i<arr.length-1&&<Div/>}</div>
        ))}
      </div>
      <button className="btn btn-dark btn-full" style={{padding:14,marginTop:12}} onClick={()=>setShowExtrato(true)}>📋 Extrato</button>
    </div>

    {showMemberOffers&&<OffersPanel offers={offers||[]} onClose={()=>setShowMemberOffers(false)} isAdm={false} onAddOffer={()=>{}} onDeleteOffer={()=>{}}/>}
    {showExtrato&&<ExtratoModal role="member" data={{member,referrals:referrals.filter(r=>sameId(r.memberId,member.id)),jrReferrals,seekJrs,spinRewards:(spinRewards||[]).filter(s=>sameId(s.seekId,member.id)),chestRewards:myChests,challengeConfigs}} onClose={()=>setShowExtrato(false)}/>}
    {showAPagar&&<APagarModal commissions={referrals.filter(r=>sameId(r.memberId,member.id)&&!r.paid&&(r.status==='a_pagar'||r.productValue>0))} spinItems={(spinRewards||[]).filter(s=>sameId(s.seekId,member.id)&&!s.paid)} chestItems={myChests.filter(c=>!c.paid)} challengeItems={challengeItemsUnpaid} allRefs={referrals.filter(r=>sameId(r.memberId,member.id))} onClose={()=>setShowAPagar(false)}/>}
    {showCofres&&<CofresModal chestItems={myChests} onClose={()=>setShowCofres(false)}/>}
    {showBonusRoleta&&<BonusRoletaModal spinItems={(spinRewards||[]).filter(s=>sameId(s.seekId,member.id))} allRefs={referrals.filter(r=>sameId(r.memberId,member.id))} onClose={()=>setShowBonusRoleta(false)}/>}
    {showMinigame&&<MinigameModal seekId={member.id} jrId={null} scoreRow={(minigameScores||[]).find(s=>sameId(s.seekId,member.id))} onSaveScore={onSaveMinigameScore} onClose={()=>setShowMinigame(false)}/>}
    {showAdd&&<Sheet title="Encontrei uma Oportunidade" onClose={()=>setShowAdd(false)}><LeadForm onCancel={()=>setShowAdd(false)} onSave={d=>{onAddReferral(d);setShowAdd(false);}}/></Sheet>}
    {showAddJr&&<Sheet title="Cadastrar SEEK JR" onClose={()=>setShowAddJr(false)}><JrForm onClose={()=>setShowAddJr(false)} onSave={onAddJr}/></Sheet>}
    {showPin&&<Sheet title="Alterar Senha" onClose={()=>setShowPin(false)}>
      <form onSubmit={changePin} style={{display:'flex',flexDirection:'column',gap:18}}>
        <Fld label="Senha Atual"><PinInput value={oldPin} onChange={setOldPin} autoFocus/></Fld>
        <Fld label="Nova Senha"><PinInput value={newPin} onChange={setNewPin}/></Fld>
        <Fld label="Confirmar"><PinInput value={cfPin} onChange={setCfPin}/></Fld>
        {pinErr&&<div style={{color:'var(--red)',fontSize:'.78rem',fontWeight:700}}>{pinErr}</div>}
        <div style={{display:'flex',gap:12}}><button type="button" className="btn btn-full" onClick={()=>setShowPin(false)}>Cancelar</button><button type="submit" className="btn btn-dark btn-full">Salvar</button></div>
      </form>
    </Sheet>}
    {showRegras&&<div style={{position:'fixed',inset:0,zIndex:200,background:'var(--bg)',overflowY:'auto'}}><RemuneracaoPanel onBack={()=>setShowRegras(false)}/></div>}
    {showHelp&&<HelpModal role="member" onClose={()=>setShowHelp(false)}/>}
  </div>;
}

/* ══════════════════════════════════════════════════════════════════
   ADM — DASHBOARD
══════════════════════════════════════════════════════════════════ */
function AdmDashboard({members,referrals,jrReferrals,seekJrs,sm,setSm,sy,setSy,onNav,passReqs,credentials,onDeleteRef,onDeleteJrRef,spinRewards,chestRewards=[],challengeConfigs=[],showPaymentReminder,hideAdmCommission}){
  const curY=new Date().getFullYear();
  const years=Array.from({length:5},(_,i)=>curY-2+i);
  const fil=referrals.filter(r=>r.month===sm&&r.year===sy);
  const jrFil=jrReferrals.filter(r=>r.month===sm&&r.year===sy);
  const totV=([...fil,...jrFil]).reduce((s,r)=>s+r.productValue,0);
  const _mIds=new Set((members||[]).map(m=>String(m.id)));
  const _jrIds=new Set((seekJrs||[]).map(j=>String(j.id)));
  const _scSpins=(spinRewards||[]).filter(s=>((s.seekId&&_mIds.has(s.seekId))||(s.jrId&&_jrIds.has(s.jrId)))&&inMonth(s.createdAt,sm,sy));
  const _scChests=(chestRewards||[]).filter(c=>((c.seekId&&_mIds.has(c.seekId))||(c.jrId&&_jrIds.has(c.jrId)))&&inMonth(c.createdAt,sm,sy));
  const spinAP=_scSpins.filter(s=>!s.paid).reduce((s,r)=>s+r.value,0);
  const chestAP=_scChests.filter(c=>!c.paid).reduce((s,c)=>s+c.valor,0);
  /* challengeGroup ranqueia "as N primeiras do mês" por dono — nunca somar a lista de vários
     SEEKs/JRs misturada, senão a ordenação/corte em N fica errada entre donos diferentes. */
  const challengeAP=members.reduce((sum,m)=>sum+allChallengeBonuses(fil.filter(r=>sameId(r.memberId,m.id)),challengeConfigs).filter(c=>!c.ref.paid).reduce((s,c)=>s+c.amount,0),0)
    +seekJrs.reduce((sum,jr)=>sum+allChallengeBonuses(jrFil.filter(r=>sameId(r.jrId,jr.id)),challengeConfigs).filter(c=>!c.ref.paid).reduce((s,c)=>s+c.amount,0),0);
  const comAP=([...fil,...jrFil]).filter(r=>!r.paid).reduce((s,r)=>s+r.commission,0)+spinAP+chestAP+challengeAP;
  const pendReqs=(passReqs||[]).filter(r=>!r.resolved);
  const newSeekRefs=referrals.filter(r=>r.isNew);
  const newJrRefs=jrReferrals.filter(r=>r.isNew);
  const newJrs=seekJrs.filter(j=>j.isNew);
  const allTotV=[...referrals,...jrReferrals].reduce((s,r)=>s+r.productValue,0);

  const [expandedRef,setExpandedRef]=useState(null);

  const rankMap={};
  fil.forEach(r=>{rankMap[r.memberId]=(rankMap[r.memberId]||0)+r.commission;});
  const ranking=Object.entries(rankMap).map(([mid,t])=>({member:members.find(m=>String(m.id)===mid),total:Number(t)})).filter(x=>x.member).sort((a,b)=>b.total-a.total);

  function RefNotifCard({r,isJr}){
    const seek=isJr?seekJrs.find(j=>sameId(j.id,r.jrId)):members.find(m=>sameId(m.id,r.memberId));
    const seekParent=isJr&&seek?members.find(m=>sameId(m.id,seek.seekId)):null;
    const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
    const digits=(r.whatsapp||'').replace(/\D/g,'');
    const phone=digits?(digits.startsWith('55')&&digits.length>=12?digits:`55${digits}`):'';
    const isExpanded=expandedRef===r.id;
    return(
      <div style={{cursor:'pointer'}} onClick={()=>setExpandedRef(isExpanded?null:r.id)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,paddingTop:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:900,fontSize:'1rem',color:'var(--green)',marginBottom:3}}>{r.clientName||'Novo cliente'}</div>
            <div style={{fontSize:'.7rem',color:'var(--muted)',fontWeight:600,display:'flex',flexWrap:'wrap',gap:4,alignItems:'center'}}>
              {isJr&&<span className="tag-jr">JR</span>}
              {isJr&&seek&&<span>{seek.name}</span>}
              {isJr&&seekParent&&<><span style={{opacity:.5}}>→</span><span>SEEK: {seekParent.name}</span></>}
              {!isJr&&seek&&<span>SEEK: {seek.name}</span>}
            </div>
          </div>
          <div style={{flexShrink:0,display:'flex',gap:6,alignItems:'center'}}>
            {!r.paid&&<button className="btn" style={{padding:'5px 10px',fontSize:'.7rem',color:'var(--red)'}} onClick={e=>{e.stopPropagation();if(window.confirm(`Apagar indicação de "${r.clientName}"?`)){isJr?onDeleteJrRef(r.id):onDeleteRef(r.id);}}}><IcTrash s={13}/>Apagar</button>}
            <span style={{fontSize:'.7rem',color:'var(--muted)'}}>▾</span>
          </div>
        </div>
        {isExpanded&&(
          <div style={{marginTop:10,padding:'12px 14px',borderRadius:14,background:'var(--bg)',boxShadow:'var(--nm-in)',display:'flex',flexDirection:'column',gap:8}}>
            <div style={{fontSize:'.74rem',fontWeight:700,display:'flex',gap:6,alignItems:'center'}}>{pt.icon} {pt.name} · {fBRL(r.productValue)}</div>
            <div style={{fontSize:'.74rem',fontWeight:800,color:r.paid?'var(--green)':'var(--red)'}}>Comissão: {fBRL(r.commission)}</div>
            {r.whatsapp&&<div style={{fontSize:'.74rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:6}}><IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}</div>}
            <div style={{fontSize:'.7rem',color:'var(--muted)'}}>{fDate(r)}</div>
            <div style={{display:'flex',gap:8,marginTop:4,flexWrap:'wrap'}}>
              {phone&&<a href={`https://wa.me/${phone}`} target="_blank" style={{textDecoration:'none'}}>
                <button className="btn" style={{padding:'8px 14px',fontSize:'.76rem',gap:6,color:'#25D366'}}><IcWA s={15} fill="#25D366"/>WhatsApp</button>
              </a>}
              <button className="btn" style={{padding:'8px 14px',fontSize:'.76rem',color:'var(--yellow)'}} onClick={e=>{e.stopPropagation();onNav('editRef',r);}}><IcEdit s={13}/>Editar</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div className="page" style={{paddingBottom:110}}>

      {showPaymentReminder&&<div className="nm-in" style={{padding:'10px 14px',display:'flex',alignItems:'center',gap:10,borderLeft:'3px solid var(--green)'}}>
        <span style={{fontSize:'1.2rem'}}>📅</span>
        <div style={{flex:1,fontSize:'.72rem',color:'var(--muted)',fontWeight:600,lineHeight:1.5}}>Todo dia 10 verifique as vendas do mês e marque como Pago</div>
      </div>}

      {/* Pass requests */}
      {pendReqs.length>0&&<div className="nm" style={{padding:'18px',border:'1.5px solid rgba(192,57,43,.3)'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}>
          <div style={{width:9,height:9,borderRadius:'50%',background:'var(--red)',animation:'pulse 1.4s ease-in-out infinite'}}/>
          <div style={{fontWeight:800,fontSize:'.86rem',color:'var(--red)'}}>Solicitações de Senha ({pendReqs.length})</div>
        </div>
        {pendReqs.map((req,i,arr)=>{
          const m=members.find(x=>sameId(x.id,req.memberId));
          const c=credentials[req.memberId]||{};
          return<div key={req.id}><div style={{padding:'8px 0'}}>
            <div style={{fontWeight:700,fontSize:'.86rem',marginBottom:4}}>{m?m.name:`#${req.memberId}`}</div>
            <div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:8}}>{maskPhone(c.login)} · Senha atual: {c.pin}</div>
          </div>{i<arr.length-1&&<Div/>}</div>;
        })}
      </div>}

      {/* Notifications: see bell button */}

      {/* Period selector */}
      <div className="nm" style={{padding:'14px 16px'}}>
        <div style={{display:'flex',gap:10}}>
          <select className="inp" style={{flex:1}} value={sm} onChange={e=>setSm(Number(e.target.value))}>{MONTHS.map((m,i)=><option key={m} value={i+1}>{m}</option>)}</select>
          <select className="inp" style={{width:90}} value={sy} onChange={e=>setSy(Number(e.target.value))}>{years.map(y=><option key={y} value={y}>{y}</option>)}</select>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <StatCard label="Qtde Vendas" value={fil.length+jrFil.length}/>
        <StatCard label="Valor Total" value={fBRL(totV)}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <StatCard label="A Pagar" value={fBRL(comAP)} color="var(--red)"/>
        {[['A Pagar',[...fil,...jrFil].filter(r=>!r.paid&&(r.status==='a_pagar'||r.productValue>0)).length,'var(--red)','pending',IcClock]].map(([l,v,c,dest,Ico])=>(
          <button key={l} className="nm" style={{padding:'16px 14px',textAlign:'left',border:'none',cursor:'pointer',background:'var(--bg)'}} onClick={()=>onNav(dest)}>
            <div className="section-title" style={{marginBottom:8,display:'flex',alignItems:'center',gap:4}}><Ico s={11} c={c}/>{l}</div>
            <div className="stat-n" style={{fontSize:'1.1rem',color:c}}>{v}</div>
          </button>
        ))}
      </div>
      <button className="nm" style={{padding:'14px 16px',border:'none',cursor:'pointer',background:'var(--bg)',display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%',textAlign:'left'}} onClick={()=>onNav('prevPending')}>
        <span style={{fontWeight:700,fontSize:'.82rem'}}>{'📅 Pagamento Mês Anterior'}</span>
        <span style={{color:'var(--muted)',fontSize:'.76rem',fontWeight:700}}>{'Ver ▸'}</span>
      </button>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>

/* Fully controlled "Editar Membro" form. The previous version mixed
   uncontrolled inputs (defaultValue + FormData) with a masked PhoneInput
   that had a no-op onChange, so editing the phone silently did nothing.
   This version controls every field explicitly and saves the phone as
   digits-only via PlainPhoneInput, matching the login format exactly. */
function EditMemberForm({member,onClose,onSave}){
  const [name,setName]=useState(member.name||'');
  const [wa,setWa]=useState((member.whatsapp||'').replace(/\D/g,''));
  const [pix,setPix]=useState(member.pixKey||'');
  const [notes,setNotes]=useState(member.notes||'');
  function submit(e){
    e.preventDefault();
    if(!name.trim())return;
    onSave({name:name.trim().toUpperCase(),whatsapp:wa,pixKey:pix.trim().toUpperCase(),notes:notes.trim().toUpperCase()});
  }
  return(
    <Sheet title="Editar Membro" onClose={onClose}>
      <form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:14}}>
        <Fld label="Nome"><input className="inp" value={name} onChange={e=>setName(e.target.value.toUpperCase())} autoFocus autoCapitalize="characters" style={{textTransform:'uppercase'}}/></Fld>
        <Fld label="Telefone (Login — somente números)"><PlainPhoneInput value={wa} onChange={setWa}/></Fld>
        <Fld label="PIX"><input className="inp" value={pix} onChange={e=>setPix(e.target.value.toUpperCase())} autoCapitalize="characters" style={{textTransform:'uppercase'}}/></Fld>
        <Fld label="Notas"><textarea className="inp" value={notes} onChange={e=>setNotes(e.target.value.toUpperCase())} rows={2} autoCapitalize="characters" style={{resize:'vertical',textTransform:'uppercase'}}/></Fld>
        <div style={{display:'flex',gap:12}}><button type="button" className="btn btn-full" onClick={onClose}>Cancelar</button><button type="submit" className="btn btn-dark btn-full">Salvar</button></div>
      </form>
    </Sheet>
  );
}

          <button className="icon-btn" style={{width:30,height:30,borderRadius:9}} onClick={()=>{setShowCreds(true);setNewPin('');setPinErr('');}}><IcKey s={13}/></button>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginTop:4}}>
          <div className="nm-in" style={{padding:'10px 8px',textAlign:'center',gridColumn:'span 2'}}>
            <div style={{fontSize:'.52rem',fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)',marginBottom:4}}>Total Gerado</div>
            <div style={{fontWeight:800,fontSize:'.76rem',color:'var(--black)'}}>{fBRL(totC)}</div>
          </div>
          {[
            ['Com. A Pagar',fBRL(comAP),'var(--red)'],
            ['🎰 Roleta Pend.',fBRL(memberUnpaidSpin),'var(--red)'],
            ['🎁 Cofre Pend.',fBRL(memberUnpaidChest),'var(--red)'],
            ['🏆 Desafio Pend.',fBRL(memberChallengeUnpaid),'var(--red)'],
          ].map(([l,v,c])=>(
            <div key={l} className="nm-in" style={{padding:'10px 8px',textAlign:'center'}}>
              <div style={{fontSize:'.52rem',fontWeight:800,letterSpacing:'.08em',textTransform:'uppercase',color:'var(--muted)',marginBottom:4}}>{l}</div>
              <div style={{fontWeight:800,fontSize:'.76rem',color:c}}>{v}</div>
            </div>
          ))}
        </div>
      </div>
      {onAddReferral&&<button className="btn btn-dark btn-full" style={{padding:14}} onClick={()=>setShowAdd(true)}><IcPlus s={16} c="#fff"/>Cadastrar Indicação</button>}
      {(()=>{
        const confirmedRefs=myRefs.filter(r=>r.paid||r.status==='a_pagar'||r.productValue>0);
        const waitingRefs=myRefs.filter(r=>!r.paid&&r.status==='aguardando'&&!r.productValue);
        return<>
          {confirmedRefs.length>0&&<>
            <div className="section-title" style={{paddingLeft:4}}>Indicações</div>
            <div className="nm" style={{padding:'4px 16px'}}>
              {confirmedRefs.map((r,i)=>{
                const digits=(r.whatsapp||'').replace(/\D/g,'');
                const phone=digits?(digits.startsWith('55')&&digits.length>=12?digits:`55${digits}`):'';
                const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
                const{bonusSum:linkedBonus,debitSum:linkedDebit}=splitSpins((spinRewards||[]).filter(s=>sameId(s.referralId,r.id)));
                const linkedChallenge=challengeItems.find(c=>sameId(c.ref.id,r.id));
                return<div key={r.id}><div style={{padding:'12px 0'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <div style={{fontWeight:700,fontSize:'.86rem'}}>{r.clientName}</div>
                    <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600}}>{fDate(r)}</div>
                  </div>
                  {r.whatsapp&&<div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:4,display:'flex',alignItems:'center',gap:6}}>
                    {phone?<a href={`https://wa.me/${phone}`} target="_blank" style={{display:'flex',alignItems:'center',gap:5,color:'#25D366',textDecoration:'none'}}><IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}</a>:<span style={{display:'flex',alignItems:'center',gap:5}}><IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}</span>}
                  </div>}
                  <div style={{fontSize:'.72rem',color:'var(--muted)',marginBottom:4}}>{pt.icon} {pt.name} · {fBRL(r.productValue)}</div>
                  {linkedBonus>0&&<div style={{fontSize:'.7rem',fontWeight:700,color:'#8833BB',marginBottom:4}}>🎰 Bônus roleta: {fBRL(linkedBonus)}</div>}
                  {linkedDebit<0&&<div style={{fontSize:'.7rem',fontWeight:700,color:'var(--red)',marginBottom:4}}>🎲 Débito roleta (girar de novo): {fBRL(linkedDebit)}</div>}
                  {linkedChallenge&&<div style={{fontSize:'.7rem',fontWeight:700,color:'#B8860B',marginBottom:4}}>{`🏆 Bônus Desafio (+${linkedChallenge.pct}%): `}{fBRL(linkedChallenge.amount)}</div>}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div style={{fontWeight:800,color:r.paid?'var(--green)':'var(--red)'}}>{fBRL(r.commission)}</div>
                    <div style={{display:'flex',gap:7,alignItems:'center'}}>
                      {(r.status==='pago'||r.paid)?<span style={{fontSize:'.72rem',fontWeight:800,color:'var(--green)',display:'inline-flex',alignItems:'center',gap:4}}><IcCheck s={11}/>Pago</span>:onTogglePaid?<button className="pill" style={{background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',border:'none',boxShadow:'2px 2px 8px rgba(29,122,58,.3)'}} onClick={()=>onTogglePaid(r.id)}>PAGAR</button>:<span style={{fontSize:'.72rem',fontWeight:800,color:'var(--muted)'}}>A Pagar</span>}
                      {onUpdateReferral&&<button className="icon-btn" style={{width:28,height:28,borderRadius:9}} onClick={()=>setEditRef(r)}><IcEdit s={12}/></button>}
                      {onDeleteReferral&&<button className="icon-btn" style={{width:28,height:28,borderRadius:9}} onClick={()=>{if(window.confirm(`Apagar "${r.clientName}"?`))onDeleteReferral(r.id);}}><IcTrash s={12} c="var(--red)"/></button>}
                    </div>
                  </div>
                </div>{i<confirmedRefs.length-1&&<Div/>}</div>;
              })}
            </div>
          </>}
          {waitingRefs.length>0&&<>
            <div className="section-title" style={{paddingLeft:4,color:'var(--yellow)'}}>⏳ Aguardando confirmação</div>
            <div className="nm" style={{padding:'4px 16px'}}>
              {waitingRefs.map((r,i)=>{
                const digits=(r.whatsapp||'').replace(/\D/g,'');
                const phone=digits?(digits.startsWith('55')&&digits.length>=12?digits:`55${digits}`):'';
                return<div key={r.id}><div style={{padding:'12px 0'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <div style={{fontWeight:700,fontSize:'.86rem'}}>{r.clientName}</div>
                    <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600}}>{fDate(r)}</div>
                  </div>
                  {r.whatsapp&&<div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:6,display:'flex',alignItems:'center',gap:6}}>
                    {phone?<a href={`https://wa.me/${phone}`} target="_blank" style={{display:'flex',alignItems:'center',gap:5,color:'#25D366',textDecoration:'none'}}><IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}</a>:<span style={{display:'flex',alignItems:'center',gap:5}}><IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}</span>}
                  </div>}
                  <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <span style={{fontSize:'.72rem',fontWeight:700,color:'var(--yellow)',display:'inline-flex',alignItems:'center',gap:4}}><IcClock s={11}/>Aguardando</span>
                    <div style={{display:'flex',gap:7,alignItems:'center'}}>
                      {onUpdateReferral&&<button className="icon-btn" style={{width:28,height:28,borderRadius:9}} onClick={()=>setEditRef(r)}><IcEdit s={12}/></button>}
                      {onDeleteReferral&&<button className="icon-btn" style={{width:28,height:28,borderRadius:9}} onClick={()=>{if(window.confirm(`Apagar "${r.clientName}"?`))onDeleteReferral(r.id);}}><IcTrash s={12} c="var(--red)"/></button>}
                    </div>
                  </div>
                </div>{i<waitingRefs.length-1&&<Div/>}</div>;
              })}
            </div>
          </>}
          {confirmedRefs.length===0&&waitingRefs.length===0&&<Empty text="Nenhuma indicação"/>}
        </>;
      })()}
      <button className="btn btn-full" style={{padding:14,marginTop:4}} onClick={()=>setShowMesAnterior(true)}>📅 Meses Anteriores</button>
      <button className="btn btn-dark btn-full" style={{padding:14}} onClick={()=>setShowExtrato(true)}>📋 Extrato</button>
      <button className="btn btn-full" style={{color:'var(--red)',padding:14}} onClick={()=>setDelMember(true)}><IcTrash s={14}/>Excluir membro</button>
    </div>
    {showAdd&&<Sheet title="Cadastrar Indicação" onClose={()=>setShowAdd(false)}><LeadForm onCancel={()=>setShowAdd(false)} onSave={d=>{onAddReferral(d);setShowAdd(false);}}/></Sheet>}
    {editRef&&<Sheet title="Editar Indicação" onClose={()=>setEditRef(null)}><ReferralForm initial={editRef} onCancel={()=>setEditRef(null)} onSave={d=>{onUpdateReferral(editRef.id,d);setEditRef(null);}} label="Salvar"/></Sheet>}
    {showEdit&&<EditMemberForm member={member} onClose={()=>setShowEdit(false)} onSave={d=>{onUpdateMember(member.id,d);setShowEdit(false);}}/>}
    {showExtrato&&<ExtratoModal role="member" isAdm={true} data={{member,referrals:myRefs,jrReferrals,seekJrs,spinRewards:(spinRewards||[]).filter(s=>sameId(s.seekId,member.id)),chestRewards:(chestRewards||[]).filter(c=>sameId(c.seekId,member.id)),challengeConfigs}} onClose={()=>setShowExtrato(false)} onTogglePaid={onTogglePaid}/>}
    {showMesAnterior&&<MemberMesAnteriorModal member={member} seekJrs={seekJrs} referrals={referrals} jrReferrals={jrReferrals} spinRewards={spinRewards} chestRewards={chestRewards} challengeConfigs={challengeConfigs} onClose={()=>setShowMesAnterior(false)}/>}
    {showCreds&&(()=>{
      const phone=cred.login?(cred.login.startsWith('55')&&cred.login.length>=12?cred.login:`55${cred.login}`):'';
      function saveP(){if(!/^\d{4}$/.test(newPin)){setPinErr('Deve ter 4 dígitos.');return;}onUpdatePin(member.id,newPin);setPinErr('');setNewPin('');setShowCreds(false);}
      function sendP(){const msg=encodeURIComponent(`Olá ${member.name}! Nova senha SEEK:\nLogin: ${maskPhone(cred.login)}\nSenha: ${newPin||cred.pin}`);window.open(`https://wa.me/${phone}?text=${msg}`,'_blank');}
      return<Sheet title="Credenciais" onClose={()=>setShowCreds(false)}>
        <div style={{display:'flex',flexDirection:'column',gap:14}}>
          <div className="nm-in" style={{padding:'12px 14px'}}><div className="section-title" style={{marginBottom:3}}>Login</div><div style={{fontWeight:700}}>{maskPhone(cred.login)}</div></div>
          <div className="nm-in" style={{padding:'12px 14px'}}><div className="section-title" style={{marginBottom:3}}>Senha</div><div style={{fontWeight:900,fontSize:'1.8rem',letterSpacing:'.5em'}}>{cred.pin}</div></div>
          <Fld label="Nova senha"><PinInput value={newPin} onChange={setNewPin} autoFocus/>{pinErr&&<span style={{color:'var(--red)',fontSize:'.74rem',fontWeight:700,marginTop:4}}>{pinErr}</span>}</Fld>
          <div style={{display:'flex',gap:10}}><button className="btn btn-full" onClick={()=>setShowCreds(false)}>Fechar</button><button className="btn btn-dark btn-full" onClick={saveP}>Salvar</button></div>
          {phone&&<button className="btn btn-full" onClick={sendP} style={{gap:8}}><IcWA s={15}/>WhatsApp</button>}
        </div>
      </Sheet>;
    })()}
    {delMember&&<Confirm title="Excluir" msg={`Excluir "${member.name}" e todas as indicações?`} onCancel={()=>setDelMember(false)} onOk={()=>{onDeleteMember(member.id);setDelMember(false);}}/>}
  </>;
}

/* ══════════════════════════════════════════════════════════════════
   BELL NOTIFICATIONS PANEL
══════════════════════════════════════════════════════════════════ */
function BellPanel({members,referrals,jrReferrals,seekJrs,adms,onClose,onMarkRead,passReqs}){
  const [tab,setTab]=useState('new');
  const allRefs=[...referrals.filter(r=>r.isNew),...jrReferrals.filter(r=>r.isNew)];
  const readRefs=[...referrals.filter(r=>!r.isNew),...jrReferrals.filter(r=>!r.isNew)];
  const newJrs=seekJrs.filter(j=>j.isNew);
  const forgotReqs=(passReqs||[]).filter(r=>r.type==='forgot'&&!r.resolved);
  const unread=allRefs.length+newJrs.length+forgotReqs.length;
  const total=tab==='new'?unread:readRefs.length;
  const shownRefs=tab==='new'?allRefs:readRefs;
  const [expanded,setExpanded]=useState(null);

  function RefCard({r,isJr,idx}){
    const seek=isJr?seekJrs.find(j=>j.id===r.jrId):members.find(m=>sameId(m.id,r.memberId));
    const seekParent=isJr&&seek?members.find(m=>sameId(m.id,seek.seekId)):null;
    const admMember=isJr?seekParent:seek;
    const adm=(adms||[]).find(a=>admMember&&sameId(a.id,admMember.admId));
    const pt=PRODUCT_TYPES.find(p=>p.id===r.productType)||PRODUCT_TYPES[0];
    const digits=(r.whatsapp||'').replace(/\D/g,'');
    const phone=digits?(digits.startsWith('55')&&digits.length>=12?digits:`55${digits}`):'';
    const isExp=expanded===r.id;
    const bg=idx%2===0?'#FFFFFF':'#F4F4F4';
    return(
      <div style={{background:bg,borderRadius:12,marginBottom:4,padding:'10px 12px',cursor:'pointer'}} onClick={()=>setExpanded(isExp?null:r.id)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,marginBottom:4}}>
          <div style={{flex:1}}>
            {r.isNew&&<div style={{fontSize:'.64rem',color:'var(--green)',fontWeight:800,marginBottom:2,textTransform:'uppercase',letterSpacing:'.04em'}}>🆕 Nova indicação cadastrada</div>}
            {adm&&<div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600,marginBottom:2}}>
              💼 Vendedor: <b style={{color:'var(--black)'}}>{adm.name}</b>
            </div>}
            {isJr?(
              <div style={{display:'flex',alignItems:'baseline',gap:5,marginBottom:2}}>
                <span style={{fontWeight:900,fontSize:'.95rem'}}>{seek?seek.name:'?'}</span>
                <span style={{fontWeight:900,fontSize:'.82rem',color:'#1565C0'}}> JR</span>
              </div>
            ):(
              <div style={{fontWeight:900,fontSize:'.95rem',marginBottom:2}}>{seek?seek.name:'?'}</div>
            )}
            {isJr&&seekParent&&(
              <div style={{fontSize:'.68rem',color:'var(--muted)',fontWeight:600,marginBottom:2}}>
                Padrinho: <b style={{color:'var(--black)'}}>{seekParent.name}</b>
              </div>
            )}
            <div style={{fontWeight:700,fontSize:'.88rem',color:'var(--green)'}}>{r.clientName||'—'}</div>
            <div style={{fontSize:'.68rem',color:'var(--muted)',marginTop:2}}>{pt.icon} {pt.name} · {fDate(r)}</div>
          </div>
          <span style={{fontSize:'.7rem',color:'var(--muted)'}}>{isExp?'▴':'▾'}</span>
        </div>
        {isExp&&(
          <div style={{marginTop:8,padding:'12px',borderRadius:12,background:'rgba(0,0,0,0.04)',display:'flex',flexDirection:'column',gap:8}}>
            {r.productValue>0&&<div style={{fontSize:'.82rem',fontWeight:700}}>
              {fBRL(r.productValue)} · <span style={{color:'var(--green)'}}>{fBRL(r.commission)}</span>
            </div>}
            {r.whatsapp&&<div style={{fontSize:'.76rem',display:'flex',alignItems:'center',gap:5}}><IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}</div>}
            <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
              {phone&&<a href={`https://wa.me/${phone}`} target="_blank" style={{textDecoration:'none'}}>
                <button className="btn" style={{padding:'7px 12px',fontSize:'.75rem',gap:5,color:'#25D366'}} onClick={e=>e.stopPropagation()}>
                  <IcWA s={14} fill="#25D366"/>WhatsApp
                </button>
              </a>}
              {r.isNew&&<button className="btn" style={{padding:'7px 12px',fontSize:'.75rem',color:'var(--muted)'}}
                onClick={e=>{e.stopPropagation();onMarkRead(r.id,isJr);}}>
                ✓ Lido
              </button>}
            </div>
          </div>
        )}
      </div>
    );
  }

  return(
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()} style={{maxHeight:'88vh'}}>
        <div className="handle"/>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:16}}>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <IcBell s={18} c="var(--black)"/>
            <span style={{fontWeight:900,fontSize:'1rem'}}>Notificações</span>
            {total>0&&<span style={{background:'var(--red)',color:'#fff',fontSize:'.62rem',fontWeight:900,borderRadius:99,padding:'2px 8px'}}>{total}</span>}
          </div>
          <button className="icon-btn" onClick={onClose}><IcX s={17} c="var(--muted)"/></button>
        </div>

        <div style={{display:'flex',gap:8,marginBottom:14}}>
          <button className="btn" style={{flex:1,padding:'8px',fontSize:'.74rem',fontWeight:800,background:tab==='new'?'var(--black)':'var(--bg)',color:tab==='new'?'#fff':'var(--muted)'}} onClick={()=>setTab('new')}>🔴 Novas{unread>0?` (${unread})`:''}</button>
          <button className="btn" style={{flex:1,padding:'8px',fontSize:'.74rem',fontWeight:800,background:tab==='read'?'var(--black)':'var(--bg)',color:tab==='read'?'#fff':'var(--muted)'}} onClick={()=>setTab('read')}>✓ Lidas{readRefs.length>0?` (${readRefs.length})`:''}</button>
        </div>

        {total===0&&<Empty text={tab==='new'?'Nenhuma notificação nova':'Nenhuma notificação lida ainda'}/>}

        {/* Forgot password requests */}
        {tab==='new'&&forgotReqs.length>0&&<div style={{marginBottom:14}}>
          <div className="label" style={{marginBottom:8}}>🔐 Solicitações de Nova Senha</div>
          {forgotReqs.map((req,i)=>{
            const digits=req.phone;
            const mb=members.find(m=>(m.whatsapp||'').replace(/\D/g,'')===digits);
            const jrObj=seekJrs.find(j=>(j.whatsapp||'').replace(/\D/g,'')===digits);
            const name=mb?mb.name:jrObj?jrObj.name:`Tel: ${maskPhone(digits)}`;
            const bg=i%2===0?'#FFFFFF':'#F4F4F4';
            return<div key={req.id} style={{background:bg,borderRadius:12,padding:'10px 12px',marginBottom:4}}>
              <div style={{fontWeight:700,fontSize:'.88rem',marginBottom:4}}>{name}</div>
              <div style={{fontSize:'.7rem',color:'var(--muted)',marginBottom:8}}>{maskPhone(digits)} · Esqueceu a senha</div>
              <button className="btn btn-dark" style={{padding:'7px 14px',fontSize:'.76rem',gap:6}}
                onClick={()=>onMarkRead(req.id,'forgot')}>
                <IcCheck s={13} c="#fff"/>Resolvido
              </button>
            </div>;
          })}
        </div>}

        {/* New JRs */}
        {tab==='new'&&newJrs.length>0&&<div style={{marginBottom:14}}>
          <div className="label" style={{marginBottom:8}}>Novos SEEK JR</div>
          {newJrs.map((jr,i)=>{
            const seek=members.find(m=>sameId(m.id,jr.seekId));
            const bg=i%2===0?'#FFFFFF':'#F4F4F4';
            return<div key={jr.id} style={{background:bg,borderRadius:12,padding:'10px 12px',marginBottom:4}}>
              <div style={{display:'flex',alignItems:'baseline',gap:5,marginBottom:2}}>
                <span style={{fontWeight:900,fontSize:'.95rem'}}>{jr.name}</span>
                <span style={{fontWeight:900,fontSize:'.82rem',color:'#1565C0'}}> JR</span>
              </div>
              {seek&&<div style={{fontSize:'.68rem',color:'var(--muted)',marginBottom:2}}>Padrinho: <b style={{color:'var(--black)'}}>{seek.name}</b></div>}
              <div style={{fontSize:'.7rem',color:'var(--muted)',display:'flex',alignItems:'center',gap:5}}><IcWA s={13} fill="#25D366"/>{maskPhone(jr.whatsapp)}</div>
              <button className="btn" style={{padding:'5px 10px',fontSize:'.72rem',marginTop:8,color:'var(--muted)'}}
                onClick={()=>onMarkRead(jr.id,'jr')}>✓ Lido</button>
            </div>;
          })}
        </div>}

        {/* Referrals (novas ou lidas conforme aba) */}
        {shownRefs.length>0&&<div>
          <div className="label" style={{marginBottom:8}}>Indicações ({shownRefs.length})</div>
          {shownRefs.map((r,i)=>{
            const isJr=!!r.jrId;
            return<RefCard key={r.id} r={r} isJr={isJr} idx={i}/>;
          })}
        </div>}
      </div>
    </div>
  );
}



/* ══════════════════════════════════════════════════════════════════
   OFFERS PANEL (shared between ADM, SEEK, JR)
══════════════════════════════════════════════════════════════════ */
function OffersPanel({offers,onClose,isAdm,onAddOffer,onDeleteOffer}){
  const [showAdd,setShowAdd]=useState(false);
  const [imgUrl,setImgUrl]=useState('');
  const [caption,setCaption]=useState('');
  const [category,setCategory]=useState('zero-km');
  const [fileErr,setFileErr]=useState('');
  const [lightbox,setLightbox]=useState(null);

  function handleFile(e){
    const file=e.target.files[0];
    if(!file)return;
    if(!file.type.startsWith('image/')){setFileErr('Selecione uma imagem.');return;}
    const reader=new FileReader();
    reader.onload=ev=>{setImgUrl(ev.target.result);setFileErr('');};
    reader.readAsDataURL(file);
  }
  function saveOffer(){
    if(!imgUrl){setFileErr('Selecione uma imagem.');return;}
    onAddOffer({id:Date.now(),url:imgUrl,caption:caption.trim(),category});
    setImgUrl('');setCaption('');setCategory('zero-km');setShowAdd(false);
  }
  function shareOffer(offer){
    const msg=[
      '🔥 *Se liga nessa oferta!*',
      '',
      offer.caption?`_${offer.caption}_`:'',
      '',
      'Entre em contato com o Consultor de Vendas Volkswagen Motomecânica:',
      '',
      '👤 *Junior Soares*',
      '📱 (51) 99650-9660',
      'https://wa.me/5551996509660',
    ].filter((l,i,a)=>!(l===''&&a[i-1]==='')&&l!==undefined).join('\n');
    // Note: WhatsApp Web can't send images via URL, only text.
    // User should manually attach the photo shown on screen.
    window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
  }

  return(
    <div className="overlay" onClick={lightbox?undefined:onClose}>
      {lightbox&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.93)',zIndex:300,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:20}}
          onClick={()=>setLightbox(null)}>

function FipeConsulta(){
  const FIPE_BASE='https://parallelum.com.br/fipe/api/v1';
  const TIPOS=[{id:'carros',l:'🚗 Carro'},{id:'motos',l:'🏍️ Moto'},{id:'caminhoes',l:'🚛 Caminhão'}];
  const ERR='Não foi possível carregar os dados FIPE. Verifique sua conexão.';

  // ── Marca/Modelo ──
  const [tipo,setTipo]=React.useState(null);
  const [marcas,setMarcas]=React.useState([]);
  const [marcaTexto,setMarcaTexto]=React.useState('');
  const [marcaCodigo,setMarcaCodigo]=React.useState('');
  const [marcaAberta,setMarcaAberta]=React.useState(false);
  const [modelos,setModelos]=React.useState([]);
  const [modeloTexto,setModeloTexto]=React.useState('');
  const [modeloCodigo,setModeloCodigo]=React.useState('');
  const [modeloAberto,setModeloAberto]=React.useState(false);
  const [anos,setAnos]=React.useState([]);
  const [ano,setAno]=React.useState('');
  const [resultado,setResultado]=React.useState(null);
  const [loading,setLoading]=React.useState('');
  const [erro,setErro]=React.useState('');

  async function apiFetch(url){
    const r=await fetch(url);
    if(!r.ok)throw new Error();
    return r.json();
  }

  async function onTipo(t){
    setTipo(t);
    setMarcas([]);setMarcaTexto('');setMarcaCodigo('');setMarcaAberta(false);
    setModelos([]);setModeloTexto('');setModeloCodigo('');setModeloAberto(false);
    setAnos([]);setAno('');setResultado(null);setErro('');
    setLoading('marcas');
    try{const d=await apiFetch(`${FIPE_BASE}/${t}/marcas`);setMarcas(d);}
    catch(e){setErro(ERR);}
    finally{setLoading('');}
  }

  async function onMarcaSelect(codigo,nome){
    setMarcaTexto(nome);setMarcaCodigo(codigo);setMarcaAberta(false);
    setModelos([]);setModeloTexto('');setModeloCodigo('');setModeloAberto(false);
    setAnos([]);setAno('');setResultado(null);setErro('');
    setLoading('modelos');
    try{const d=await apiFetch(`${FIPE_BASE}/${tipo}/marcas/${codigo}/modelos`);setModelos(d.modelos||d);}
    catch(e){setErro(ERR);}
    finally{setLoading('');}
  }

  async function onModeloSelect(codigo,nome){
    setModeloTexto(nome);setModeloCodigo(codigo);setModeloAberto(false);
    setAnos([]);setAno('');setResultado(null);setErro('');
    setLoading('anos');
    try{const d=await apiFetch(`${FIPE_BASE}/${tipo}/marcas/${marcaCodigo}/modelos/${codigo}/anos`);setAnos(d);}
    catch(e){setErro(ERR);}
    finally{setLoading('');}
  }

  async function onAno(v){
    setAno(v);setResultado(null);setErro('');
    if(!v)return;
    setLoading('resultado');
    try{const d=await apiFetch(`${FIPE_BASE}/${tipo}/marcas/${marcaCodigo}/modelos/${modeloCodigo}/anos/${v}`);setResultado(d);}
    catch(e){setErro(ERR);}
    finally{setLoading('');}
  }

  function reset(){
    setTipo(null);
    setMarcas([]);setMarcaTexto('');setMarcaCodigo('');setMarcaAberta(false);
    setModelos([]);setModeloTexto('');setModeloCodigo('');setModeloAberto(false);
    setAnos([]);setAno('');setResultado(null);setErro('');
  }

  function clearMarca(){
    setMarcaTexto('');setMarcaCodigo('');setMarcaAberta(false);
    setModelos([]);setModeloTexto('');setModeloCodigo('');setModeloAberto(false);
    setAnos([]);setAno('');setResultado(null);
  }

  function clearModelo(){
    setModeloTexto('');setModeloCodigo('');setModeloAberto(false);
    setAnos([]);setAno('');setResultado(null);
  }

  const marcasFiltradas=marcaTexto
    ?marcas.filter(m=>m.nome.toLowerCase().includes(marcaTexto.toLowerCase()))
    :marcas;

  const modelosFiltrados=modeloTexto
    ?modelos.filter(m=>m.nome.toLowerCase().includes(modeloTexto.toLowerCase()))
    :modelos;

  const dropStyle={position:'absolute',top:'100%',left:0,right:0,background:'var(--card,#fff)',border:'1.5px solid var(--border,#e5e7eb)',borderRadius:10,zIndex:200,maxHeight:200,overflowY:'auto',boxShadow:'0 4px 16px rgba(0,0,0,.13)',marginTop:2};
  const dropItemStyle={padding:'10px 14px',cursor:'pointer',fontSize:'.82rem',borderBottom:'1px solid var(--border,#f3f4f6)'};
  const dropEmptyStyle={padding:'12px 14px',color:'var(--muted)',fontSize:'.78rem'};
  const clearBtnStyle={background:'none',border:'none',cursor:'pointer',fontSize:'1rem',padding:'0 4px',color:'var(--muted)',lineHeight:1,flexShrink:0};

  return(
    <div className="page" style={{paddingBottom:120}}>
      <div style={{padding:'8px 0 4px',textAlign:'center'}}>
        <span style={{fontSize:'.6rem',fontWeight:900,letterSpacing:'.14em',color:'var(--muted)',textTransform:'uppercase'}}>Tabela FIPE</span>
      </div>

      <div className="nm" style={{padding:'16px 18px',marginBottom:12}}>
        <span className="label">Tipo de Veículo</span>
        <div style={{display:'flex',gap:8}}>
          {TIPOS.map(({id,l})=>(
            <button key={id} className={`btn${tipo===id?' btn-dark':''}`} style={{flex:1,padding:'10px 4px',fontSize:'.73rem'}} onClick={()=>onTipo(id)}>{l}</button>
          ))}
        </div>
      </div>

      {tipo&&(
        <div className="nm" style={{padding:'16px 18px',marginBottom:12}}>
          <span className="label">Marca</span>
          {loading==='marcas'
            ?<div style={{color:'var(--muted)',fontSize:'.8rem',padding:'8px 0'}}>Carregando...</div>
            :<div style={{position:'relative'}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <input
                  className="inp"
                  style={{flex:1,margin:0}}
                  placeholder="Digite a marca..."
                  value={marcaTexto}
                  onChange={e=>{
                    const v=e.target.value;
                    setMarcaTexto(v);setMarcaCodigo('');
                    setMarcaAberta(true);
                    if(!v){setModelos([]);setModeloTexto('');setModeloCodigo('');setModeloAberto(false);setAnos([]);setAno('');setResultado(null);}
                  }}
                  onFocus={()=>{if(marcas.length>0)setMarcaAberta(true);}}
                  onBlur={()=>setTimeout(()=>setMarcaAberta(false),200)}
                />
                {marcaTexto&&<button style={clearBtnStyle} onClick={clearMarca}>✕</button>}
              </div>
              {marcaAberta&&(
                <div style={dropStyle}>
                  {marcasFiltradas.length===0
                    ?<div style={dropEmptyStyle}>Nenhuma marca encontrada para "{marcaTexto}"</div>
                    :marcasFiltradas.map(m=>(
                      <div key={m.codigo} style={dropItemStyle} onMouseDown={()=>onMarcaSelect(m.codigo,m.nome)}>{m.nome}</div>
                    ))
                  }
                </div>
              )}
            </div>
          }
        </div>
      )}

      {marcaCodigo&&(
        <div className="nm" style={{padding:'16px 18px',marginBottom:12}}>
          <span className="label">Modelo</span>
          {loading==='modelos'
            ?<div style={{color:'var(--muted)',fontSize:'.8rem',padding:'8px 0'}}>Carregando...</div>
            :<div style={{position:'relative'}}>
              <div style={{display:'flex',alignItems:'center',gap:6}}>
                <input
                  className="inp"
                  style={{flex:1,margin:0}}
                  placeholder="Digite o modelo..."
                  value={modeloTexto}
                  onChange={e=>{
                    const v=e.target.value;
                    setModeloTexto(v);setModeloCodigo('');
                    setModeloAberto(true);
                    if(!v){setAnos([]);setAno('');setResultado(null);}
                  }}
                  onFocus={()=>{if(modelos.length>0)setModeloAberto(true);}}
                  onBlur={()=>setTimeout(()=>setModeloAberto(false),200)}
                />
                {modeloTexto&&<button style={clearBtnStyle} onClick={clearModelo}>✕</button>}
              </div>
              {modeloAberto&&(
                <div style={dropStyle}>
                  {modelosFiltrados.length===0
                    ?<div style={dropEmptyStyle}>Nenhum modelo encontrado para "{modeloTexto}"</div>
                    :modelosFiltrados.map(m=>(
                      <div key={m.codigo} style={dropItemStyle} onMouseDown={()=>onModeloSelect(m.codigo,m.nome)}>{m.nome}</div>
                    ))
                  }
                </div>
              )}
            </div>
          }
        </div>
      )}

      {modeloCodigo&&(
        <div className="nm" style={{padding:'16px 18px',marginBottom:12}}>
          <span className="label">Ano</span>
          {loading==='anos'
            ?<div style={{color:'var(--muted)',fontSize:'.8rem',padding:'8px 0'}}>Carregando...</div>
            :<select className="inp" value={ano} onChange={e=>onAno(e.target.value)} disabled={anos.length===0}>
              <option value="">Selecione o ano</option>
              {anos.map(a=><option key={a.codigo} value={a.codigo}>{a.nome}</option>)}
            </select>
          }
        </div>
      )}

      {loading==='resultado'&&(
        <div className="nm" style={{padding:24,textAlign:'center',marginBottom:12}}>
          <div style={{color:'var(--muted)',fontSize:'.85rem'}}>Buscando dados FIPE...</div>
        </div>
      )}

      {resultado&&loading===''&&<FipeResultadoCard r={resultado} onNova={reset}/>}

      {erro&&(
        <div style={{padding:'14px 16px',color:'var(--red)',fontSize:'.8rem',fontWeight:700,background:'rgba(220,38,38,.08)',borderRadius:14,marginBottom:12}}>
          ⚠️ {erro}
        </div>
      )}
    </div>
  );
}

    setAnoSel(v);setDadosFipe(null);setErroF('');
    if(!v)return;
    setLoadingF('resultado');
    try{const d=await apiFetch(`${FIPE_BASE}/${tipo}/marcas/${marcaCodigo}/modelos/${modeloCodigo}/anos/${v}`);setDadosFipe(d);}
    catch(e){setErroF(ERR_FIPE);}
    finally{setLoadingF('');}
  }

  function irParaCalculo(){
    const pv=parseBRL(dadosFipe?.Valor||dadosFipe?.valor||'');
    setValorVeiculo(pv>0?fBRL(pv):'');
    setEntradaRS('');setEntradaPct('');setTaxa('');setResultado(null);
    setPasso('calculo');
  }

  function simOnValor(raw){
    const digits=raw.replace(/\D/g,'');
    if(!digits){setValorVeiculo('');if(parsePct(entradaPct)>0)setEntradaRS('');setResultado(null);return;}
    const pv=parseInt(digits,10)/100;
    setValorVeiculo(fBRL(pv));
    if(parsePct(entradaPct)>0)setEntradaRS(fBRL(pv*parsePct(entradaPct)/100));
    setResultado(null);
  }

  function simOnEntradaRS(raw){
    const digits=raw.replace(/\D/g,'');
    if(!digits){setEntradaRS('');setEntradaPct('');setResultado(null);return;}
    const rs=parseInt(digits,10)/100;
    setEntradaRS(fBRL(rs));
    const pv=parseBRL(valorVeiculo);
    if(pv>0)setEntradaPct((rs/pv*100).toFixed(2).replace('.',','));
    else setEntradaPct('');
    setResultado(null);
  }

  function simOnEntradaPct(raw){
    const clean=raw.replace(/[^0-9,]/g,'');
    setEntradaPct(clean);
    const pct=parsePct(clean);
    const pv=parseBRL(valorVeiculo);
    if(pv>0&&pct>0)setEntradaRS(fBRL(pv*pct/100));
    else setEntradaRS('');
    setResultado(null);
  }

  function calcular(){
    const PV=parseBRL(valorVeiculo);
    const entrada=parseBRL(entradaRS);
    const i=parsePct(taxa)/100;
    const n=parcelas;
    if(PV<=0||i<=0||n<=0||entrada<0||entrada>=PV)return;
    const financiado=PV-entrada;
    const PMT=financiado*(i*Math.pow(1+i,n))/(Math.pow(1+i,n)-1);
    const totalFinanciado=PMT*n;
    const totalPagar=totalFinanciado+entrada;
    const totalJuros=totalFinanciado-financiado;
    const entPct=PV>0?(entrada/PV*100):0;
    setResultado({PV,entrada,entPct,financiado,i,n,PMT,totalPagar,totalJuros});
  }

  function enviarWhatsApp(){
    if(!resultado)return;
    const {PV,entrada,entPct,financiado,i,n,PMT,totalPagar,totalJuros}=resultado;
    const nm=`${dadosFipe?.Marca||dadosFipe?.marca||marcaTexto} ${dadosFipe?.Modelo||dadosFipe?.modelo||modeloTexto} ${dadosFipe?.AnoModelo||dadosFipe?.anoModelo||anoSel}`.trim();
    const msg=[
      `*💰 SIMULAÇÃO DE FINANCIAMENTO*`,``,
      `🚗 *Veículo:* ${nm}`,
      `💵 *Valor do veículo:* ${fBRL(PV)}`,
      `🏦 *Entrada:* ${fBRL(entrada)} (${entPct.toFixed(1).replace('.',',')}%)`,
      `📋 *Valor financiado:* ${fBRL(financiado)}`,
      `📈 *Taxa:* ${(i*100).toFixed(2).replace('.',',')}% ao mês`,
      `📅 *Parcelas:* ${n}x de ${fBRL(PMT)}`,
      `💳 *Total a pagar:* ${fBRL(totalPagar)}`,
      `💸 *Total de juros:* ${fBRL(totalJuros)}`,
      ``,`_Simulação gerada pelo SEEK Network_`
    ].join('\n');
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  }

  function resetar(){
    setPasso('veiculo');setTipo(null);

  const simModelosFil=modeloTexto?modelos.filter(m=>m.nome.toLowerCase().includes(modeloTexto.toLowerCase())):modelos;

  const pv=parseBRL(valorVeiculo);
  const entRS=parseBRL(entradaRS);
  const tx=parsePct(taxa);

  const veicNome=`${dadosFipe?.Marca||dadosFipe?.marca||''} ${dadosFipe?.Modelo||dadosFipe?.modelo||''} ${dadosFipe?.AnoModelo||dadosFipe?.anoModelo||anoSel}`.trim();

                    {marcaTexto&&<button style={clrBtn} onClick={()=>{setMarcaTexto('');setMarcaCodigo('');setMarcaAberta(false);setModelos([]);setModeloTexto('');setModeloCodigo('');setModeloAberto(false);setAnos([]);setAnoSel('');setDadosFipe(null);}}>✕</button>}

          <button className="btn btn-full btn-dark" style={{padding:14,marginBottom:12}} onClick={calcular} disabled={calcDisabled}>

                  <div style={{display:'flex',justifyContent:'space-between'}}>
                    <span style={lbl}>Taxa</span>
                    <span style={{fontWeight:800}}>{(resultado.i*100).toFixed(2).replace('.',',')}% ao mês</span>
                  </div>
                  <div style={{height:1,background:'var(--border,#e5e7eb)',margin:'2px 0'}}/>
                  <div style={{display:'flex',justifyContent:'space-between',fontSize:'.92rem'}}>
                    <span style={lbl}>Parcelas</span>
                    <span style={{fontWeight:900,color:'var(--green)'}}>{resultado.n}x de {fBRL(resultado.PMT)}</span>
                  </div>

                    <span style={lbl}>Total a pagar</span>
                    <span style={{fontWeight:800}}>{fBRL(resultado.totalPagar)}</span>
                  </div>
                  <div style={{display:'flex',justifyContent:'space-between'}}>
                    <span style={lbl}>Total de juros</span>
                    <span style={{fontWeight:800,color:'var(--red)'}}>{fBRL(resultado.totalJuros)}</span>
                  </div>
                </div>
              </div>
              <button className="btn btn-full" style={{padding:14,marginBottom:8,background:'#25D366',color:'#fff',border:'none',borderRadius:14,fontWeight:800,fontSize:'.88rem'}} onClick={enviarWhatsApp}>

              <button className="btn btn-full" style={{padding:12,marginBottom:12}} onClick={resetar}>🔄 Nova Simulação</button>
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

                <div style={{fontSize:'.72rem',color:'var(--muted)',fontWeight:600,marginBottom:8}}>{'🎂 '}{String(day).padStart(2,'0')}{'/'}{String(month).padStart(2,'0')}</div>
                {phone&&<a href={`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`} target="_blank" style={{display:'inline-flex',alignItems:'center',gap:6,color:'#25D366',fontWeight:700,fontSize:'.78rem',textDecoration:'none',marginBottom:8}}>
                  <IcWA s={14} fill="#25D366"/>{maskPhone(r.whatsapp)}
