          <button onClick={handleSpin} disabled={spinning} style={{marginTop:6,padding:'13px 44px',borderRadius:50,border:'none',cursor:spinning?'not-allowed':'pointer',background:spinning?'#444':'linear-gradient(135deg,#FFD700,#B8860B)',color:spinning?'#888':'#1A0000',fontWeight:900,fontSize:'1.1rem',letterSpacing:'.04em',boxShadow:spinning?'none':'0 4px 22px rgba(255,200,0,.5)',transition:'all .2s'}}>
            {spinning?'Girando...':'🎯  GIRAR!'}
          </button>
        </>
      ):(
        <div style={{textAlign:'center',padding:'0 24px'}}>
          {won.type==='replay'?(
            <>
              <div style={{fontSize:'4rem',animation:'prize-pop .5s ease'}}>{'🔄'}</div>
              <div style={{fontSize:'1.4rem',fontWeight:900,color:'#00FF66',marginTop:10,textShadow:'0 0 20px rgba(0,255,100,.6)'}}>{'Giro Grátis!'}</div>
              <div style={{fontSize:'.88rem',color:'rgba(255,255,255,.8)',fontWeight:600,marginTop:8}}>{'Você ganhou mais uma chance!'}</div>
              <button onClick={handleReplay} style={{marginTop:26,padding:'14px 40px',borderRadius:50,border:'none',cursor:'pointer',background:'linear-gradient(135deg,#00AA44,#006622)',color:'#fff',fontWeight:900,fontSize:'1rem',boxShadow:'0 4px 18px rgba(0,170,68,.5)'}}>{'🎯 Girar de Novo!'}</button>
            </>
          ):(
            <>
              <div style={{fontSize:'4.5rem',animation:'prize-pop .5s ease'}}>{'🎉'}</div>
              <div style={{fontSize:'.9rem',fontWeight:700,color:'rgba(255,255,255,.8)',marginBottom:10,marginTop:4}}>{'Você ganhou'}</div>
              <div style={{fontSize:'3.5rem',fontWeight:900,lineHeight:1.1,background:'linear-gradient(135deg,#FFD700,#FF8C00)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',animation:'prize-pop .5s ease'}}>{'R$ '}{won.value}</div>
              <div style={{fontSize:'.85rem',color:'rgba(255,255,255,.7)',fontWeight:600,marginTop:10}}>{'de Bônus Roleta! 🎰'}</div>
              <div style={{marginTop:30,display:'flex',flexDirection:'column',gap:10,alignItems:'center'}}>
                {spinIndex<spinTotal?(
                  <button onClick={onClose} style={{padding:'14px 48px',borderRadius:50,border:'none',cursor:'pointer',background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',fontWeight:900,fontSize:'1rem',boxShadow:'0 4px 18px rgba(29,122,58,.45)'}}>{`Próximo Giro (${spinIndex+1}/${spinTotal})`}</button>
                ):(<>
                  <button onClick={onClose} style={{padding:'14px 48px',borderRadius:50,border:'none',cursor:'pointer',background:'linear-gradient(135deg,#1D7A3A,#22AA44)',color:'#fff',fontWeight:900,fontSize:'1rem',boxShadow:'0 4px 18px rgba(29,122,58,.45)'}}>{'Fechar'}</button>
                  <button onClick={handleRetryPaid} style={{padding:'11px 30px',borderRadius:50,border:'1.5px solid rgba(255,215,0,.5)',cursor:'pointer',background:'transparent',color:'#FFD700',fontWeight:800,fontSize:'.82rem'}}>{'🔄 Tente Novamente por apenas R$ 5,00'}</button>
                </>)}
              </div>
            </>
          )}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   MINIGAME — ESTOURA OPORTUNIDADE
   Bubble-shooter original do SEEK Network: atira peças hexagonais
   coloridas (uma por categoria de produto) contra um aglomerado fixo
   no topo da tela. 3+ peças da mesma categoria em contato formam um
   "Negócio Fechado!" e somem (peças que ficam desconectadas do topo
   caem junto, como bônus). 5 fases fixas com formatos diferentes —
   sem geração aleatória de fase; só a cor de cada peça sorteada é
   aleatória, sempre dentre as cores ainda presentes no tabuleiro.
══════════════════════════════════════════════════════════════════ */
const EO_CATEGORIES=[
  {id:'auto',    name:'Automóveis',         color:'#3A86FF', dark:'#1948A3'},
  {id:'cons',    name:'Consórcios',         color:'#1D7A3A', dark:'#0F4A22'},
  {id:'corp',    name:'Empresariais',       color:'#8833BB', dark:'#551F79'},
  {id:'premiada',name:'Indicação Premiada', color:'#FFD700', dark:'#B8860B', bonus:true},
];
const EO_LEVELS=[
  {name:'Triângulo',mask:['111111111','.1111111.','..11111..','...111...','....1....']},
  {name:'Losango',  mask:['....1....','...111...','..11111..','.1111111.','..11111..','...111...','....1....']},
  {name:'Coração',  mask:['.11...11.','111.1.111','111111111','.1111111.','..11111..','...111...','....1....']},
  {name:'Hexágono', mask:['..11111..','.1111111.','111111111','111111111','.1111111.','..11111..']},
  {name:'Seta',     mask:['....1....','...111...','..11111..','.1111111.','....1....','....1....','....1....']},
];
const EO_COLS=9, EO_ROWS=11, EO_DANGER_ROW=9;

function eoNeighbors(row,col){
  const odd=row%2===1;
  return odd
    ?[[row,col-1],[row,col+1],[row-1,col],[row-1,col+1],[row+1,col],[row+1,col+1]]
    :[[row,col-1],[row,col+1],[row-1,col-1],[row-1,col],[row+1,col-1],[row+1,col]];
}
function eoBuildBoard(levelIdx){
  const{mask}=EO_LEVELS[levelIdx];
  const board=Array.from({length:EO_ROWS},()=>Array(EO_COLS).fill(null));
  const normalIds=EO_CATEGORIES.filter(c=>!c.bonus).map(c=>c.id);
  mask.forEach((rowStr,r)=>{
    for(let c=0;c<EO_COLS;c++){
      if(rowStr[c]==='1'){
        const colorId=Math.random()<0.12?'premiada':normalIds[Math.floor(Math.random()*normalIds.length)];
        board[r][c]={colorId};
      }
    }
  });
  return board;
}
function eoFilledCount(board){
  let n=0;
  for(let r=0;r<EO_ROWS;r++)for(let c=0;c<EO_COLS;c++)if(board[r][c])n++;
  return n;
}
function eoDistinctColors(board){
  const set=new Set();
  for(let r=0;r<EO_ROWS;r++)for(let c=0;c<EO_COLS;c++)if(board[r][c])set.add(board[r][c].colorId);
  return[...set];
}
function eoFloodMatch(board,row,col){
  const target=board[row][col].colorId;
  const seen=new Set([row+','+col]);
  const stack=[[row,col]], group=[[row,col]];
  while(stack.length){
    const[r,c]=stack.pop();
    eoNeighbors(r,c).forEach(([nr,nc])=>{
      if(nr<0||nr>=EO_ROWS||nc<0||nc>=EO_COLS)return;
      const key=nr+','+nc;
      if(seen.has(key))return;
      const cell=board[nr][nc];
      if(cell&&cell.colorId===target){seen.add(key);stack.push([nr,nc]);group.push([nr,nc]);}
    });
  }
  return group;
}
function eoRemoveFloating(board){
  const reachable=new Set();
  const stack=[];
  for(let c=0;c<EO_COLS;c++)if(board[0][c]){reachable.add('0,'+c);stack.push([0,c]);}
  while(stack.length){
    const[r,c]=stack.pop();
    eoNeighbors(r,c).forEach(([nr,nc])=>{
      if(nr<0||nr>=EO_ROWS||nc<0||nc>=EO_COLS)return;
      const key=nr+','+nc;
      if(reachable.has(key))return;
      if(board[nr][nc]){reachable.add(key);stack.push([nr,nc]);}
    });
  }
  let floatCount=0;
  for(let r=0;r<EO_ROWS;r++)for(let c=0;c<EO_COLS;c++){
    if(board[r][c]&&!reachable.has(r+','+c)){board[r][c]=null;floatCount++;}
  }
  return floatCount;
}
function eoHexPath(ctx,cx,cy,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    const a=Math.PI/180*(60*i-90);
    const x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.closePath();
}
function eoDrawPiece(ctx,cx,cy,r,cat){
  eoHexPath(ctx,cx,cy,r*0.94);
  const grad=ctx.createRadialGradient(cx-r*0.25,cy-r*0.3,r*0.1,cx,cy,r);
  grad.addColorStop(0,cat.bonus?'#FFF6C0':'rgba(255,255,255,.55)');
  grad.addColorStop(1,cat.color);
  ctx.fillStyle=grad;ctx.fill();
  ctx.lineWidth=Math.max(1.5,r*0.1);ctx.strokeStyle=cat.dark;ctx.stroke();
  if(cat.bonus){
    ctx.fillStyle='rgba(255,255,255,.9)';
    ctx.font=`${Math.round(r*0.85)}px sans-serif`;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('★',cx,cy+r*0.05);
  }
}

function EstouraOportunidadeGame({levelIdx,onLevelResult,onExit}){
  const canvasRef=React.useRef(null);
  const wrapRef=React.useRef(null);
  const layoutRef=React.useRef(null);
  const boardRef=React.useRef(null);
  const movingRef=React.useRef(null);
  const aimRef=React.useRef({angle:0,active:false});
  const rafRef=React.useRef(null);
  const toastRef=React.useRef({text:'',until:0});
  const currentRef=React.useRef(null);
  const nextRef=React.useRef(null);
  const shotsUsedRef=React.useRef(0);
  const shotBudgetRef=React.useRef(0);
  const scoreRef=React.useRef(0);
  const doneRef=React.useRef(false);
  const [score,setScore]=useState(0);
  const [shotsLeft,setShotsLeft]=useState(0);
  const [next,setNext]=useState(null);
  const level=EO_LEVELS[levelIdx];

  function computeLayout(width){
    const R=Math.max(12,width/((EO_COLS+1)*1.75));
    const hexW=R*Math.sqrt(3), rowH=R*1.5;
    const originX=width/2-((EO_COLS-1)/2)*hexW;
    const originY=R+10;
    const gridBottom=originY+(EO_ROWS-1)*rowH+R;
    const cannonY=gridBottom+R+18;
    const height=cannonY+R+26;
    return{R,hexW,rowH,originX,originY,width,height,cannonX:width/2,cannonY};
  }
  function cellCenter(L,row,col){
    return{x:L.originX+col*L.hexW+(row%2?L.hexW/2:0),y:L.originY+row*L.rowH};
  }
  function pickColor(){
    const colors=eoDistinctColors(boardRef.current);
    return colors.length?colors[Math.floor(Math.random()*colors.length)]:EO_CATEGORIES[0].id;
  }

  useEffect(()=>{
    function resize(){
      const w=Math.min(wrapRef.current?wrapRef.current.clientWidth:340,380);
      const L=computeLayout(w);
      layoutRef.current=L;
      if(canvasRef.current){canvasRef.current.width=L.width;canvasRef.current.height=L.height;}
    }
    resize();
    window.addEventListener('resize',resize);
    return()=>window.removeEventListener('resize',resize);
  },[]);

  useEffect(()=>{
    const board=eoBuildBoard(levelIdx);
    boardRef.current=board;
    const filled=eoFilledCount(board);
    shotBudgetRef.current=filled+Math.ceil(filled*0.5)+6;
    shotsUsedRef.current=0;
    scoreRef.current=0;
    doneRef.current=false;
    movingRef.current=null;
    currentRef.current=pickColor();
    nextRef.current=pickColor();
    setScore(0);
    setShotsLeft(shotBudgetRef.current);
    setNext(nextRef.current);

    let lastT=performance.now();
    function frame(now){
      const dt=Math.min(0.05,(now-lastT)/1000);
      lastT=now;
      step(dt);
      draw(now);
      if(!doneRef.current)rafRef.current=requestAnimationFrame(frame);
    }
    rafRef.current=requestAnimationFrame(frame);
    return()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);};
  },[levelIdx]);

  function finish(cleared){
    if(doneRef.current)return;
    doneRef.current=true;
    let stars=0;
    if(cleared){
      const eff=shotsUsedRef.current/shotBudgetRef.current;
      stars=eff<=0.6?3:eff<=0.85?2:1;
    }
    onLevelResult({cleared,score:scoreRef.current,stars,levelName:level.name});
  }

  function resolveShot(snapRow,snapCol){
    const board=boardRef.current;
    const group=eoFloodMatch(board,snapRow,snapCol);
    if(group.length>=3){
      const isBonus=board[snapRow][snapCol].colorId==='premiada';
      let gained=group.length*10+Math.max(0,group.length-3)*15;
      if(isBonus)gained*=2;
      group.forEach(([r,c])=>{board[r][c]=null;});
      gained+=eoRemoveFloating(board)*20;
      scoreRef.current+=gained;
      setScore(scoreRef.current);
      toastRef.current={text:'Negócio Fechado!',until:performance.now()+900};
    }
    if(eoFilledCount(board)===0){finish(true);return;}
    let danger=false;
    for(let r=EO_DANGER_ROW;r<EO_ROWS&&!danger;r++){
      for(let c=0;c<EO_COLS;c++){if(board[r][c]){danger=true;break;}}
    }
    if(danger){finish(false);return;}
    if(shotsUsedRef.current>=shotBudgetRef.current){finish(false);return;}
    currentRef.current=nextRef.current;
    nextRef.current=pickColor();
    setNext(nextRef.current);
    setShotsLeft(shotBudgetRef.current-shotsUsedRef.current);
  }

  function step(dt){
    const m=movingRef.current;
    if(!m)return;
    const L=layoutRef.current;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(m.x<L.R){m.x=L.R;m.vx=-m.vx;}
    if(m.x>L.width-L.R){m.x=L.width-L.R;m.vx=-m.vx;}
    const board=boardRef.current;
    let hit=null,hitDist=Infinity;
    for(let r=0;r<EO_ROWS;r++)for(let c=0;c<EO_COLS;c++){
      if(!board[r][c])continue;
      const p=cellCenter(L,r,c);
      const d=Math.hypot(p.x-m.x,p.y-m.y);
      if(d<L.R*1.9&&d<hitDist){hit=[r,c];hitDist=d;}
    }
    let snapRow=null,snapCol=null;
    if(hit){
      let best=null,bestD=Infinity;
      eoNeighbors(hit[0],hit[1]).forEach(([nr,nc])=>{
        if(nr<0||nr>=EO_ROWS||nc<0||nc>=EO_COLS||board[nr][nc])return;
        const p=cellCenter(L,nr,nc);
        const d=Math.hypot(p.x-m.x,p.y-m.y);
        if(d<bestD){bestD=d;best=[nr,nc];}
      });
      if(best){snapRow=best[0];snapCol=best[1];}
    }else if(m.y<=L.originY){
      let best=null,bestD=Infinity;
      for(let c=0;c<EO_COLS;c++){
        if(board[0][c])continue;
        const d=Math.abs(cellCenter(L,0,c).x-m.x);
        if(d<bestD){bestD=d;best=[0,c];}
      }
      if(best){snapRow=best[0];snapCol=best[1];}
    }
    if(snapRow==null){
      if(!hit&&m.y>L.originY)return; // ainda em voo, nada para snapar
      // fallback de segurança: nenhum vizinho vazio perto o bastante — usa a célula vazia mais próxima do tabuleiro
      let best=null,bestD=Infinity;
      for(let r=0;r<EO_ROWS;r++)for(let c=0;c<EO_COLS;c++){
        if(board[r][c])continue;
        const p=cellCenter(L,r,c);
        const d=Math.hypot(p.x-m.x,p.y-m.y);
        if(d<bestD){bestD=d;best=[r,c];}
      }
      if(!best){movingRef.current=null;return;}
      snapRow=best[0];snapCol=best[1];
    }
    board[snapRow][snapCol]={colorId:m.colorId};
    shotsUsedRef.current+=1;
    movingRef.current=null;
    resolveShot(snapRow,snapCol);
  }

  function draw(now){
    const canvas=canvasRef.current,L=layoutRef.current;
    if(!canvas||!L)return;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,L.width,L.height);
    const dangerY=L.originY+(EO_DANGER_ROW-0.5)*L.rowH;
    ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(255,60,60,.35)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(0,dangerY);ctx.lineTo(L.width,dangerY);ctx.stroke();
    ctx.setLineDash([]);
    const board=boardRef.current;
    for(let r=0;r<EO_ROWS;r++)for(let c=0;c<EO_COLS;c++){
      if(!board[r][c])continue;
      const p=cellCenter(L,r,c);
      eoDrawPiece(ctx,p.x,p.y,L.R,EO_CATEGORIES.find(x=>x.id===board[r][c].colorId));
    }
    const aim=aimRef.current;
    if(aim.active&&!movingRef.current){
      let x=L.cannonX,y=L.cannonY,dx=Math.sin(aim.angle),dy=-Math.cos(aim.angle),bounced=false;
      ctx.setLineDash([5,7]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(x,y);
      for(let i=0;i<300;i++){
        x+=dx*5;y+=dy*5;
        if(x<=L.R||x>=L.width-L.R){if(bounced)break;dx=-dx;bounced=true;}
        if(y<=L.originY)break;
        ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.setLineDash([]);
    }
    ctx.fillStyle='#111';
    ctx.beginPath();ctx.arc(L.cannonX,L.cannonY,L.R*1.15,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.stroke();
    if(currentRef.current)eoDrawPiece(ctx,L.cannonX,L.cannonY,L.R*0.85,EO_CATEGORIES.find(x=>x.id===currentRef.current));
    if(movingRef.current){
      const m=movingRef.current;
      eoDrawPiece(ctx,m.x,m.y,L.R,EO_CATEGORIES.find(x=>x.id===m.colorId));
    }
    if(toastRef.current.until>now){
      const alpha=Math.min(1,(toastRef.current.until-now)/900);
      ctx.fillStyle=`rgba(255,215,0,${alpha})`;
      ctx.font='900 16px Inter,sans-serif';ctx.textAlign='center';
      ctx.fillText(toastRef.current.text,L.width/2,L.height*0.42);
    }
  }

  function fire(){
    if(movingRef.current||doneRef.current)return;
    const L=layoutRef.current;
    const angle=Math.max(-1.3,Math.min(1.3,aimRef.current.angle));
    const speed=620;
    movingRef.current={x:L.cannonX,y:L.cannonY-L.R*1.2,vx:speed*Math.sin(angle),vy:-speed*Math.cos(angle),colorId:currentRef.current};
    aimRef.current.active=false;
  }
  function updateAim(clientX,clientY){
    const canvas=canvasRef.current,L=layoutRef.current;
    if(!canvas||!L)return;
    const rect=canvas.getBoundingClientRect();
    const scale=L.width/rect.width;
    const x=(clientX-rect.left)*scale, y=(clientY-rect.top)*scale;
    let angle=Math.atan2(x-L.cannonX,L.cannonY-y);
    angle=Math.max(-1.3,Math.min(1.3,angle));
    aimRef.current={angle,active:true};
  }
  function onMouseMove(e){updateAim(e.clientX,e.clientY);}
  function onMouseDown(e){updateAim(e.clientX,e.clientY);fire();}
  function onTouchStart(e){const t=e.touches[0];updateAim(t.clientX,t.clientY);}
  function onTouchMove(e){e.preventDefault();const t=e.touches[0];updateAim(t.clientX,t.clientY);}
  function onTouchEnd(e){e.preventDefault();fire();}

  return(
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:10,width:'100%'}}>
      <div style={{display:'flex',gap:16,fontSize:'.76rem',fontWeight:800,color:'#fff'}}>
        <span>🏆 {score}</span>
        <span>🎯 {shotsLeft}</span>
        <span>Fase {levelIdx+1}/{EO_LEVELS.length} · {level.name}</span>
      </div>
      <div ref={wrapRef} style={{width:'100%',maxWidth:380,touchAction:'none'}}
        onMouseMove={onMouseMove} onMouseDown={onMouseDown}
        onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}>
        <canvas ref={canvasRef} style={{width:'100%',display:'block',borderRadius:12,boxShadow:'0 4px 24px rgba(0,0,0,.5)'}}/>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:8,fontSize:'.68rem',color:'rgba(255,255,255,.6)',fontWeight:700}}>
        <span>Próxima:</span>
        {next&&<span style={{width:16,height:16,borderRadius:4,background:EO_CATEGORIES.find(x=>x.id===next).color,display:'inline-block'}}/>}
      </div>
      <button className="btn" style={{padding:'8px 20px',fontSize:'.74rem'}} onClick={onExit}>Sair</button>
    </div>
  );
}

function MinigameModal({seekId,jrId,scoreRow,onSaveScore,onClose}){
  const [phase,setPhase]=useState('intro'); // intro | playing | levelResult | sessionOver
  const [levelIdx,setLevelIdx]=useState(0);
  const [sessionScore,setSessionScore]=useState(0);
  const [lastResult,setLastResult]=useState(null);
  const [finalResult,setFinalResult]=useState(null);
  const [saving,setSaving]=useState(false);
  const highScore=scoreRow?scoreRow.highScore:0;
  const totalXp=scoreRow?scoreRow.totalXp:0;
  const isLastLevel=levelIdx===EO_LEVELS.length-1;

  function startSession(){setLevelIdx(0);setSessionScore(0);setPhase('playing');}
  function handleLevelResult(result){
    setSessionScore(s=>s+result.score);
    setLastResult(result);
    setPhase('levelResult');
  }
  async function finalizeSession(total){
    setSaving(true);
    await onSaveScore(seekId,jrId,total,total);
    setSaving(false);
    setFinalResult({total,xp:total,isNewHigh:total>highScore});
    setPhase('sessionOver');
  }
  function nextLevel(){setLevelIdx(i=>i+1);setPhase('playing');}
  function retryLevel(){setPhase('playing');}

  return(
    <div className="spin-overlay" style={{flexDirection:'column',overflowY:'auto',padding:'20px 16px',background:'radial-gradient(ellipse at center,#2A1E00 0%,#140F00 60%,#0A0700 100%)'}} onClick={phase!=='playing'?onClose:undefined}>
      <div onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:420,display:'flex',flexDirection:'column',alignItems:'center',gap:14}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',width:'100%'}}>
          <span style={{fontWeight:900,fontSize:'1rem',color:'#fff'}}>🫧 Estoura Oportunidade</span>
          <button className="icon-btn" style={{background:'rgba(255,255,255,.1)'}} onClick={onClose}><IcX s={17} c="#fff"/></button>
        </div>

        {phase==='intro'&&(
          <div style={{display:'flex',flexDirection:'column',gap:16,alignItems:'center',textAlign:'center',padding:'6px 6px 10px'}}>
            <div style={{fontSize:'.82rem',color:'rgba(255,255,255,.75)',lineHeight:1.7}}>
              Mire e atire as peças no aglomerado. Junte <b style={{color:'#fff'}}>3 ou mais</b> da mesma categoria para fechar negócio e estourar as peças.<br/>
              Fique de olho na <b style={{color:'#FFD700'}}>Indicação Premiada</b> — vale o dobro dos pontos!
            </div>
            <div style={{display:'flex',gap:28}}>
              <div style={{textAlign:'center'}}><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.5)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>Recorde</div><div style={{fontWeight:900,fontSize:'1.2rem',color:'#fff'}}>{highScore}</div></div>
              <div style={{textAlign:'center'}}><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.5)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>XP Total</div><div style={{fontWeight:900,fontSize:'1.2rem',color:'#FFD700'}}>{totalXp}</div></div>
            </div>
            <button className="btn btn-dark btn-full" style={{padding:14}} onClick={startSession}>🎮 Jogar</button>
          </div>
        )}

        {phase==='playing'&&<EstouraOportunidadeGame key={levelIdx} levelIdx={levelIdx} onLevelResult={handleLevelResult} onExit={onClose}/>}

        {phase==='levelResult'&&lastResult&&(
          <div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'center',textAlign:'center',padding:'6px 6px 10px'}}>
            <div style={{fontSize:'2.6rem'}}>{lastResult.cleared?'🏆':'💫'}</div>
            <div style={{fontWeight:900,fontSize:'1.1rem',color:'#fff'}}>{lastResult.cleared?'Fase Completa!':'Fase não concluída'}</div>
            {lastResult.cleared&&<div style={{fontSize:'1.6rem'}}>{'⭐'.repeat(lastResult.stars)}{'☆'.repeat(3-lastResult.stars)}</div>}
            <div style={{display:'flex',gap:28,marginTop:4}}>
              <div><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.5)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>Pontos da Fase</div><div style={{fontWeight:900,fontSize:'1.3rem',color:'#fff'}}>{lastResult.score}</div></div>
              <div><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.5)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>Total da Sessão</div><div style={{fontWeight:900,fontSize:'1.3rem',color:'#FFD700'}}>{sessionScore}</div></div>
            </div>
            <div style={{display:'flex',gap:10,width:'100%',marginTop:8}}>
              {lastResult.cleared&&isLastLevel?(
                <button className="btn btn-dark btn-full" onClick={()=>finalizeSession(sessionScore)}>Ver Resultado Final</button>
              ):(<>
                <button className="btn btn-full" onClick={()=>finalizeSession(sessionScore)}>Encerrar e Salvar</button>
                {lastResult.cleared
                  ?<button className="btn btn-dark btn-full" onClick={nextLevel}>Próxima Fase</button>
                  :<button className="btn btn-dark btn-full" onClick={retryLevel}>🔄 Tentar de Novo</button>}
              </>)}
            </div>
          </div>
        )}

        {phase==='sessionOver'&&finalResult&&(
          <div style={{display:'flex',flexDirection:'column',gap:12,alignItems:'center',textAlign:'center',padding:'6px 6px 10px'}}>
            <div style={{fontSize:'2.6rem'}}>🎉</div>
            <div style={{fontWeight:900,fontSize:'1.1rem',color:'#fff'}}>Sessão Encerrada</div>
            {finalResult.isNewHigh&&<div style={{fontSize:'.74rem',fontWeight:800,color:'#FFD700'}}>🌟 Novo recorde!</div>}
            <div style={{display:'flex',gap:28,marginTop:4}}>
              <div><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.5)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>Pontos</div><div style={{fontWeight:900,fontSize:'1.3rem',color:'#fff'}}>{finalResult.total}</div></div>
              <div><div style={{fontSize:'.6rem',color:'rgba(255,255,255,.5)',fontWeight:800,textTransform:'uppercase',letterSpacing:'.06em'}}>XP Ganho</div><div style={{fontWeight:900,fontSize:'1.3rem',color:'#FFD700'}}>+{finalResult.xp}</div></div>
            </div>
            {saving&&<div style={{fontSize:'.7rem',color:'rgba(255,255,255,.6)'}}>Salvando...</div>}
            <div style={{display:'flex',gap:10,width:'100%',marginTop:8}}>
              <button className="btn btn-full" onClick={onClose}>Fechar</button>
              <button className="btn btn-dark btn-full" onClick={startSession}>🔄 Jogar de novo</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [loading,setLoading]=useState(true);
  const [session,setSession]=useState(null);
  const [adms,setAdms]=useState([]);
  const [members,setMembers]=useState([]);
  const [referrals,setReferrals]=useState([]);
  const [seekJrs,setSeekJrs]=useState([]);
  const [jrReferrals,setJrReferrals]=useState([]);
  const [credentials,setCredentials]=useState({});
  const [passReqs,setPassReqs]=useState([]);
  const [levelNotifs,setLevelNotifs]=useState([]);
  const [offers,setOffers]=useState([]);
  const [spinRewards,setSpinRewards]=useState([]);
  const [pendingSpins,setPendingSpins]=useState([]);
  const spinBatchTotalsRef=React.useRef({});
  /* Cada giro pendente vira um SpinModal remontado à parte (key={first.id}), então
     o total do "lote" (ex: 3 vendas fechadas de uma vez) não sobrevive entre
     remontagens — guardamos aqui, fora do state, para exibir "Giro 2 de 3". */
  function spinBatchInfo(key,remaining){
    if(remaining<=0){delete spinBatchTotalsRef.current[key];return{index:0,total:0};}
    const total=Math.max(spinBatchTotalsRef.current[key]||0,remaining);
    spinBatchTotalsRef.current[key]=total;
    return{index:total-remaining+1,total};
  }
  const [chestPending,setChestPending]=useState([]);
  const [chestRewards,setChestRewards]=useState([]);
  const [minigameScores,setMinigameScores]=useState([]);
  const [challengeConfigs,setChallengeConfigs]=useState([]);
  const [dbError,setDbError]=useState(null);

  useEffect(()=>{
    async function boot(){
      cleanupLegacyStorageKeys();
      // Fase 1 — tabelas críticas para login (aparece rápido)
      const [
        {data:mRows,error:e1},{data:cRows},{data:admRows,error:eAdm},{data:jrRows},
      ]=await Promise.all([
        db.from('members').select('*'),
        db.from('credentials').select('*'),
        db.from('adms').select('*'),
        db.from('seek_jrs').select('*'),
      ]);
      if(e1)console.error('[SEEK boot] members error:',e1);
      if(eAdm)console.error('[SEEK boot] ERRO tabela adms:',JSON.stringify(eAdm));
      setMembers((mRows||[]).map(mMember));
      setAdms((admRows||[]).map(mAdm));
      setCredentials(buildCreds(cRows));
      setSeekJrs((jrRows||[]).map(mSeekJr));
      setLoading(false); // ← tela de login aparece aqui
      // Fase 2 — resto dos dados em background (enquanto usuário digita login)
      const [
        {data:rRows},{data:reqRows},{data:jrRefRows},
        {data:notifRows},{data:offerRows},{data:spinRows},{data:spinPendingRows},
        {data:chestPendingRows},{data:chestRewardRows},{data:mgRows,error:mgErr},
        {data:ccRows,error:ccErr},
      ]=await Promise.all([
        db.from('referrals').select('*'),
        db.from('pass_requests').select('*'),
        db.from('jr_referrals').select('*'),
        db.from('level_notifs').select('*'),
        db.from('offers').select('*'),
        db.from('spin_rewards').select('*'),
        db.from('spin_pending').select('*'),
        db.from('chest_pending').select('*').eq('used',false),
        db.from('chest_rewards').select('*'),
        db.from('minigame_scores').select('*'),
        db.from('monthly_challenge_config').select('*'),
      ]);
      if(mgErr)console.warn('[SEEK boot] tabela minigame_scores indisponível (migration-minigame-scores.sql ainda não executada?):',mgErr.message);
      setReferrals((rRows||[]).map(mRef));
      setPassReqs((reqRows||[]).map(mPassReq));
      setJrReferrals((jrRefRows||[]).map(mJrRef));
      setLevelNotifs((notifRows||[]).map(mNotif));
      setOffers((offerRows||[]).map(mOffer));
      setSpinRewards((spinRows||[]).map(mSpin));
      setPendingSpins((spinPendingRows||[]).map(mSpinPending));
      setChestPending((chestPendingRows||[]).map(mChestPending));
      setChestRewards((chestRewardRows||[]).map(mChestReward));
      setMinigameScores((mgRows||[]).map(mMinigameScore));
      if(ccErr)console.warn('[SEEK boot] tabela monthly_challenge_config indisponível (migration-monthly-challenge.sql ainda não executada?):',ccErr.message);
      setChallengeConfigs((ccRows||[]).map(mChallengeConfig));
    }
    boot();
  },[]);

  const [refreshingLedger,setRefreshingLedger]=useState(false);
  async function refreshLedgerData(){
    console.log('[refreshLedgerData] iniciando recarregamento do Supabase...');
    setRefreshingLedger(true);
    const [
      {data:rRows,error:e1},{data:jrRefRows,error:e2},{data:spinRows,error:e3},
      {data:chestRewardRows,error:e4},{data:chestPendingRows,error:e5},{data:spinPendingRows,error:e6},
    ]=await Promise.all([
      db.from('referrals').select('*'),
      db.from('jr_referrals').select('*'),
      db.from('spin_rewards').select('*'),
      db.from('chest_rewards').select('*'),
      db.from('chest_pending').select('*').eq('used',false),
      db.from('spin_pending').select('*'),
    ]);
    if(e1)console.error('[refreshLedgerData] ERRO referrals:',e1);
    if(e2)console.error('[refreshLedgerData] ERRO jr_referrals:',e2);
    if(e3)console.error('[refreshLedgerData] ERRO spin_rewards:',e3);
    if(e4)console.error('[refreshLedgerData] ERRO chest_rewards:',e4);
    setReferrals((rRows||[]).map(mRef));
    setJrReferrals((jrRefRows||[]).map(mJrRef));
    setSpinRewards((spinRows||[]).map(mSpin));
    setChestRewards((chestRewardRows||[]).map(mChestReward));
    setChestPending((chestPendingRows||[]).map(mChestPending));
    setPendingSpins((spinPendingRows||[]).map(mSpinPending));
    console.log('[refreshLedgerData] concluído — refs='+(rRows||[]).length+' pagas='+(rRows||[]).filter(r=>r.paid).length+' | jrRefs='+(jrRefRows||[]).length+' pagas='+(jrRefRows||[]).filter(r=>r.paid).length);
    setRefreshingLedger(false);
  }

  function checkLevelUp(memberId,oldRefs,newRefs){
    const oldPts=calcPoints(oldRefs.filter(r=>sameId(r.memberId,memberId)).reduce((s,r)=>s+r.productValue,0));
    const newPts=calcPoints(newRefs.filter(r=>sameId(r.memberId,memberId)).reduce((s,r)=>s+r.productValue,0));
    const oldLv=getSeekLevel(oldPts);
    const newLv=getSeekLevel(newPts);
    if(newLv.id!==oldLv.id&&newLv.min>oldLv.min){
      db.from('level_notifs').insert({member_id:String(memberId),level_id:newLv.id,dismissed:false}).select().single()
        .then(({data})=>{if(data)setLevelNotifs(u=>[...u,mNotif(data)]);});
    }
  }

  async function addMember(data,admId){
    const rawL=(data.whatsapp||data.login||'').replace(/\D/g,'');
    const {data:row,error}=await db.from('members').insert({name:data.name,whatsapp:rawL,pix_key:data.pixKey,notes:data.notes,adm_id:admId||null}).select().single();
    if(error||!row){console.error('[addMember]',error);return;}
    setMembers(u=>[...u,mMember(row)]);
    await db.from('credentials').insert({key:String(row.id),login:rawL,pin:data.pin||'0000'});
    setCredentials(u=>({...u,[String(row.id)]:{login:rawL,pin:data.pin||'0000'}}));
  }

  async function updateMember(mid,data){
    const rawL=(data.whatsapp||'').replace(/\D/g,'');
    await db.from('members').update({name:data.name,whatsapp:rawL,pix_key:data.pixKey,notes:data.notes}).eq('id',mid);
    setMembers(u=>u.map(m=>sameId(m.id,mid)?{...m,...data,whatsapp:rawL}:m));
    if(data.whatsapp!==undefined){
      await db.from('credentials').update({login:rawL}).eq('key',String(mid));
      setCredentials(u=>{const k=Object.keys(u).find(k=>sameId(k,mid));if(!k)return u;return{...u,[k]:{...u[k],login:rawL}};});
    }
  }

  async function deleteMember(mid){
    const midStr=String(mid);
    const jrIds=seekJrs.filter(j=>sameId(j.seekId,mid)).map(j=>String(j.id));
    await Promise.all([
      db.from('referrals').delete().eq('member_id',midStr),
      jrIds.length?db.from('jr_referrals').delete().in('jr_id',jrIds):Promise.resolve(),
      jrIds.length?db.from('seek_jrs').delete().in('id',jrIds):Promise.resolve(),
      db.from('credentials').delete().eq('key',midStr),
      ...jrIds.map(jid=>db.from('credentials').delete().eq('key',`jr_${jid}`)),
      db.from('members').delete().eq('id',mid),
      db.from('spin_rewards').delete().eq('seek_id',midStr),
      jrIds.length?db.from('spin_rewards').delete().in('jr_id',jrIds):Promise.resolve(),
      db.from('spin_pending').delete().eq('seek_id',midStr),
      jrIds.length?db.from('spin_pending').delete().in('jr_id',jrIds):Promise.resolve(),
      db.from('chest_rewards').delete().eq('seek_id',midStr),
      jrIds.length?db.from('chest_rewards').delete().in('jr_id',jrIds):Promise.resolve(),
      db.from('chest_pending').delete().eq('seek_id',midStr),
      jrIds.length?db.from('chest_pending').delete().in('jr_id',jrIds):Promise.resolve(),
    ]);
    setMembers(u=>u.filter(m=>!sameId(m.id,mid)));
    setSeekJrs(u=>u.filter(j=>!sameId(j.seekId,mid)));
    setReferrals(u=>u.filter(r=>!sameId(r.memberId,mid)));
    setJrReferrals(u=>u.filter(r=>!jrIds.some(jid=>sameId(r.jrId,jid))));
    setCredentials(u=>{const nc={...u};delete nc[midStr];jrIds.forEach(jid=>delete nc[`jr_${jid}`]);return nc;});
    setSpinRewards(u=>u.filter(s=>!sameId(s.seekId,mid)&&!jrIds.some(jid=>sameId(s.jrId,jid))));
    setPendingSpins(u=>u.filter(s=>!sameId(s.seekId,mid)&&!jrIds.some(jid=>sameId(s.jrId,jid))));
    setChestRewards(u=>u.filter(c=>!sameId(c.seekId,mid)&&!jrIds.some(jid=>sameId(c.jrId,jid))));
    setChestPending(u=>u.filter(c=>!sameId(c.seekId,mid)&&!jrIds.some(jid=>sameId(c.jrId,jid))));
  }

  async function deleteSeekJr(jid){
    const jidStr=String(jid);
    await Promise.all([
      db.from('jr_referrals').delete().eq('jr_id',jidStr),
      db.from('credentials').delete().eq('key',`jr_${jidStr}`),
      db.from('seek_jrs').delete().eq('id',jidStr),
      db.from('spin_rewards').delete().eq('jr_id',jidStr),
      db.from('spin_pending').delete().eq('jr_id',jidStr),
      db.from('chest_rewards').delete().eq('jr_id',jidStr),
      db.from('chest_pending').delete().eq('jr_id',jidStr),
    ]);
    setSeekJrs(u=>u.filter(j=>!sameId(j.id,jid)));
    setJrReferrals(u=>u.filter(r=>!sameId(r.jrId,jid)));
    setCredentials(u=>{const nc={...u};delete nc[`jr_${jidStr}`];return nc;});
    setSpinRewards(u=>u.filter(s=>!sameId(s.jrId,jid)));
    setPendingSpins(u=>u.filter(s=>!sameId(s.jrId,jid)));
    setChestRewards(u=>u.filter(c=>!sameId(c.jrId,jid)));
    setChestPending(u=>u.filter(c=>!sameId(c.jrId,jid)));
  }

  async function addAdm(data){
    const rawL=(data.whatsapp||'').replace(/\D/g,'');
    const payload={name:data.name,whatsapp:rawL,pix_key:data.pixKey||null,notes:data.notes||null};
    console.log('[addAdm] INSERT payload=',JSON.stringify(payload));
    const {data:row,error}=await db.from('adms').insert(payload).select().single();
    console.log('[addAdm] resposta Supabase — row=',JSON.stringify(row),'error=',JSON.stringify(error));
    if(error||!row){
      console.error('[addAdm] FALHOU. Código:',error?.code,'Mensagem:',error?.message,'Detalhes:',error?.details);
      window.alert('[SEEK] Erro ao cadastrar vendedor:\n'+(error?.message||'Sem resposta do banco')+(error?.code?'\nCódigo: '+error.code:''));
      return;
    }
    setAdms(u=>[...u,mAdm(row)]);
    const pin=data.pin||'0000';
    const {error:eC}=await db.from('credentials').insert({key:`adm_${row.id}`,login:rawL,pin});
    if(eC)console.error('[addAdm] erro ao salvar credencial:',JSON.stringify(eC));
    setCredentials(u=>({...u,[`adm_${row.id}`]:{login:rawL,pin}}));
    console.log('[addAdm] OK — vendedor id=',row.id);
  }

  async function deleteAdm(admId){
    const admStr=String(admId);
    const admMids=members.filter(m=>sameId(m.admId,admId)).map(m=>String(m.id));
    const admJids=seekJrs.filter(j=>admMids.some(id=>sameId(j.seekId,id))).map(j=>String(j.id));
    await Promise.all([
      admMids.length?db.from('referrals').delete().in('member_id',admMids):Promise.resolve(),
      admJids.length?db.from('jr_referrals').delete().in('jr_id',admJids):Promise.resolve(),
      admJids.length?db.from('seek_jrs').delete().in('id',admJids):Promise.resolve(),
      admMids.length?db.from('credentials').delete().in('key',admMids):Promise.resolve(),
      ...admJids.map(jid=>db.from('credentials').delete().eq('key',`jr_${jid}`)),
      admMids.length?db.from('members').delete().in('id',admMids.map(Number)):Promise.resolve(),
      db.from('credentials').delete().eq('key',`adm_${admStr}`),
      db.from('adms').delete().eq('id',admId),
    ]);
    setAdms(u=>u.filter(a=>!sameId(a.id,admId)));
    setMembers(u=>u.filter(m=>!sameId(m.admId,admId)));
    setSeekJrs(u=>u.filter(j=>!admMids.some(id=>sameId(j.seekId,id))));
    setReferrals(u=>u.filter(r=>!admMids.some(id=>sameId(r.memberId,id))));
    setJrReferrals(u=>u.filter(r=>!admJids.some(id=>sameId(r.jrId,id))));
    setCredentials(u=>{const nc={...u};delete nc[`adm_${admStr}`];admMids.forEach(id=>delete nc[id]);admJids.forEach(jid=>delete nc[`jr_${jid}`]);return nc;});
  }

  async function updatePin(key,pin){
    await db.from('credentials').update({pin}).eq('key',String(key));
    setCredentials(u=>({...u,[key]:{...(u[key]||{}),pin}}));
  }

  async function addReferral(data,memberId){
    const old=[...referrals];
    const mid=String(memberId);
    const hasProduct=(data.productValue||0)>0;
    const refStatus=hasProduct?'a_pagar':'aguardando';
    // Otimista: insere na UI antes de esperar o DB
    const tmpId=`__tmp_${Date.now()}`;
    const tmpRef={id:tmpId,memberId:mid,clientName:data.clientName,whatsapp:data.whatsapp||null,productType:data.productType||'auto',productValue:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,isNew:data.isNew!==false,status:refStatus,observacoes:data.observacoes||null,paidAt:null,createdAt:new Date().toISOString(),birthdayDay:data.birthdayDay||null,birthdayMonth:data.birthdayMonth||null,birthdayYear:data.birthdayYear||null};
    const withTmp=[...referrals,tmpRef];
    setReferrals(withTmp);
    checkLevelUp(mid,old,withTmp);
    let {data:saved,error}=await db.from('referrals').insert({member_id:mid,client_name:data.clientName,whatsapp:data.whatsapp||null,product_type:data.productType||'auto',product_value:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,is_new:data.isNew!==false,status:refStatus,observacoes:data.observacoes||null,birthday_day:data.birthdayDay||null,birthday_month:data.birthdayMonth||null,birthday_year:data.birthdayYear||null}).select().single();
    if(error&&error.code==='42703'){
      ({data:saved,error}=await db.from('referrals').insert({member_id:mid,client_name:data.clientName,whatsapp:data.whatsapp||null,product_type:data.productType||'auto',product_value:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,is_new:data.isNew!==false,status:refStatus,observacoes:data.observacoes||null,birthday_day:data.birthdayDay||null,birthday_month:data.birthdayMonth||null}).select().single());
    }
    if(error&&error.code==='42703'){
      ({data:saved,error}=await db.from('referrals').insert({member_id:mid,client_name:data.clientName,whatsapp:data.whatsapp||null,product_type:data.productType||'auto',product_value:data.productValue||0,commission:data.commission||0,year:data.year,month:data.month,day:data.day,paid:false,is_new:data.isNew!==false,birthday_day:data.birthdayDay||null,birthday_month:data.birthdayMonth||null}).select().single());
    }
    if(error){console.error('[addReferral] ERRO:',error);setReferrals(old);setDbError('Erro ao salvar indicação: '+error.message);return;}
    setReferrals(u=>u.map(r=>r.id===tmpId?mRef(saved):r));
  }

      const row=mMinigameScore(saved);

      return row;
    }
    const newHigh=Math.max(existing.highScore,score);
    const newXp=existing.totalXp+xp;

  /* Ao excluir uma indicação, os spin_rewards/spin_pending vinculados a ela já
     saem junto (deleteReferral/deleteJrReferral). Isso pode fazer o dono cair
     abaixo do múltiplo de 5 giros que tinha liberado um Cofre — cancela primeiro
     o(s) chest_pending não usado(s); se ainda sobrar excesso, revoga também
     chest_reward(s) já reivindicado(s) (o mais recente primeiro, já que os
     marcos são conquistados em ordem — decisão explícita do usuário: a exclusão
     deve remover TUDO que foi gerado a partir da venda apagada, mesmo dinheiro
     já concedido). */
  function reconcileChestAfterSpinRemoval(seekId,jrId,remainingSpins){
    const ownerSpinMatch=s=>jrId?sameId(s.jrId,jrId):sameId(s.seekId,seekId);
    const ownerChestMatch=c=>jrId?sameId(c.jrId,jrId):sameId(c.seekId,seekId);
    const distinctCount=new Set(remainingSpins.filter(ownerSpinMatch).map(s=>String(s.referralId))).size;
    const expectedChests=Math.floor(distinctCount/5);
    const unusedPending=chestPending.filter(ownerChestMatch);
    const claimed=chestRewards.filter(ownerChestMatch).slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    let excess=claimed.length+unusedPending.length-expectedChests;
    if(excess<=0)return;

    const cancelPending=unusedPending.slice(0,excess);
    excess-=cancelPending.length;
    if(cancelPending.length){
      cancelPending.forEach(c=>db.from('chest_pending').delete().eq('id',c.id).then(({error})=>{if(error)console.error('[reconcileChestAfterSpinRemoval] chest_pending',error);}));
      setChestPending(u=>u.filter(c=>!cancelPending.some(x=>sameId(x.id,c.id))));
    }
    if(excess>0){
      const revoke=claimed.slice(0,excess);
      revoke.forEach(c=>db.from('chest_rewards').delete().eq('id',c.id).then(({error})=>{if(error)console.error('[reconcileChestAfterSpinRemoval] chest_rewards',error);}));
      setChestRewards(u=>u.filter(c=>!revoke.some(x=>sameId(x.id,c.id))));
    }
  }

  async function addSpinReward(seekId,jrId,referralId,value){
    const{data:saved,error}=await db.from('spin_rewards').insert({seek_id:seekId||null,jr_id:jrId||null,referral_id:referralId?String(referralId):null,value,used:true}).select().single();
    if(error){console.error('[addSpinReward]',error);return;}
    const newSpin=mSpin(saved);
    setSpinRewards(u=>[...u,newSpin]);
    // Cofre libera a cada 5 giros DISTINTOS (1 por indicação) já registrados de fato — retries pagos (value<0
    // é o débito, e mesmo o giro grátis resultante reaproveita o referralId da última indicação) não contam de novo,
    // evitando dessincronizar do nº real de giros.
    if(referralId&&value>=0){
      const ownerMatch=s=>jrId?sameId(s.jrId,jrId):sameId(s.seekId,seekId);
      const alreadyCounted=spinRewards.some(s=>ownerMatch(s)&&sameId(s.referralId,referralId));
      if(!alreadyCounted){
        const distinctCount=new Set(spinRewards.filter(ownerMatch).map(s=>String(s.referralId))).size+1;
        if(distinctCount%5===0){
          if(jrId)addChestPending(null,String(jrId));else addChestPending(String(seekId),null);
        }
      }
    }
  }

    const {error:spinErr}=await db.from('spin_rewards').update({paid:newPaid}).eq('referral_id',String(rid));
    if(spinErr)console.error('[toggleJrPaid] spin_rewards erro:',spinErr);
    let {error}=await db.from('jr_referrals').update({paid:newPaid,status:newStatus,paid_at:paidAt}).eq('id',rid);
    if(error&&error.code==='42703')({error}=await db.from('jr_referrals').update({paid:newPaid}).eq('id',rid));
    if(error){console.error('[toggleJrPaid]',error);setJrReferrals(u=>u.map(r=>sameId(r.id,rid)?{...r,paid:ref.paid,status:ref.status,paidAt:ref.paidAt}:r));}
  }

  async function deleteJrReferral(rid){
    const ref=jrReferrals.find(r=>sameId(r.id,rid));
    await Promise.all([
      db.from('jr_referrals').delete().eq('id',rid),
      db.from('spin_rewards').delete().eq('referral_id',String(rid)),
      db.from('spin_pending').delete().eq('referral_id',String(rid)),
    ]);
    setJrReferrals(u=>u.filter(r=>r.id!==rid));
    setPendingSpins(u=>u.filter(s=>!sameId(s.referralId,rid)));
    const remainingSpins=spinRewards.filter(s=>!sameId(s.referralId,rid));
    setSpinRewards(remainingSpins);
    if(ref)reconcileChestAfterSpinRemoval(null,ref.jrId,remainingSpins);
  }

  async function dismissLevelNotif(notifId){
    await db.from('level_notifs').update({dismissed:true}).eq('id',notifId);
    setLevelNotifs(u=>u.map(n=>sameId(n.id,notifId)?{...n,dismissed:true}:n));
  }

  async function addOffer(data){
    const {data:saved,error}=await db.from('offers').insert({url:data.url,caption:data.caption||'',category:data.category||'zero-km'}).select().single();
    if(error){console.error('[addOffer]',error);setDbError('Erro ao salvar oferta: '+error.message);return;}
    setOffers(u=>[...u,mOffer(saved)]);
  }

  async function deleteOffer(id){
    await db.from('offers').delete().eq('id',id);
    setOffers(u=>u.filter(o=>o.id!==id));
  }

  async function markRead(id,type){
    console.log('[markRead] chamado id='+id+' type='+type);
    if(type==='forgot'){
      setPassReqs(u=>u.map(r=>sameId(r.id,id)?{...r,resolved:true}:r));
      const {error}=await db.from('pass_requests').update({resolved:true}).eq('id',id);
      if(error)console.error('[markRead] pass_requests erro:',error);
      else console.log('[markRead] pass_requests ok');
    } else if(type==='jr'){
      setSeekJrs(u=>u.map(j=>sameId(j.id,id)?{...j,isNew:false}:j));
      const {error}=await db.from('seek_jrs').update({is_new:false}).eq('id',id);
      if(error)console.error('[markRead] seek_jrs erro:',error);
      else console.log('[markRead] seek_jrs ok');
    } else {
      const inRefs=referrals.some(r=>sameId(r.id,id));
      console.log('[markRead] ref — inRefs:'+inRefs+' id:'+id);
      setReferrals(u=>u.map(r=>sameId(r.id,id)?{...r,isNew:false}:r));
      setJrReferrals(u=>u.map(r=>sameId(r.id,id)?{...r,isNew:false}:r));
      const table=inRefs?'referrals':'jr_referrals';
      const {error}=await db.from(table).update({is_new:false}).eq('id',id);
      if(error)console.error('[markRead] '+table+' erro:',error);
      else console.log('[markRead] '+table+' ok id:'+id);
    }
  }

  function getPanel(){
    if(loading)return<Spinner/>;
    if(!session){
      return<LoginScreen onLogin={s=>{console.log('[SEEK route] onLogin received session:',s);setSession(s);}} credentials={credentials} members={members} seekJrs={seekJrs}/>;
    }
    console.log('[SEEK route] rendering for session:',session);

    /* Primeiro acesso: se o PIN é 0000, exigir troca antes de entrar no painel */
    if(session.role!=='master'){
      let firstKey=null;
      let firstName=null;
      if(session.role==='adm'){
        firstKey=`adm_${session.admId}`;
        const adm=adms.find(a=>sameId(a.id,session.admId));
        firstName=adm?adm.name:null;
      } else if(session.role==='member'){
        firstKey=String(session.memberId);
        const mb=members.find(m=>sameId(m.id,session.memberId));
        firstName=mb?mb.name:null;
      } else if(session.role==='jr'){
        firstKey=`jr_${session.jrId}`;
        const jr=seekJrs.find(j=>sameId(j.id,session.jrId));
        firstName=jr?jr.name:null;
      }
      const currentPin=(credentials[firstKey]||{}).pin||'0000';
      if(currentPin==='0000'){
        return<FirstLoginScreen userName={firstName} onSave={newPin=>updatePin(firstKey,newPin)} onLogout={()=>setSession(null)}/>;
      }
    }

    if(session.role==='jr'){
      const jr=seekJrs.find(j=>sameId(j.id,session.jrId));
      if(!jr){
        console.error('[SEEK route] JR routing FAILED — no seekJrs entry matches session.jrId.',{sessionJrId:session.jrId,availableJrIds:seekJrs.map(j=>j.id)});
        return<div style={{padding:40,textAlign:'center'}}>JR não encontrado. <button className="btn" onClick={()=>setSession(null)}>Sair</button></div>;
      }
      const seekMember=members.find(m=>sameId(m.id,jr.seekId));
      if(!seekMember){console.warn('[SEEK route] JR found, but its parent SEEK member was not found — JR panel will render with seekMember=undefined.',{jrSeekId:jr.seekId,availableMemberIds:members.map(m=>m.id)});}
      else{console.log(`[SEEK route] JR PANEL — jr="${jr.name}" (id=${jr.id}) seekMember="${seekMember.name}" (id=${seekMember.id})`);}
      const jrPending=pendingSpins.filter(s=>sameId(s.jrId,jr.id));
      const{index:jrSpinIndex,total:jrSpinTotal}=spinBatchInfo('jr_'+jr.id,jrPending.length);
      if(jrPending.length>0){const first=jrPending[0];return<SpinModal key={first.id} seekerName={jr.name} spinIndex={jrSpinIndex} spinTotal={jrSpinTotal} onResult={v=>addSpinReward(null,String(jr.id),first.referralId,v)} onClose={()=>consumeSpinPending(first.id)}/>;}
      const jrChests=chestPending.filter(c=>sameId(c.jrId,jr.id));
      if(jrChests.length>0){
        const first=jrChests[0];
        const jrLastRef=jrReferrals.filter(r=>sameId(r.jrId,jr.id)).slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0))[0];
        return<ChestModal seekerName={jr.name} onResult={v=>addChestReward(null,String(jr.id),v)} onClose={()=>consumeChestPending(first.id)} onRetrySpin={jrLastRef?()=>{addSpinReward(null,String(jr.id),jrLastRef.id,-5);addSpinPending(null,String(jr.id),jrLastRef.id);}:null}/>;
      }
      return<SeekJrPanel jr={jr} referrals={jrReferrals} seekMember={seekMember} credentials={credentials} onLogout={()=>setSession(null)} onAddReferral={addJrReferral} onChangePin={updatePin} offers={offers} spinRewards={spinRewards} chestRewards={chestRewards} minigameScores={minigameScores} onSaveMinigameScore={saveMinigameScore} challengeConfigs={challengeConfigs}/>;
    }
    if(session.role==='member'){
      const member=members.find(m=>sameId(m.id,session.memberId));
      if(!member){
        console.error('[SEEK route] SEEK routing FAILED — no members entry matches session.memberId.',{sessionMemberId:session.memberId,availableMemberIds:members.map(m=>m.id)});
        return<div style={{padding:40,textAlign:'center'}}>Membro não encontrado. <button className="btn" onClick={()=>setSession(null)}>Sair</button></div>;
      }
      console.log(`[SEEK route] SEEK PANEL — member="${member.name}" (id=${member.id})`);
      const memberPending=pendingSpins.filter(s=>sameId(s.seekId,member.id));
      const{index:memberSpinIndex,total:memberSpinTotal}=spinBatchInfo('seek_'+member.id,memberPending.length);
      if(memberPending.length>0){const first=memberPending[0];return<SpinModal key={first.id} seekerName={member.name} spinIndex={memberSpinIndex} spinTotal={memberSpinTotal} onResult={v=>addSpinReward(String(member.id),null,first.referralId,v)} onClose={()=>consumeSpinPending(first.id)}/>;}
      const memberChests=chestPending.filter(c=>sameId(c.seekId,member.id));
      if(memberChests.length>0){
        const first=memberChests[0];
        const memberLastRef=referrals.filter(r=>sameId(r.memberId,member.id)).slice().sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0))[0];
        return<ChestModal seekerName={member.name} onResult={v=>addChestReward(String(member.id),null,v)} onClose={()=>consumeChestPending(first.id)} onRetrySpin={memberLastRef?()=>{addSpinReward(String(member.id),null,memberLastRef.id,-5);addSpinPending(String(member.id),null,memberLastRef.id);}:null}/>;
      }
      return<MemberPanel member={member} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} onLogout={()=>setSession(null)} onAddReferral={data=>addReferral(data,member.id)} onAddJr={addSeekJr} onChangePin={updatePin} levelNotifs={levelNotifs} onDismissNotif={dismissLevelNotif} offers={offers} spinRewards={spinRewards} chestRewards={chestRewards} minigameScores={minigameScores} onSaveMinigameScore={saveMinigameScore} challengeConfigs={challengeConfigs}/>;
    }
    if(session.role==='master'){
      return<MasterPanel adms={adms} members={members} referrals={referrals} jrReferrals={jrReferrals} seekJrs={seekJrs} credentials={credentials} offers={offers} passReqs={passReqs} levelNotifs={levelNotifs} onLogout={()=>setSession(null)} onAddAdm={addAdm} onDeleteAdm={deleteAdm} onAddMember={addMember} onUpdateMember={updateMember} onDeleteMember={deleteMember} onUpdatePin={updatePin} onDeleteReferral={deleteReferral} onAddSeekJr={addSeekJr} onDeleteSeekJr={deleteSeekJr} onDeleteJrReferral={deleteJrReferral} onAddOffer={addOffer} onDeleteOffer={deleteOffer} onMarkRead={markRead} spinRewards={spinRewards} chestRewards={chestRewards} challengeConfigs={challengeConfigs} onRefresh={refreshLedgerData} refreshing={refreshingLedger}/>;
    }
    if(session.role==='adm'){
      const adm=adms.find(a=>sameId(a.id,session.admId));
      if(!adm)return<div style={{padding:40,textAlign:'center'}}>Vendedor não encontrado. <button className="btn" onClick={()=>setSession(null)}>Sair</button></div>;
      const myMembers=members.filter(m=>sameId(m.admId,adm.id));
      const mySeekJrs=seekJrs.filter(j=>myMembers.some(m=>sameId(m.id,j.seekId)));
      const myReferrals=referrals.filter(r=>myMembers.some(m=>sameId(m.id,r.memberId)));
      const myJrReferrals=jrReferrals.filter(r=>mySeekJrs.some(j=>sameId(j.id,r.jrId)));
      return<VendedorPanel adm={adm} members={myMembers} referrals={myReferrals} jrReferrals={myJrReferrals} seekJrs={mySeekJrs} credentials={credentials} offers={offers} passReqs={passReqs} levelNotifs={levelNotifs} onLogout={()=>setSession(null)} onAddMember={addMember} onUpdateMember={updateMember} onDeleteMember={deleteMember} onUpdatePin={updatePin} onAddReferral={addReferral} onUpdateReferral={updateReferral} onTogglePaid={togglePaid} onDeleteReferral={deleteReferral} onAddSeekJr={addSeekJr} onDeleteSeekJr={deleteSeekJr} onAddJrReferral={addJrReferral} onToggleJrPaid={toggleJrPaid} onDeleteJrReferral={deleteJrReferral} onAddOffer={addOffer} onDeleteOffer={deleteOffer} onMarkRead={markRead} spinRewards={spinRewards} chestRewards={chestRewards} onMarkSold={markReferralSold} onUpdateJrReferral={updateJrReferral} onToggleSpinPaid={toggleSpinPaid} onPayAllForSeek={payAllForSeek} onPayAllForJr={payAllForJr} challengeConfigs={challengeConfigs} onSaveChallengeConfig={saveChallengeConfig}/>;
    }
    return null;
  }

  return<React.Fragment>
    {getPanel()}
    {dbError&&<div style={{position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',background:'#C0392B',color:'#fff',padding:'12px 20px',borderRadius:12,zIndex:9999,fontSize:'.82rem',fontWeight:700,maxWidth:'92vw',textAlign:'center',boxShadow:'0 4px 20px rgba(0,0,0,.4)',display:'flex',alignItems:'center',gap:12}}>
      <span>⚠️ {dbError}</span>
      <button onClick={()=>setDbError(null)} style={{background:'none',border:'1px solid rgba(255,255,255,.5)',color:'#fff',padding:'3px 10px',borderRadius:6,cursor:'pointer',fontFamily:'inherit',fontWeight:700,flexShrink:0}}>✕</button>
    </div>}
  </React.Fragment>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
